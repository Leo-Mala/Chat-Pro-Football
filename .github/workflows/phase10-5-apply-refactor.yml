name: Phase 10.5 Apply Refactor

on:
  push:
    branches:
      - agent/phase-10-5
    paths:
      - 'tools/phase10_5/apply_viewmodel_refactor.py'
      - '.github/workflows/phase10-5-apply-refactor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 10.5 branch
        uses: actions/checkout@v6
        with:
          ref: agent/phase-10-5
          fetch-depth: 0

      - name: Apply fail-closed refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/phase10_5/apply_viewmodel_refactor.py
          git diff --check
          git diff --exit-code --quiet && {
            echo 'Refactor produced no diff; refusing silent success.' >&2
            exit 1
          }

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt \
                  app/src/main/java/com/example/data/daos.kt \
                  app/src/main/java/com/example/data/repository.kt
          git commit -m 'refactor: route lineup and dashboard through targeted domain flows'
          git push origin HEAD:agent/phase-10-5
