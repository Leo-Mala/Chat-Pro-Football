name: Temporary UI Transition Performance Patch

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/tmp-ui-transition-perf.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0

      - name: Apply focused transition and query patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          def replace_between(path, start_marker, end_marker, replacement):
              text = read(path)
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{path}: start marker not found: {start_marker!r}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{path}: end marker not found: {end_marker!r}')
              end += len(end_marker)
              write(path, text[:start] + replacement + text[end:])

          replace_between(
              'app/src/main/java/com/example/ui/screens/DashboardScreen.kt',
              'AnimatedContent(\n                    targetState = activeTabIndex,',
              ') { targetIndex ->',
              'key(activeTabIndex) {\n                    val targetIndex = activeTabIndex'
          )

          replace_between(
              'app/src/main/java/com/example/ui/screens/GameScreens.kt',
              'AnimatedContent(\n            targetState = screenKey,',
              ') { key ->',
              'key(screenKey) {\n            val key = screenKey'
          )

          replace_once(
              'app/src/main/java/com/example/data/daos.kt',
              '    fun getAllPlayersFlow(): Flow<List<Player>>\n',
              '    fun getAllPlayersFlow(): Flow<List<Player>>\n\n    /** UI de artilharia: evita materializar ~60k jogadores sem gols. */\n    @Query("SELECT * FROM players WHERE gols > 0 ORDER BY gols DESC, force DESC, name ASC")\n    fun getSeasonScorersFlow(): Flow<List<Player>>\n'
          )

          anchor = '    fun getPlayedFixturesForCompetitionFlow(season: Int, competitionType: String): Flow<List<Fixture>>\n'
          replace_once(
              'app/src/main/java/com/example/data/daos.kt',
              anchor,
              anchor + '\n    @Query("SELECT * FROM fixtures WHERE isPlayed = 1 AND (homeTeamId = :teamId OR awayTeamId = :teamId) ORDER BY season DESC, week ASC, matchSlot ASC, id ASC")\n    fun getPlayedFixturesForTeamFlow(teamId: Long): Flow<List<Fixture>>\n'
          )

          replace_once(
              'app/src/main/java/com/example/data/repository.kt',
              '    val allPlayersFlow: Flow<List<Player>> = db.playerDao().getAllPlayersFlow()\n',
              '    val allPlayersFlow: Flow<List<Player>> = db.playerDao().getAllPlayersFlow()\n    val seasonScorersFlow: Flow<List<Player>> = db.playerDao().getSeasonScorersFlow()\n'
          )
          replace_once(
              'app/src/main/java/com/example/data/repository.kt',
              '        db.fixtureDao().getPlayedFixturesForCompetitionFlow(season, competitionType)\n',
              '        db.fixtureDao().getPlayedFixturesForCompetitionFlow(season, competitionType)\n    fun getPlayedFixturesForTeamFlow(teamId: Long): Flow<List<Fixture>> =\n        db.fixtureDao().getPlayedFixturesForTeamFlow(teamId)\n'
          )

          vm = 'app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt'
          all_players_block = '    val allPlayers: StateFlow<List<Player>> = activeRepositoryFlow.flatMapLatest { r ->\n        r?.allPlayersFlow ?: flowOf(emptyList())\n    }.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())\n'
          replace_once(
              vm,
              all_players_block,
              all_players_block + '\n    val seasonScorers: StateFlow<List<Player>> = activeRepositoryFlow.flatMapLatest { r ->\n        r?.seasonScorersFlow ?: flowOf(emptyList())\n    }.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())\n'
          )

          played_fixture_flow = '    val playerPlayedFixtures: StateFlow<List<Fixture>> = activeRepositoryFlow.flatMapLatest { r ->\n        if (r == null) {\n            flowOf(emptyList())\n        } else {\n            r.gameSaveFlow.flatMapLatest { save ->\n                val teamId = save?.playerTeamId ?: 0L\n                if (teamId > 0L) r.getPlayedFixturesForTeamFlow(teamId) else flowOf(emptyList())\n            }\n        }\n    }.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())\n\n'
          replace_once(
              vm,
              '    val dashboardSeasonFixtures: StateFlow<List<Fixture>> = activeRepositoryFlow.flatMapLatest { r ->\n',
              played_fixture_flow + '    val dashboardSeasonFixtures: StateFlow<List<Fixture>> = activeRepositoryFlow.flatMapLatest { r ->\n'
          )

          replace_once(
              'app/src/main/java/com/example/ui/screens/StandingsScreen.kt',
              '    val allPlayers by viewModel.allPlayers.collectAsStateWithLifecycle()\n',
              '    val allPlayers by viewModel.seasonScorers.collectAsStateWithLifecycle()\n'
          )
          replace_once(
              'app/src/main/java/com/example/ui/screens/CoachScreen.kt',
              '    val allPlayers by viewModel.allPlayers.collectAsStateWithLifecycle()\n',
              '    val allPlayers by viewModel.seasonScorers.collectAsStateWithLifecycle()\n'
          )
          replace_once(
              'app/src/main/java/com/example/ui/screens/CoachScreen.kt',
              '    val allFixtures by viewModel.allFixtures.collectAsStateWithLifecycle()\n',
              '    val allFixtures by viewModel.playerPlayedFixtures.collectAsStateWithLifecycle()\n'
          )

          transfers = 'app/src/main/java/com/example/ui/screens/TransfersScreen.kt'
          replace_once(
              transfers,
              'import com.example.ui.viewmodel.*\n',
              'import com.example.ui.viewmodel.*\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.withContext\n'
          )
          text = read(transfers)
          start_marker = 'val availablePlayers = remember(allPlayers, save?.playerTeamId, searchQuery, searchPos, searchMinForce, searchMaxAge, searchMaxPrice, searchSortBy) {'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('TransfersScreen.kt: availablePlayers start not found')
          end_marker = '        }.take(80)\n    }'
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('TransfersScreen.kt: availablePlayers end not found')
          end += len(end_marker)
          market_lines = [
              'var availablePlayers by remember { mutableStateOf<List<Player>>(emptyList()) }',
              '    LaunchedEffect(',
              '        allPlayers,',
              '        save?.playerTeamId,',
              '        searchQuery,',
              '        searchPos,',
              '        searchMinForce,',
              '        searchMaxAge,',
              '        searchMaxPrice,',
              '        searchSortBy',
              '    ) {',
              '        availablePlayers = withContext(Dispatchers.Default) {',
              '            allPlayers.filter { player ->',
              '                player.isTransferMarketCandidateFor(save?.playerTeamId) &&',
              '                (searchQuery.isBlank() || player.name.contains(searchQuery, ignoreCase = true)) &&',
              '                (searchPos == "TODOS" || player.position == searchPos) &&',
              '                player.force >= searchMinForce &&',
              '                player.age <= searchMaxAge &&',
              '                (searchMaxPrice >= 500_000_000L || viewModel.getDynamicPlayerPrice(player) <= searchMaxPrice)',
              '            }.let { filtered ->',
              '                when (searchSortBy) {',
              '                    "FORCA_DESC" -> filtered.sortedByDescending { it.force }',
              '                    "FORCA_ASC" -> filtered.sortedBy { it.force }',
              '                    "IDADE_ASC" -> filtered.sortedBy { it.age }',
              '                    "IDADE_DESC" -> filtered.sortedByDescending { it.age }',
              '                    "NOME" -> filtered.sortedBy { it.name }',
              '                    "VALOR_ASC" -> filtered.sortedBy { viewModel.getDynamicPlayerPrice(it) }',
              '                    "VALOR_DESC" -> filtered.sortedByDescending { viewModel.getDynamicPlayerPrice(it) }',
              '                    else -> filtered',
              '                }',
              '            }.take(80)',
              '        }',
              '    }',
          ]
          replacement = '\n'.join(market_lines)
          write(transfers, text[:start] + replacement + text[end:])
          PY

      - name: Commit production patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/example/data/daos.kt \
            app/src/main/java/com/example/data/repository.kt \
            app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt \
            app/src/main/java/com/example/ui/screens/DashboardScreen.kt \
            app/src/main/java/com/example/ui/screens/GameScreens.kt \
            app/src/main/java/com/example/ui/screens/StandingsScreen.kt \
            app/src/main/java/com/example/ui/screens/CoachScreen.kt \
            app/src/main/java/com/example/ui/screens/TransfersScreen.kt
          git rm .github/workflows/tmp-ui-transition-perf.yml
          git diff --cached --check
          git commit -m "perf: remove transition jank from career navigation"
          git push origin HEAD:fix/3.0.1-manual-test-bugs
