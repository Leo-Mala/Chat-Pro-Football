name: FC26 Club Mapping Expansion

on:
  pull_request:
    branches: [ "main", "master" ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/src/main/java/com/example/data/Fc26ClubMatcher.kt'
      - 'app/src/main/java/com/example/data/Fc26ClubMappingRegistry.kt'
      - 'app/src/test/java/com/example/data/Fc26ClubMatcherTest.kt'
      - 'app/src/test/java/com/example/data/Fc26ExplicitTemplateMappingTest.kt'
      - 'app/src/test/java/com/example/data/Fc26ClubCandidateReportTest.kt'
      - 'reports/fc26_unmatched_candidates.json'
      - 'reports/fc26_missing_target_clubs.json'
      - '.github/workflows/fc26-club-mapping.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fc26-club-mapping-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          else
            cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF
          fi

      - name: Run FC26 club mapping diagnostics
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            --tests com.example.data.Fc26ClubMatcherTest \
            --tests com.example.data.Fc26ExplicitTemplateMappingTest \
            --tests com.example.data.Fc26ClubCandidateReportTest \
            --tests com.example.data.Fc26FullSeedIntegrationTest \
            --stacktrace

      - name: Validate diagnostics policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          candidates = json.loads(Path('reports/fc26_unmatched_candidates.json').read_text())
          missing = json.loads(Path('reports/fc26_missing_target_clubs.json').read_text())
          assert candidates['policy']['candidateScoresAreReviewOnly'] is True
          assert candidates['policy']['fuzzyCandidatesCanAutoMatch'] is False
          assert candidates['policy']['sourceLeagueCountryAloneCanMatch'] is False
          assert candidates['unresolvedClubs'] == len(candidates['clubs'])
          assert missing['stableTargetsMissing'] == len(missing['clubs'])
          print('FC26 club candidate diagnostics policy validated')
          PY

      - name: Upload FC26 club mapping diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fc26-club-mapping-diagnostics
          path: |
            reports/fc26_club_mapping_report.json
            reports/fc26_unmatched_candidates.json
            reports/fc26_missing_target_clubs.json
          if-no-files-found: error
