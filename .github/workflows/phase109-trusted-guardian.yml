name: Phase 10.9 Trusted Guardian

on:
  workflow_run:
    workflows:
      - "Phase 10.9 Required Certification"
      - "Phase 10.9 PR Base Signal"
    types: [completed]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

# All status writes happen from trusted default-branch contexts only. Candidate/fork pull_request
# tokens never publish Guardian state. No shared concurrency group is used because GitHub may evict
# pending runs; V6 retains V5 generation-aware post-checks and also audits the complete statically
# declared Gradle include graph plus the production Room migration-floor enforcement.

jobs:
  validate-required-run:
    name: Trusted Guardian Gate
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Phase 10.9 Required Certification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      REQUIRED_RUN_ID: ${{ github.event.workflow_run.id }}
      REQUIRED_RUN_URL: ${{ github.event.workflow_run.html_url }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Mark candidate guardian status pending before validation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_HEAD_SHA"
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GH_REPO']; sha=os.environ['TARGET_HEAD_SHA']; token=os.environ['GH_TOKEN']
          payload=json.dumps({
              'state':'pending',
              'context':'Phase 10.9 Trusted Guardian',
              'description':'trusted default-branch validation in progress',
              'target_url':os.environ['REQUIRED_RUN_URL'],
          }).encode()
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/statuses/{sha}', data=payload, method='POST',
              headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}',
                       'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json',
                       'User-Agent':'phase109-trusted-guardian'})
          with urllib.request.urlopen(req, timeout=30) as response:
              assert 200 <= response.status < 300
          PY

      - name: Checkout trusted default-branch guardian revision only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted guardian revision and self-test V6
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -s .github/scripts/phase109_guardian.py
          test -s .github/scripts/phase109_guardian_v3.py
          test -s .github/scripts/phase109_guardian_v4.py
          test -s .github/scripts/phase109_guardian_v5.py
          test -s .github/scripts/phase109_guardian_v6.py
          test -s .github/scripts/phase109_trusted_contract.py
          python3 .github/scripts/phase109_guardian_v6.py self-test

      - name: Validate completed certification and publish post-checked success
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/phase109_guardian_v6.py validate-and-publish \
            --root . \
            --repo "$GH_REPO" \
            --token "$GH_TOKEN" \
            --run-id "$REQUIRED_RUN_ID" \
            --head "$TARGET_HEAD_SHA" \
            --target-url "$REQUIRED_RUN_URL"

      - name: Publish trusted guardian failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s .github/scripts/phase109_guardian_v6.py ]; then
            python3 .github/scripts/phase109_guardian_v6.py publish-status \
              --repo "$GH_REPO" --token "$GH_TOKEN" --sha "$TARGET_HEAD_SHA" \
              --state failure \
              --description 'trusted default-branch certification rejected' \
              --target-url "$REQUIRED_RUN_URL"
          fi

  invalidate-on-main-advance:
    name: Invalidate stale PR certifications
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAIN_SHA: ${{ github.sha }}
      GUARDIAN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify trusted main revision and self-test V6
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test '${{ github.ref }}' = 'refs/heads/main'
          python3 .github/scripts/phase109_guardian_v6.py self-test
      - name: Invalidate only certifications stale for this main generation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/phase109_guardian_v6.py invalidate-current-main \
            --repo "$GH_REPO" --token "$GH_TOKEN" --main-sha "$MAIN_SHA" \
            --target-url "$GUARDIAN_RUN_URL"

  invalidate-on-pr-base-edit:
    name: Invalidate retargeted PR certification
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Phase 10.9 PR Base Signal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNAL_RUN_ID: ${{ github.event.workflow_run.id }}
      SIGNAL_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Invalidate base-retarget signal from trusted workflow_run context
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/phase109_guardian_v6.py self-test
          python3 .github/scripts/phase109_guardian_v6.py invalidate-retarget-run \
            --repo "$GH_REPO" --token "$GH_TOKEN" --run-id "$SIGNAL_RUN_ID" \
            --target-url "$SIGNAL_RUN_URL"
