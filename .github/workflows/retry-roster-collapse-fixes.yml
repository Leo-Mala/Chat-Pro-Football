name: Retry roster collapse and availability fixes

on:
  push:
    branches:
      - fix/roster-collapse-suspension-monthly-latency-43497e24
    paths:
      - .github/workflows/retry-roster-collapse-fixes.yml
      - app/src/test/java/com/example/ui/viewmodel/SeasonSimulationContinuousRegressionTest.kt

permissions:
  contents: write

concurrency:
  group: retry-roster-collapse-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact retry head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify controlled retry source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/roster-collapse-suspension-monthly-latency-43497e24
          test "$(git rev-parse origin/fix/roster-collapse-suspension-monthly-latency-43497e24)" = "$GITHUB_SHA"
          git diff --name-only 43497e24e8f9e278f7a13586df8ce07e40b68ceb...HEAD | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/apply-roster-collapse-fixes.yml
          .github/workflows/retry-roster-collapse-fixes.yml
          app/src/test/java/com/example/ui/viewmodel/SeasonSimulationContinuousRegressionTest.kt
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Reuse exact previously focused patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-roster-collapse-fixes.yml').read_text(encoding='utf-8')
          begin = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          start = workflow.index(begin) + len(begin)
          stop = workflow.index(end, start)
          script = textwrap.dedent(workflow[start:stop])
          exec(compile(script, 'reused-roster-fix.py', 'exec'), {})
          PY
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Setup validation google-services.json
        shell: bash
        run: |
          set -euo pipefail
          cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},
            "client": [{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],
            "configuration_version":"1"
          }
          GOOGLE_EOF

      - name: Run focused regressions including corrected continuous-simulation contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PexcludeStressTests=true \
            --tests com.example.ui.viewmodel.RosterCollapseAndAvailabilityRegressionTest \
            --tests com.example.ui.viewmodel.SeasonSimulationContinuousRegressionTest \
            --tests com.example.usecase.PlayerEvolutionUseCaseTest \
            --tests com.example.usecase.MonthlyEvolutionWeekFourRegressionTest \
            --tests com.example.usecase.SeasonSimulationRegressionTest \
            --tests com.example.usecase.FullSeasonSimulationDoesNotHangRegressionTest \
            --stacktrace

      - name: Run complete non-stress regression suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest -PexcludeStressTests=true --stacktrace

      - name: Commit exact tested patch and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/roster-collapse-suspension-monthly-latency-43497e24
          test "$(git rev-parse origin/fix/roster-collapse-suspension-monthly-latency-43497e24)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-roster-collapse-fixes.yml .github/workflows/retry-roster-collapse-fixes.yml
          git add app/src/main app/src/test
          git diff --cached --check
          git commit -m "fix: preserve roster and weekly availability lifecycle"
          git push origin HEAD:fix/roster-collapse-suspension-monthly-latency-43497e24
