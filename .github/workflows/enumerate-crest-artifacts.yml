name: Enumerate retained crest artifacts

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/enumerate-crest-artifacts.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enumerate retained artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo '=== all retained artifacts created since 2026-08-29 ==='
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(.created_at >= "2026-08-29T00:00:00Z") | [.id, .name, .size_in_bytes, .workflow_run.id, .created_at] | @tsv' \
            | sort -k5,5

# Full retained-set inventory for the exact manual-test crest recovery.
# Refreshed interactively to identify every retained internal artifact that could contain the certified corpus.
# 2026-09-04: refresh retained artifact inventory after Gradle-cache recovery produced no certified corpus.
