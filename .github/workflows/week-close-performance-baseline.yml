name: Week close performance baseline

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/week-close-performance-baseline.yml
      - tools/manual_test/apply_week_close_performance_metrics.py
      - tools/manual_test/fix_week_close_benchmark_seed.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: week-close-performance-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply metrics and canonical benchmark patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/manual_test/apply_week_close_performance_metrics.py
          python3 tools/manual_test/fix_week_close_benchmark_seed.py
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Setup validation google-services.json
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF

      - name: Run week-close correctness and canonical-world baseline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest \
            --tests com.example.usecase.WeekEightClosePerformanceBenchmarkTest \
            --tests com.example.usecase.MonthlyEvolutionWeekFourRegressionTest \
            --tests com.example.data.PlayerEvolutionMonthlyEngineRegressionTest \
            --tests com.example.WeeklyFinalizationAtomicityTest \
            --tests com.example.InterruptedWeeklyCloseRecoveryTest \
            --tests com.example.ui.viewmodel.RecoveryTargetRepositoryIsolationRegressionTest \
            --stacktrace
          gradle_status=$?
          set -e
          echo '--- benchmark xml diagnostics ---'
          find app/build/test-results/testDebugUnitTest -name 'TEST-com.example.usecase.WeekEightClosePerformanceBenchmarkTest.xml' -print -exec cat {} \; || true
          if [ "$gradle_status" -ne 0 ]; then
            exit "$gradle_status"
          fi
          echo '--- measured baseline ---'
          grep -Rho 'PERF_BASELINE_WEEK8[^<]*' app/build/test-results/testDebugUnitTest || true
          test "$(grep -Rho 'PERF_BASELINE_WEEK8[^<]*' app/build/test-results/testDebugUnitTest | wc -l)" -ge 1

      - name: Commit tested instrumentation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/3.0.1-manual-test-bugs
          test "$(git rev-parse origin/fix/3.0.1-manual-test-bugs)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/viewmodel/WeekClosePerformanceMetrics.kt \
                  app/src/main/java/com/example/ui/viewmodel/GameViewModelMatch.kt \
                  app/src/test/java/com/example/usecase/WeekEightClosePerformanceBenchmarkTest.kt
          git diff --cached --check
          git commit -m 'perf: instrument weekly close stages'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
