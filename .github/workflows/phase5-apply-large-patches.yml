name: Phase5 guarded large-file patch

on:
  push:
    branches:
      - agent/v3-game-rule-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v3-game-rule-integrity
          fetch-depth: 0

      - name: Apply exact guarded replacements
        shell: python
        run: |
          from pathlib import Path

          vm = Path("app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt")
          text = vm.read_text(encoding="utf-8")
          old = "if (updatedSave.currentWeek == 1 && currentWeekNum >= 38) {"
          new = "if (updatedSave.currentWeek == 1 && currentWeekNum >= GameCalendar.WEEKS_PER_SEASON) {"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one GameViewModel season-end marker, found {text.count(old)}")
          vm.write_text(text.replace(old, new), encoding="utf-8")

          entities = Path("app/src/main/java/com/example/data/entities.kt")
          text = entities.read_text(encoding="utf-8")
          old = "val week: Int, // 1 to 38"
          new = "val week: Int, // 1 to 40 (GameCalendar.WEEKS_PER_SEASON)"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one Fixture week comment, found {text.count(old)}")
          entities.write_text(text.replace(old, new), encoding="utf-8")

      - name: Show remaining literal 38 references in production Kotlin
        run: |
          grep -RIn --include='*.kt' -E '(^|[^0-9])38([^0-9]|$)' app/src/main/java || true

      - name: Remove bootstrap workflow and commit patch
        run: |
          rm .github/workflows/phase5-apply-large-patches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove remaining 38-week season assumptions [phase5-patched]"
          git push origin HEAD:agent/v3-game-rule-integrity
