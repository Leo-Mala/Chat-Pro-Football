name: Phase7 New Game Metadata Fix

on:
  push:
    branches:
      - agent/v3-functional-validation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v3-functional-validation
          fetch-depth: 0

      - name: Persist slot metadata when a career is created
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt")
          text = path.read_text(encoding="utf-8")

          header = "    private suspend fun performStartNewGameInternal(coachName: String, teamId: Long) {\n"
          if text.count(header) != 1:
              raise SystemExit(f"Expected one new-game function header, found {text.count(header)}")
          text = text.replace(
              header,
              header + "        val saveId = _activeSaveSession.value?.slotId ?: return\n",
              1,
          )

          function_start = text.index(header)
          next_function = "\n    fun startNewGame(selectedTeamId: Long, coachName: String = \"Técnico\") {"
          function_end = text.index(next_function, function_start)
          segment = text[function_start:function_end]
          tail = "        _selectedTeamId.value = teamId\n    }\n\n"
          if not segment.endswith(tail):
              raise SystemExit("New-game function tail did not match the expected structural boundary")

          metadata_block = '''        _selectedTeamId.value = teamId

              // A newly created career must immediately be visible in the saves menu.
              // Do not rely on a later autosave/UI callback to mark the slot as occupied.
              preferencesRepo.updateSlotMetadata(
                  saveId = saveId,
                  coachName = save.coachName,
                  teamName = playerSelectedTeam?.name ?: "Sem Clube",
                  season = save.currentSeason,
                  week = save.currentWeek,
                  balance = save.bankBalance
              )
              saveSlots.value = preferencesRepo.loadSaveSlots()
          }
          '''
          segment = segment[:-len(tail)] + metadata_block
          text = text[:function_start] + segment + text[function_end:]

          if text.count("val saveId = _activeSaveSession.value?.slotId ?: return") != 1:
              raise SystemExit("New-game saveId capture was not inserted exactly once")
          if "teamName = playerSelectedTeam?.name ?: \"Sem Clube\"" not in text:
              raise SystemExit("New-game metadata persistence was not inserted")

          path.write_text(text, encoding="utf-8")

      - name: Remove bootstrap workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase7-new-game-metadata-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: mark newly created career slot as occupied [phase7-metadata]"
          git push origin HEAD:agent/v3-functional-validation
