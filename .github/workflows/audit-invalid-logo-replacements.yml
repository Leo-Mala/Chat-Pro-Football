name: Audit invalid-logo replacements

on:
  push:
    branches:
      - tmp/external-crest-audit
    paths:
      - .github/workflows/audit-invalid-logo-replacements.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Audit Atlante and Pisek crest assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p replacements/assets
          python3 - <<'PY'
          import csv, hashlib, struct, time, urllib.request
          from pathlib import Path
          targets=[
            ('México','Atlante FC','escudosdefutbol-id','2026-08-29-invalid-logo-replacement','https://escudosdefutbolyequipaciones.com/descargar.php?sub=&tipo=esc&idEscudo=14222&nombreEscudo=ATLANTE+F.C.&dominio=escudosdefutbolyequipaciones.com'),
            ('Tchéquia','FC Písek','escudosdefutbol-id','2026-08-29-invalid-logo-replacement','https://escudosdefutbolyequipaciones.com/descargar.php?sub=&tipo=esc&idEscudo=12786&nombreEscudo=F.C.+P%C3%8DSEK&dominio=escudosdefutbolyequipaciones.com'),
          ]
          out=Path('replacements'); assets=out/'assets'; rows=[]
          for country,club,kind,rev,url in targets:
            last=None
            for attempt in range(4):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Chat-Pro-Football-crest-audit/2.4'})
                with urllib.request.urlopen(req,timeout=45) as r:data=r.read(); final=r.geturl(); ctype=r.headers.get('Content-Type','')
                break
              except Exception as e:
                last=e;time.sleep(1+attempt)
            else: raise last
            assert len(data)>=33 and data.startswith(b'\x89PNG\r\n\x1a\n') and data[12:16]==b'IHDR'
            w,h,bd,ct=struct.unpack('>IIBB',data[16:26]); assert w>0 and h>0
            assert ct in (4,6) or (ct==3 and b'tRNS' in data)
            sha=hashlib.sha256(data).hexdigest(); p=assets/(sha+'.png');p.write_bytes(data)
            rows.append((country,club,kind,rev,url,url,final,ctype,len(data),'.png',sha,'assets/'+p.name))
          assert len({r[10] for r in rows})==2
          with (out/'accepted.csv').open('w',encoding='utf-8',newline='') as f:
            w=csv.writer(f);w.writerow(['country','realClubName','sourceKind','sourceRevision','sourceIdentityPath','sourceCrestPath','finalUrl','contentType','bytes','extension','sourceCrestSha256','artifactFile']);w.writerows(rows)
          print('accepted=2')
          PY
      - name: Upload replacement audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: invalid-logo-replacements-${{ github.sha }}
          path: replacements/
          if-no-files-found: error
          retention-days: 2
