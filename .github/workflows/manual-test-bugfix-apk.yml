name: Manual Test Bugfix APK

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs

permissions:
  contents: write

concurrency:
  group: manual-test-bugfix-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-career-creation:
    if: ${{ github.event.head_commit.message == 'chore: apply career perf patch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0

      - name: Remove redundant procedural roster materialization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt')
          text = path.read_text()
          old = "\n".join([
              "        // 2. Geração limpa de jogadores para todos os times",
              "        val rosterMaterializationStartedAtNs = System.nanoTime()",
              "        val allPlayersToSave = mutableListOf<Player>()",
              "        for (t in dbTeams) {",
              "            val roster = DefaultData.generateRosterForTeam(t.id, t.rating, t.name, t.country)",
              "            allPlayersToSave.addAll(roster)",
              "        }",
              "        val rosterMaterializationMs = (System.nanoTime() - rosterMaterializationStartedAtNs) / 1_000_000L",
              "",
              "        // 3. Cálculo do calendário em memória ANTES da transação do banco",
              "        val competitionCalendarStartedAtNs = System.nanoTime()",
              "        val allGeneratedFixtures = generateCalendarUseCase.generateSeasonFixtures(season, dbTeams, teamId, activeCountry)",
              "        val competitionCalendarMs = (System.nanoTime() - competitionCalendarStartedAtNs) / 1_000_000L",
              "",
          ])
          new = "\n".join([
              "        // 2. Cálculo do calendário em memória ANTES da transação do banco.",
              "        // O calendário também registra a intenção do seed factual para este mesmo repositório.",
              "        val competitionCalendarStartedAtNs = System.nanoTime()",
              "        val allGeneratedFixtures = generateCalendarUseCase.generateSeasonFixtures(season, dbTeams, teamId, activeCountry)",
              "        val competitionCalendarMs = (System.nanoTime() - competitionCalendarStartedAtNs) / 1_000_000L",
              "",
              "        // 3. Materializa o seed factual já preparado antes de gerar qualquer roster procedural global.",
              "        // Quando FC26 está disponível, savePlayers() consumirá exatamente esse seed; portanto gerar",
              "        // ~60k jogadores procedurais aqui seria trabalho descartado. Sem dataset factual, preservamos",
              "        // o fallback procedural integral e determinístico usado anteriormente.",
              "        val hasPreparedFactualSeed = EuropeanNewSaveSeedCoordinator.materializePreparedSeed(targetRepo)",
              "        val rosterMaterializationStartedAtNs = System.nanoTime()",
              "        val allPlayersToSave = if (hasPreparedFactualSeed) {",
              "            emptyList()",
              "        } else {",
              "            buildList {",
              "                for (t in dbTeams) {",
              "                    addAll(DefaultData.generateRosterForTeam(t.id, t.rating, t.name, t.country))",
              "                }",
              "            }",
              "        }",
              "        val rosterMaterializationMs = (System.nanoTime() - rosterMaterializationStartedAtNs) / 1_000_000L",
              "        Log.i(",
              "            \"CareerCreationPerformance\",",
              "            \"PreparedFactualSeed=$hasPreparedFactualSeed proceduralFallbackPlayers=${allPlayersToSave.size}\"",
              "        )",
              "",
          ])
          if old not in text:
              raise SystemExit('Expected GameViewModel career-creation block not found; refusing broad edit.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit focused performance patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          git diff --cached --check
          git commit -m 'perf: skip redundant procedural roster seed'
          git push origin HEAD:fix/3.0.1-manual-test-bugs

  focused-validation-and-apk:
    if: ${{ github.event.head_commit.message != 'chore: apply career perf patch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact bugfix head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record exact build SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "MANUAL_TEST_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Setup validation google-services.json
        shell: bash
        run: |
          set -euo pipefail
          cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF

      - name: Setup Debug Keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Run focused manual-test regression suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            -PexcludeStressTests=true \
            --tests com.example.ui.viewmodel.LiveMatchSkipRegressionTest \
            --tests com.example.data.PreCareerEditorOverridesTest \
            --tests com.example.ui.screens.EditorNavigationRegressionTest \
            --tests com.example.usecase.RestartSeasonPersistenceTest \
            --tests com.example.usecase.MarketPurchaseRefreshTest \
            --tests com.example.usecase.MarketPurchasePersistenceTest \
            --tests com.example.usecase.MatchStatisticsIdempotencyTest \
            --tests com.example.ui.viewmodel.ClubStrengthReactiveUpdateTest \
            --tests com.example.ui.viewmodel.PlayerEditorReactiveUpdateTest \
            --tests com.example.data.PlayerEvolutionRegressionTest \
            --tests com.example.usecase.CareerCreationPerformanceTest \
            --stacktrace

      - name: Build installable Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          mkdir -p manual-test-apk
          cp "$apk" "manual-test-apk/Pro-Football-manual-test-${GITHUB_SHA}.apk"
          sha256sum "manual-test-apk/Pro-Football-manual-test-${GITHUB_SHA}.apk" | tee manual-test-apk/SHA256SUMS.txt
          printf 'commit=%s\nbranch=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > manual-test-apk/BUILD_INFO.txt

      - name: Upload focused test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-test-bugfix-failure-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload exact manual-test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-test-apk-${{ github.sha }}
          path: manual-test-apk/
          if-no-files-found: error
          retention-days: 7

# Temporary write-capable patch job will be removed after the focused code edit lands.
