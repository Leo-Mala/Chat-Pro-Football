name: Temporary Qatar Crest Audit

on:
  push:
    branches:
      - tmp/external-crest-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Collect Qatar supplemental crests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qatar-audit/assets
          python3 - <<'PY'
          from __future__ import annotations
          import csv, hashlib, html, re, struct, time, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path('qatar-audit'); ASSETS=OUT/'assets'; ASSETS.mkdir(parents=True,exist_ok=True)
          UA={'User-Agent':'Mozilla/5.0 crest-audit/1.6'}
          targets={
            'Al Rayyan':('direct','https://www.qfa.qa/en/sports-club/al-rayyan-sc',['https://www.escudosdefutbolyequipaciones.com/images_esc3/AFC/QATAR/escudos/ESC_AL-RAYYAN%20S.C..png']),
            'Al Waab':('football-logos','https://football-logos.cc/qatar/al-waab/',[]),
            'Lusail':('football-logos','https://football-logos.cc/qatar/lusail/',[]),
            'Leabaib FC':('qfa','https://www.qfa.qa/en/sports-club/leabaib-fc',[]),
            'Doha':('qfa','https://www.qfa.qa/en/sports-club/doha',[]),
            'Al Thumama':('qfa','https://www.qfa.qa/en/sports-club/althumama-club',[]),
          }
          def fetch(url):
            last=None
            for i in range(3):
              try:
                req=urllib.request.Request(url,headers=UA)
                with urllib.request.urlopen(req,timeout=25) as r:return r.read(),r.headers.get('Content-Type',''),r.geturl()
              except Exception as e:last=e;time.sleep(1+i)
            raise last
          def valid(data,ctype):
            if data.startswith(b'\x89PNG\r\n\x1a\n') and len(data)>=33 and data[12:16]==b'IHDR':
              w,h,bit,color=struct.unpack('>IIBB',data[16:26]); alpha=color in (4,6) or (color==3 and b'tRNS' in data)
              if alpha:return '.png',w,h
            low=data.lower().lstrip()
            if b'<svg' in low[:4096] and b'<script' not in low and b'javascript:' not in low and b'<!entity' not in low and b'<!doctype' not in low:
              return '.svg',0,0
            return None
          rows=[]; errors=[]; seen=set()
          for club,(kind,identity,seeds) in targets.items():
            candidates=list(seeds)
            try:
              page,_,finalpage=fetch(identity); text=page.decode('utf-8',errors='replace')
              # Discover image links from page. QFA and football-logos pages use img/src or href assets.
              for attr in re.findall(r'(?:src|href)=[\"\']([^\"\']+)[\"\']',text,re.I):
                u=urllib.parse.urljoin(finalpage,html.unescape(attr))
                lu=u.casefold()
                if any(x in lu for x in ('.png','.svg','logo','crest','badge','club')): candidates.append(u)
            except Exception as e:errors.append((club,identity,'page:'+repr(e)))
            accepted=None
            # prefer SVG/PNG and larger assets, but stop on first valid candidate after de-dup preserving source order
            uniq=[]
            for u in candidates:
              if u not in uniq:uniq.append(u)
            valid_opts=[]
            for u in uniq[:120]:
              try:
                data,ctype,final=fetch(u); meta=valid(data,ctype)
                if not meta:continue
                ext,w,h=meta; digest=hashlib.sha256(data).hexdigest()
                if digest in seen:continue
                score=(1 if ext=='.svg' else 0, w*h, len(data))
                valid_opts.append((score,u,final,ctype,data,ext,w,h,digest))
              except Exception:pass
            if valid_opts:
              valid_opts.sort(reverse=True,key=lambda x:x[0]); _,u,final,ctype,data,ext,w,h,digest=valid_opts[0]
              seen.add(digest); local=digest+ext;(ASSETS/local).write_bytes(data)
              rows.append((club,kind,'2026-08-29T17:45Z-audited',identity,u,final,ctype,len(data),w,h,digest,'assets/'+local))
            else:errors.append((club,identity,'NO_VALID_TRANSPARENT_ASSET'))
          with (OUT/'qatar-six.csv').open('w',encoding='utf-8',newline='') as f:
            w=csv.writer(f);w.writerow(['clubName','sourceKind','sourceRevision','sourceIdentityPath','sourceCrestPath','finalUrl','contentType','bytes','width','height','sha256','artifactFile']);w.writerows(rows)
          with (OUT/'errors.csv').open('w',encoding='utf-8',newline='') as f:
            w=csv.writer(f);w.writerow(['clubName','source','error']);w.writerows(errors)
          (OUT/'summary.txt').write_text(f'accepted={len(rows)}/6\nunique_hashes={len(seen)}\nerrors={len(errors)}\n',encoding='utf-8')
          print((OUT/'summary.txt').read_text())
          PY

      - name: Upload Qatar audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qatar-six-${{ github.sha }}
          path: qatar-audit/
          if-no-files-found: error
          retention-days: 2
