name: Temporary Final Two Iran Crest Audit

on:
  push:
    branches:
      - tmp/external-crest-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download and validate final two Iranian crests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p iran-last-two/assets
          python3 - <<'PY'
          from __future__ import annotations
          import csv, hashlib, struct, time, urllib.request
          from pathlib import Path

          OUT=Path('iran-last-two'); ASSETS=OUT/'assets'; ASSETS.mkdir(parents=True,exist_ok=True)
          UA={'User-Agent':'Mozilla/5.0 crest-audit/1.5'}
          targets={
            'Mes Shahr-e Babak':(
              'besoccer',
              'https://www.besoccer.com/team/mes-shahr-babak',
              'https://cdn.resfu.com/img_data/equipos/119865.png?lossy=1&size=120x'
            ),
            'Mes Soongoun Varzaghan':(
              'thesportsdb',
              'https://www.thesportsdb.com/team/149384-mes-soongoun-varzaghan',
              'https://r2.thesportsdb.com/images/media/team/badge/upbkxr1727365789.png/medium'
            ),
          }
          def fetch(url):
            last=None
            for i in range(3):
              try:
                req=urllib.request.Request(url,headers=UA)
                with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read(),r.headers.get('Content-Type',''),r.geturl()
              except Exception as e:
                last=e; time.sleep(1+i)
            raise last
          rows=[]; errors=[]; seen=set()
          for club,(kind,identity,url) in targets.items():
            try:
              data,ctype,final=fetch(url)
              if not (data.startswith(b'\x89PNG\r\n\x1a\n') and len(data)>=33 and data[12:16]==b'IHDR'):
                errors.append((club,url,f'not-valid-png:{ctype}:{len(data)}')); continue
              w,h,bit,color=struct.unpack('>IIBB',data[16:26])
              alpha=color in (4,6) or (color==3 and b'tRNS' in data)
              if not alpha:
                errors.append((club,url,f'png-no-alpha:{w}x{h}:ct={color}')); continue
              digest=hashlib.sha256(data).hexdigest()
              if digest in seen:
                errors.append((club,url,'duplicate-sha')); continue
              seen.add(digest); local=f'{digest}.png'; (ASSETS/local).write_bytes(data)
              rows.append((club,kind,'2026-08-29T16:05Z-audited',identity,url,final,ctype,len(data),w,h,color,digest,f'assets/{local}'))
            except Exception as e:
              errors.append((club,url,repr(e)))
          with (OUT/'iran-last-two.csv').open('w',encoding='utf-8',newline='') as f:
            w=csv.writer(f); w.writerow(['clubName','sourceKind','sourceRevision','sourceIdentityPath','sourceCrestPath','finalUrl','contentType','bytes','width','height','colorType','sha256','artifactFile']); w.writerows(rows)
          with (OUT/'errors.csv').open('w',encoding='utf-8',newline='') as f:
            w=csv.writer(f); w.writerow(['clubName','sourceUrl','error']); w.writerows(errors)
          (OUT/'summary.txt').write_text(f'accepted={len(rows)}/2\nunique_hashes={len(seen)}\nerrors={len(errors)}\n',encoding='utf-8')
          print((OUT/'summary.txt').read_text())
          PY

      - name: Upload final two Iran audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iran-last-two-${{ github.sha }}
          path: iran-last-two/
          if-no-files-found: error
          retention-days: 2
