name: Temporary Croatia Iran Crest Audit

on:
  push:
    branches:
      - tmp/external-crest-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Collect Croatia index and selected Iran crests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crest-audit/assets
          python3 - <<'PY'
          from __future__ import annotations
          import csv, hashlib, html, re, time, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path('crest-audit'); ASSETS=OUT/'assets'; ASSETS.mkdir(parents=True, exist_ok=True)
          UA={'User-Agent':'Mozilla/5.0 crest-audit/1.3'}
          def fetch(url, attempts=3):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers=UA)
                      with urllib.request.urlopen(req,timeout=30) as r:
                          return r.read(), r.headers.get('Content-Type',''), r.geturl()
                  except Exception as exc:
                      last=exc; time.sleep(1+i)
              raise last
          def save_asset(label, source_kind, identity_path, source_url, data, ctype, final_url):
              digest=hashlib.sha256(data).hexdigest()
              if data.startswith(b'\x89PNG\r\n\x1a\n'): ext='.png'
              elif b'<svg' in data[:4096].lower(): ext='.svg'
              elif data.startswith(b'\xff\xd8\xff'): ext='.jpg'
              else: ext=Path(urllib.parse.urlsplit(final_url).path).suffix.lower() or '.bin'
              local=f'{digest}{ext}'
              (ASSETS/local).write_bytes(data)
              rows.append((label,source_kind,identity_path,source_url,final_url,ctype,len(data),digest,f'assets/{local}'))

          rows=[]; errors=[]; croatia=[]

          # Croatia: individual crest directory index.
          root='https://www.escudosdefutbolyequipaciones.com/images_esc3/UEFA/CROACIA'
          href_re=re.compile(r'href=[\"\']([^\"\']+)[\"\']',re.I)
          for folder in ('escudos','escudos_jpg'):
              base=f'{root}/{folder}/'
              try:
                  raw,_,_=fetch(base); text=raw.decode('utf-8',errors='replace')
              except Exception as exc:
                  errors.append(('Croácia',folder,base,repr(exc))); continue
              for href in href_re.findall(text):
                  name=urllib.parse.unquote(html.unescape(href)).split('/')[-1]
                  if not re.search(r'\.(?:png|jpe?g)$',name,re.I): continue
                  low=name.casefold()
                  if any(x in low for x in ('selecci','national','bandera','flag','federaci','liga','league','femen','women','u17','u19','u20','u21','u23','juvenil')): continue
                  croatia.append((name,urllib.parse.urljoin(base,href)))

          # Two version-pinned SVG sources.
          github_svg={
              'Chadormalu Ardakan':'https://raw.githubusercontent.com/JoseArroyave/football-logos/1b8e57c3ea3658001cafba18c4a6db730b420ad6/logos/iran/Chadormalu_Ardakan.svg',
              'Shams Azar':'https://raw.githubusercontent.com/JoseArroyave/football-logos/1b8e57c3ea3658001cafba18c4a6db730b420ad6/logos/iran/Shams_Azar.svg',
          }
          for label,url in github_svg.items():
              try:
                  data,ctype,final=fetch(url)
                  save_asset(label,'github-svg','JoseArroyave/football-logos@1b8e57c3ea3658001cafba18c4a6db730b420ad6',url,data,ctype,final)
              except Exception as exc: errors.append((label,'github-svg',url,repr(exc)))

          # Five individual Iranian crest downloads already identified by exact page IDs.
          escudos={
              'Khooneh Be Khooneh':'https://escudosdefutbolyequipaciones.com/descargar.php?sub=&tipo=esc&idEscudo=22803&nombreEscudo=F.C.+KHOONEH+BE+KHOONEH%28IRI%29&dominio=escudosdefutbolyequipaciones.com',
              'Hafari Ahvaz':'https://escudosdefutbolyequipaciones.com/descargar.php?sub=&tipo=esc&idEscudo=23020&nombreEscudo=HAFARI+AHVAZ+F.C.&dominio=escudosdefutbolyequipaciones.com',
              'Havadar':'https://escudosdefutbolyequipaciones.com/descargar.php?sub=&tipo=esc&idEscudo=17919&nombreEscudo=HAVADAR+S.C.&dominio=escudosdefutbolyequipaciones.com',
              'Nikapars':'https://escudosdefutbolyequipaciones.com/descargar.php?sub=&tipo=esc&idEscudo=24588&nombreEscudo=NIKAPARS+F.C.&dominio=escudosdefutbolyequipaciones.com',
              'Saba Qom':'https://escudosdefutbolyequipaciones.com/descargar.php?sub=&tipo=esc&idEscudo=3894&nombreEscudo=SABA+QOM+F.C.&dominio=escudosdefutbolyequipaciones.com',
          }
          for label,url in escudos.items():
              try:
                  data,ctype,final=fetch(url)
                  save_asset(label,'escudosdefutbol-id',url,url,data,ctype,final)
              except Exception as exc: errors.append((label,'escudosdefutbol-id',url,repr(exc)))

          # Remaining 11 selected clubs: derive logo from the exact PersianLeague table row.
          pages={
              'azadegan':'https://www.persianleague.com/iranian-leagues/table/75-azadegan-league-azadegan-league-2025-26',
              'league2':'https://www.persianleague.com/component/joomsport/table/73-iran-football%27s-2nd-division-2nd-division-2024-25',
          }
          targets={
              'Mes Shahr-e Babak':'azadegan',
              'Palayesh Naft':'azadegan',
              'Fard Alborz':'azadegan',
              'Naft Gachsaran':'azadegan',
              'Ario':'azadegan',
              'Shahrdari Nowshahr':'azadegan',
              'Shenavar Sazi':'azadegan',
              'Mes Soongoun':'azadegan',
              'Foolad Hormozgan':'league2',
              'Shahin Bandar Ameri':'league2',
              'Shahid Ghandi':'league2',
          }
          page_text={}
          for key,url in pages.items():
              try:
                  raw,_,final=fetch(url); page_text[key]=(raw.decode('utf-8',errors='replace'),final)
              except Exception as exc: errors.append((key,'persianleague-page',url,repr(exc)))
          tr_re=re.compile(r'<tr\b.*?</tr>',re.I|re.S)
          img_re=re.compile(r'<img\b[^>]*?src=[\"\']([^\"\']+)[\"\']',re.I|re.S)
          tag_re=re.compile(r'<[^>]+>')
          for label,pagekey in targets.items():
              if pagekey not in page_text: continue
              text,base=page_text[pagekey]; found=None
              for tr in tr_re.findall(text):
                  visible=html.unescape(tag_re.sub(' ',tr))
                  if label.casefold() not in visible.casefold(): continue
                  imgs=img_re.findall(tr)
                  if imgs:
                      found=urllib.parse.urljoin(base,html.unescape(imgs[0])); break
              if not found:
                  errors.append((label,'persianleague-row',pages[pagekey],'ROW_OR_IMAGE_NOT_FOUND')); continue
              try:
                  data,ctype,final=fetch(found)
                  save_asset(label,'persianleague-table',pages[pagekey],found,data,ctype,final)
              except Exception as exc: errors.append((label,'persianleague-image',found,repr(exc)))

          with (OUT/'iran-selected.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['clubName','sourceKind','sourceIdentityPath','sourceCrestPath','finalUrl','contentType','bytes','sha256','artifactFile']); w.writerows(rows)
          with (OUT/'croatia-index.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['sourceFileName','sourceUrl']); w.writerows(croatia)
          with (OUT/'errors.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['item','kind','url','error']); w.writerows(errors)
          with (OUT/'summary.txt').open('w',encoding='utf-8') as f:
              f.write(f'iran_assets_downloaded={len(rows)}/18\n')
              f.write(f'croatia_index_entries={len(croatia)}\n')
              f.write(f'errors={len(errors)}\n')
          print((OUT/'summary.txt').read_text())
          PY

      - name: Upload crest audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: croatia-iran-crest-audit-${{ github.sha }}
          path: crest-audit/
          if-no-files-found: error
          retention-days: 2
