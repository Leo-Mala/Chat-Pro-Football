name: Manual Test Bugfix APK

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-test-bugfix-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-validation-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact bugfix head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record exact build SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "MANUAL_TEST_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Setup validation google-services.json
        shell: bash
        run: |
          set -euo pipefail
          cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF

      - name: Setup Debug Keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Run focused manual-test regression suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            -PexcludeStressTests=true \
            --tests com.example.ui.viewmodel.LiveMatchSkipRegressionTest \
            --tests com.example.data.PreCareerEditorOverridesTest \
            --tests com.example.ui.screens.EditorNavigationRegressionTest \
            --tests com.example.usecase.RestartSeasonPersistenceTest \
            --tests com.example.usecase.MarketPurchaseRefreshTest \
            --tests com.example.usecase.MarketPurchasePersistenceTest \
            --tests com.example.usecase.MatchStatisticsIdempotencyTest \
            --tests com.example.ui.viewmodel.ClubStrengthReactiveUpdateTest \
            --tests com.example.ui.viewmodel.PlayerEditorReactiveUpdateTest \
            --tests com.example.data.PlayerEvolutionRegressionTest \
            --tests com.example.usecase.CareerCreationPerformanceTest \
            --tests com.example.data.CareerSeedTemplateRuntimeTest \
            --tests com.example.data.Fc26DatasetAssetTest \
            --tests com.example.data.Fc26PlayerMapperTest \
            --tests com.example.data.Fc26SeedPlannerTest \
            --stacktrace

      - name: Build installable Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          mkdir -p manual-test-apk
          cp "$apk" "manual-test-apk/Pro-Football-manual-test-${GITHUB_SHA}.apk"
          sha256sum "manual-test-apk/Pro-Football-manual-test-${GITHUB_SHA}.apk" | tee manual-test-apk/SHA256SUMS.txt
          printf 'commit=%s\nbranch=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > manual-test-apk/BUILD_INFO.txt

      - name: Upload focused test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-test-bugfix-failure-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload exact manual-test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-test-apk-${{ github.sha }}
          path: manual-test-apk/
          if-no-files-found: error
          retention-days: 7

# Focused manual-test certification for current bugfix/performance head.
