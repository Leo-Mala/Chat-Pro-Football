name: Temporary Complete Iran Crest Audit

on:
  push:
    branches:
      - tmp/external-crest-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download and validate 18 Iranian club crests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p iran-final/assets
          python3 - <<'PY'
          from __future__ import annotations
          import csv, hashlib, struct, time, urllib.request
          from pathlib import Path

          OUT=Path('iran-final'); ASSETS=OUT/'assets'
          UA={'User-Agent':'Mozilla/5.0 crest-audit/1.4'}
          REV='2026-08-29T15:55Z-audited'

          def fetch(url):
              last=None
              for i in range(3):
                  try:
                      req=urllib.request.Request(url,headers=UA)
                      with urllib.request.urlopen(req,timeout=30) as r:
                          return r.read(),r.headers.get('Content-Type',''),r.geturl()
                  except Exception as e:
                      last=e; time.sleep(1+i)
              raise last

          def classify(data):
              if data.startswith(b'\x89PNG\r\n\x1a\n') and len(data)>=33 and data[12:16]==b'IHDR':
                  w,h,bit,color=struct.unpack('>IIBB',data[16:26])
                  alpha=color in (4,6) or (color==3 and b'tRNS' in data)
                  return '.png',w,h,alpha
              if b'<svg' in data[:4096].lower():
                  folded=data.lower()
                  safe=not any(x in folded for x in (b'<!doctype',b'<!entity',b'<script',b'javascript:'))
                  return '.svg',0,0,safe
              return '',0,0,False

          clubs={
            'Chadormalu Ardakan':('github-svg','JoseArroyave/football-logos@1b8e57c3ea3658001cafba18c4a6db730b420ad6',['https://raw.githubusercontent.com/JoseArroyave/football-logos/1b8e57c3ea3658001cafba18c4a6db730b420ad6/logos/iran/Chadormalu_Ardakan.svg']),
            'Shams Azar':('github-svg','JoseArroyave/football-logos@1b8e57c3ea3658001cafba18c4a6db730b420ad6',['https://raw.githubusercontent.com/JoseArroyave/football-logos/1b8e57c3ea3658001cafba18c4a6db730b420ad6/logos/iran/Shams_Azar.svg']),
            'Khooneh Be Khooneh':('escudosdefutbol-id','ESCUDOS_IRAN_PAGE',['https://escudosdefutbolyequipaciones.com/descargar.php?sub=&tipo=esc&idEscudo=22803&nombreEscudo=F.C.+KHOONEH+BE+KHOONEH%28IRI%29&dominio=escudosdefutbolyequipaciones.com']),
            'Hafari Ahvaz':('escudosdefutbol-id','ESCUDOS_IRAN_PAGE',['https://escudosdefutbolyequipaciones.com/descargar.php?sub=&tipo=esc&idEscudo=23020&nombreEscudo=HAFARI+AHVAZ+F.C.&dominio=escudosdefutbolyequipaciones.com']),
            'Havadar':('escudosdefutbol-id','ESCUDOS_IRAN_PAGE',['https://escudosdefutbolyequipaciones.com/descargar.php?sub=&tipo=esc&idEscudo=17919&nombreEscudo=HAVADAR+S.C.&dominio=escudosdefutbolyequipaciones.com']),
            'Nikapars':('escudosdefutbol-id','ESCUDOS_IRAN_PAGE',['https://escudosdefutbolyequipaciones.com/descargar.php?sub=&tipo=esc&idEscudo=24588&nombreEscudo=NIKAPARS+F.C.&dominio=escudosdefutbolyequipaciones.com']),
            'Saba Qom':('escudosdefutbol-id','ESCUDOS_IRAN_PAGE',['https://escudosdefutbolyequipaciones.com/descargar.php?sub=&tipo=esc&idEscudo=3894&nombreEscudo=SABA+QOM+F.C.&dominio=escudosdefutbolyequipaciones.com']),
            'Mes Shahr-e Babak':('footystats','https://footystats.org/clubs/mes-shahr-e-babak-fc-707380',['https://cdn.footystats.org/img/teams/iran-mes-shahr-e-babak-fc.png','https://cdn.footystats.org/img/teams/iran-mes-shahr-e-babak-fc_thumb.png']),
            'Shahrdari Nowshahr':('besoccer','https://www.besoccer.com/team/shahrdari-noshahr-fc',['https://cdn.resfu.com/img_data/equipos/148186.png']),
            'Fard Alborz':('besoccer','https://www.besoccer.com/team/fard-alborz',['https://cdn.resfu.com/img_data/equipos/164580.png']),
            'Naft Gachsaran':('besoccer','https://www.besoccer.com/team/naft-gachsaran',['https://cdn.resfu.com/img_data/equipos/61226.png']),
            'Ario Eslamshahr':('besoccer','https://www.besoccer.com/team/fc-ario-eslamshahr',['https://cdn.resfu.com/img_data/equipos/155966.png']),
            'Palayesh Naft':('besoccer','https://www.besoccer.com/team/palayesh-naft-bandar-abbas',['https://cdn.resfu.com/img_data/equipos/164612.png']),
            'Shenavar Sazi Qeshm':('besoccer','https://www.besoccer.com/team/shenavar-sazi-qeshm',['https://cdn.resfu.com/img_data/equipos/161031.png']),
            'Mes Soongoun':('footystats','https://footystats.org/clubs/mes-soongoun-varzaghan-fc-1018639',['https://cdn.footystats.org/img/teams/iran-mes-soongoun-varzaghan-fc.png','https://cdn.footystats.org/img/teams/iran-mes-soongoun-varzaghan-fc_thumb.png']),
            'Foolad Hormozgan':('footystats+besoccer','https://footystats.org/clubs/foolad-hormozgan-1362597',['https://cdn.footystats.org/img/teams/iran-foolad-hormozgan.png','https://cdn.footystats.org/img/teams/iran-foolad-hormozgan_thumb.png','https://cdn.resfu.com/img_data/equipos/156464.png']),
            'Shahin Bandar Ameri':('footystats+besoccer','https://footystats.org/clubs/shahin-bandar-ameri-698096',['https://cdn.footystats.org/img/teams/iran-shahin-bandar-ameri.png','https://cdn.footystats.org/img/teams/iran-shahin-bandar-ameri_thumb.png','https://cdn.resfu.com/img_data/equipos/142044.png']),
            'Padyab Khalkhal':('besoccer','https://www.besoccer.com/team/kesht-va-sanat-padyab',['https://cdn.resfu.com/img_data/equipos/165018.png']),
          }
          rows=[]; errors=[]; seen_hash=set()
          for club,(kind,identity,candidates) in clubs.items():
              accepted=None
              for url in candidates:
                  try:
                      data,ctype,final=fetch(url)
                      ext,w,h,valid=classify(data)
                      if not valid:
                          errors.append((club,url,f'rejected-format-or-transparency:{ctype}:{len(data)}')); continue
                      digest=hashlib.sha256(data).hexdigest()
                      if digest in seen_hash:
                          errors.append((club,url,'duplicate-sha256')); continue
                      local=f'{digest}{ext}'; (ASSETS/local).write_bytes(data); seen_hash.add(digest)
                      accepted=(club,kind,REV,identity,url,final,ctype,len(data),w,h,digest,f'assets/{local}')
                      break
                  except Exception as e:
                      errors.append((club,url,repr(e)))
              if accepted: rows.append(accepted)
          with (OUT/'iran-18.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['clubName','sourceKind','sourceRevision','sourceIdentityPath','sourceCrestPath','finalUrl','contentType','bytes','width','height','sha256','artifactFile']); w.writerows(rows)
          with (OUT/'errors.csv').open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f); w.writerow(['clubName','sourceUrl','error']); w.writerows(errors)
          (OUT/'summary.txt').write_text(f'accepted={len(rows)}/18\nunique_hashes={len(seen_hash)}\nerrors={len(errors)}\n',encoding='utf-8')
          print((OUT/'summary.txt').read_text())
          PY

      - name: Upload final Iran audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iran-final-audit-${{ github.sha }}
          path: iran-final/
          if-no-files-found: error
          retention-days: 2
