name: Temporary Named Qatar Badge Audit

on:
  push:
    branches:
      - tmp/external-crest-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Extract named opponent badge assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qatar-named/assets
          python3 - <<'PY'
          from __future__ import annotations
          import csv, hashlib, html, re, struct, time, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          OUT=Path('qatar-named'); ASSETS=OUT/'assets'; ASSETS.mkdir(parents=True,exist_ok=True)
          UA={'User-Agent':'Mozilla/5.0 crest-audit/1.8'}
          PAGE='https://leabaibsc.com/'
          targets={'Leabaib FC':['leabaib fc','leabaib'], 'Doha':['doha'], 'Al Thumama':['althumama club','al thumama','althumama']}
          def fetch(url):
            last=None
            for i in range(3):
              try:
                req=urllib.request.Request(url,headers=UA)
                with urllib.request.urlopen(req,timeout=30) as r:return r.read(),r.headers.get('Content-Type',''),r.geturl()
              except Exception as e:last=e;time.sleep(1+i)
            raise last
          class P(HTMLParser):
            def __init__(self):super().__init__();self.images=[]
            def handle_starttag(self,tag,attrs):
              if tag.lower()!='img':return
              d=dict(attrs);src=d.get('src') or d.get('data-src') or d.get('data-lazy-src')
              alt=d.get('alt','');title=d.get('title','')
              if src:self.images.append((alt,title,src))
          rows=[];errors=[];seen=set();raw,_,final=fetch(PAGE);text=raw.decode('utf-8',errors='replace');p=P();p.feed(text)
          (OUT/'page-images.csv').write_text('alt,title,src\n'+'\n'.join('"'+a.replace('"','""')+'","'+t.replace('"','""')+'","'+s.replace('"','""')+'"' for a,t,s in p.images),encoding='utf-8')
          for club,needles in targets.items():
            matches=[]
            for alt,title,src in p.images:
              label=(alt+' '+title).casefold()
              if any(n in label for n in needles):
                matches.append((alt,title,urllib.parse.urljoin(final,html.unescape(src))))
            accepted=None
            for alt,title,u in matches:
              try:
                data,ctype,ufinal=fetch(u);low=data.lower().lstrip();ext=''
                if data.startswith(b'\x89PNG\r\n\x1a\n') and len(data)>=33 and data[12:16]==b'IHDR':ext='.png'
                elif data[:2]==b'\xff\xd8':ext='.jpg'
                elif data[:4] in (b'RIFF',):ext='.webp'
                elif b'<svg' in low[:4096] and b'<script' not in low:ext='.svg'
                if not ext:continue
                digest=hashlib.sha256(data).hexdigest()
                if digest in seen:continue
                seen.add(digest);local=digest+ext;(ASSETS/local).write_bytes(data)
                rows.append((club,'leabaibsc','2026-08-29T18:05Z-audited',PAGE,u,ufinal,alt,title,ctype,len(data),ext,digest,'assets/'+local))
                accepted=True;break
              except Exception as e:errors.append((club,u,repr(e)))
            if not accepted:errors.append((club,PAGE,'NO_NAMED_IMAGE_ASSET'))
          with (OUT/'named-badges.csv').open('w',encoding='utf-8',newline='') as f:
            w=csv.writer(f);w.writerow(['clubName','sourceKind','sourceRevision','sourceIdentityPath','sourceCrestPath','finalUrl','alt','title','contentType','bytes','extension','sha256','artifactFile']);w.writerows(rows)
          with (OUT/'errors.csv').open('w',encoding='utf-8',newline='') as f:
            w=csv.writer(f);w.writerow(['clubName','source','error']);w.writerows(errors)
          (OUT/'summary.txt').write_text(f'images_on_page={len(p.images)}\naccepted={len(rows)}/3\nunique_hashes={len(seen)}\nerrors={len(errors)}\n',encoding='utf-8')
          print((OUT/'summary.txt').read_text())
          PY

      - name: Upload named Qatar audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qatar-named-${{ github.sha }}
          path: qatar-named/
          if-no-files-found: error
          retention-days: 2
