name: Apply DB Seed Compaction Patch

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/apply-db-seed-compaction.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0

      - name: Compact lossless first-save payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Default Atributos can be stored as {} losslessly: decoder defaults every missing key to 50.
          path = Path('app/src/main/java/com/example/data/PlayerAttributes.kt')
          text = path.read_text()
          marker = '        if (atributos == null) return null\n'
          addition = (
              marker +
              '        // Atributos() representa 35 valores 50. O decoder já usa 50 para chaves ausentes,\n' +
              '        // então {} evita dezenas de MB no primeiro save sem mudar nenhum atributo.\n' +
              '        if (atributos == Atributos()) return "{}"\n'
          )
          if marker not in text or 'if (atributos == Atributos()) return "{}"' in text:
              raise SystemExit('PlayerAttributes target missing or already patched')
          path.write_text(text.replace(marker, addition, 1))

          # 2) FC26 gameplay attributes already live in Player.atributos. Keep only the import envelope here.
          path = Path('app/src/main/java/com/example/data/Fc26DatasetModels.kt')
          text = path.read_text()
          old_comment = (
              '     * legado é usado como envelope persistido para preservar identidade externa e campos FC26 sem\n'
              '     * exigir uma migração Room somente por metadados. Os atributos também ficam no topo do JSON,\n'
              '     * mantendo compatibilidade com `AtributosConverter` se algum save legado precisar do fallback.\n'
          )
          new_comment = (
              '     * legado é usado como envelope persistido para preservar identidade externa e campos FC26 sem\n'
              '     * exigir uma migração Room somente por metadados. Novos seeds não duplicam os 35 atributos aqui:\n'
              '     * eles já são persistidos, sem perda, em `Player.atributos`. Saves antigos continuam legíveis.\n'
          )
          if old_comment not in text:
              raise SystemExit('FC26 metadata comment target not found')
          text = text.replace(old_comment, new_comment, 1)
          start_marker = '        val a = player.atributos\n        val root = linkedMapOf<String, Any?>(\n'
          import_marker = '            "import" to linkedMapOf(\n'
          obj = text.find('object Fc26ImportMetadata')
          start = text.find(start_marker, obj)
          imp = text.find(import_marker, start)
          if start < 0 or imp < 0:
              raise SystemExit('FC26 metadata payload target not found')
          text = text[:start] + '        val root = linkedMapOf<String, Any?>(\n' + import_marker + text[imp + len(import_marker):]
          path.write_text(text)

          # 3) Regression: default compaction is exact and round-trips.
          path = Path('app/src/test/java/com/example/data/AtributosConverterSeedPerformanceTest.kt')
          text = path.read_text()
          marker = '    @Test\n    fun `career scale serialization avoids old multi minute allocation profile`() {'
          insert = '''    @Test
          fun `default attributes use compact lossless persistence`() {
              val converter = AtributosConverter()
              val encoded = converter.fromAtributos(Atributos())
              assertEquals("{}", encoded)
              assertEquals(Atributos(), converter.toAtributos(encoded))
          }

          '''
          if marker not in text:
              raise SystemExit('Atributos regression target not found')
          path.write_text(text.replace(marker, insert + marker, 1))

          # 4) Regression: compact FC26 envelope remains readable and no longer duplicates atributos.
          path = Path('app/src/test/java/com/example/data/Fc26PlayerMapperTest.kt')
          text = path.read_text()
          marker = '        assertTrue(mapped.atributosJson.orEmpty().contains("\\\"alternativePositions\\\":[\\\"CM\\\"]"))\n'
          addition = (
              marker +
              '        assertFalse(mapped.atributosJson.orEmpty().contains("\\\"reflexos\\\""))\n' +
              '        val metadata = mapped.sourceMetadataOrNull()\n' +
              '        assertEquals(12345L, metadata?.sourcePlayerId)\n' +
              '        assertEquals("FC26", metadata?.source)\n'
          )
          if marker not in text:
              raise SystemExit('FC26 mapper regression target not found')
          path.write_text(text.replace(marker, addition, 1))

          # 5) Keep the focused APK workflow covering this persistence optimization.
          path = Path('.github/workflows/manual-test-bugfix-apk.yml')
          text = path.read_text()
          marker = '            --tests com.example.data.Fc26SeedPlannerTest \\\n'
          if 'AtributosConverterSeedPerformanceTest' not in text:
              if marker not in text:
                  raise SystemExit('Manual-test workflow target not found')
              text = text.replace(
                  marker,
                  marker + '            --tests com.example.data.AtributosConverterSeedPerformanceTest \\\n',
                  1
              )
          path.write_text(text)
          PY

          git diff --check

      - name: Commit focused performance patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/PlayerAttributes.kt \
                  app/src/main/java/com/example/data/Fc26DatasetModels.kt \
                  app/src/test/java/com/example/data/AtributosConverterSeedPerformanceTest.kt \
                  app/src/test/java/com/example/data/Fc26PlayerMapperTest.kt \
                  .github/workflows/manual-test-bugfix-apk.yml
          git diff --cached --check
          git commit -m 'perf: compact first career persistence payloads'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
