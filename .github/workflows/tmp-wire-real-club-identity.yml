name: Temporary Wire Real Club Identity

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/tmp-wire-real-club-identity.yml

permissions:
  contents: write

jobs:
  wire-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@7a445ee88d4e23b52c33d2c6d7a07d6c0c9f4c7c
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
      - name: Setup validation google-services.json
        shell: bash
        run: |
          if [ ! -f app/google-services.json ]; then
            printf '%s\n' '{"project_info":{"project_number":"123456789","project_id":"ci-validation","storage_bucket":"ci-validation.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:0123456789abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"api_key":[{"current_key":"AIzaSyCIValidationOnly000000000000000"}]}],"configuration_version":"1"}' > app/google-services.json
          fi
      - name: Wire preserved slot identity and bundled crest lookup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          global_path = Path('app/src/main/java/com/example/data/GlobalFootballSystem.kt')
          text = global_path.read_text(encoding='utf-8')
          old = '''                val nonStableTeams = teams.filter { legacyExplicitStableSeedIdFor(country, it.name) == null }\n                val teamIndex = nonStableTeams.indexOfFirst { it.name.equals(teamName, ignoreCase = true) }'''
          new = '''                val nonStableTeams = teams.filter { legacyExplicitStableSeedIdFor(country, it.name) == null }\n                val allocationName = BrasfootRealClubIdentity.legacySlotNameFor(country, teamName) ?: teamName\n                val teamIndex = nonStableTeams.indexOfFirst { it.name.equals(allocationName, ignoreCase = true) }'''
          if old not in text:
              raise SystemExit('GlobalFootballSystem target not found')
          global_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          default_path = Path('app/src/main/java/com/example/data/DefaultData.kt')
          text = default_path.read_text(encoding='utf-8')
          old = '''    fun getLogoForTeam(name: String, country: String): String {\n        val mappedLogo = when (name) {'''
          new = '''    fun getLogoForTeam(name: String, country: String): String {\n        BrasfootRealClubIdentity.crestAssetUriFor(country, name)?.let { return it }\n\n        val mappedLogo = when (name) {'''
          if old not in text:
              raise SystemExit('DefaultData target not found')
          default_path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run focused identity tests
        run: ./gradlew testDebugUnitTest --tests com.example.data.BrasfootRealClubIdentityTest --stacktrace
      - name: Commit validated wiring and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-wire-real-club-identity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/GlobalFootballSystem.kt app/src/main/java/com/example/data/DefaultData.kt .github/workflows/tmp-wire-real-club-identity.yml
          git commit -m 'feat: preserve IDs for real club replacements'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
