name: Retest P0 Manual Test Fixes 2026-09-01

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - 'tools/manual_test/fix_p0_bounded_test_clock_20260901.py'
      - '.github/workflows/apply-p0-bounded-clock-20260901.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: retest-p0-round-20260901-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Setup validation google-services.json
        shell: bash
        run: |
          set -euo pipefail
          cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},
            "client": [{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],
            "configuration_version":"1"
          }
          GOOGLE_EOF

      - name: Apply P0 fixes and correct bounded-test clock
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/manual_test/apply_p0_round_20260901.py tools/manual_test/fix_p0_bounded_test_clock_20260901.py
          python3 tools/manual_test/apply_p0_round_20260901.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/usecase/PlayerEvolutionUseCase.kt')
          s = p.read_text()
          s = s.replace('while avoiding\\n// the pathological', 'while avoiding\n// the pathological')
          s = s.replace('monthly boundary.\\nprivate const', 'monthly boundary.\nprivate const')
          p.write_text(s)
          PY
          python3 tools/manual_test/fix_p0_bounded_test_clock_20260901.py
          git diff --check
          git diff --exit-code -- app/src/main/assets/club_crests

      - name: Run focused P0 regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            -PexcludeStressTests=true \
            --tests com.example.ui.viewmodel.PostGameReturnToCentralRegressionTest \
            --tests com.example.ui.viewmodel.LiveMatchSkipRegressionTest \
            --tests com.example.ui.viewmodel.LiveMatchPersistenceOrderingRegressionTest \
            --tests com.example.usecase.SeasonSimulationCompletionRegressionTest \
            --tests com.example.usecase.FullSeasonSimulationDoesNotHangRegressionTest \
            --tests com.example.usecase.MonthlyEvolutionWeekFourRegressionTest \
            --tests com.example.usecase.SeasonSimulationRegressionTest \
            --tests com.example.usecase.MatchStatisticsIdempotencyTest \
            --stacktrace

      - name: Assemble debug
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace

      - name: Commit tested P0 source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt \
            app/src/main/java/com/example/ui/viewmodel/GameViewModelMatch.kt \
            app/src/main/java/com/example/usecase/PlayerEvolutionUseCase.kt \
            app/src/test/java/com/example/ui/viewmodel/PostGameReturnToCentralRegressionTest.kt \
            app/src/test/java/com/example/usecase/SeasonSimulationCompletionRegressionTest.kt \
            app/src/test/java/com/example/usecase/FullSeasonSimulationDoesNotHangRegressionTest.kt
          if git diff --cached --quiet; then
            echo 'No P0 source delta to commit.'
            exit 0
          fi
          git commit -m 'fix: finalize weekly lifecycle before post-match exit'
          git pull --ff-only origin fix/3.0.1-manual-test-bugs
          git push origin HEAD:fix/3.0.1-manual-test-bugs
