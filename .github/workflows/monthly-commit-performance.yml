name: Monthly Commit Performance

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-commit-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Setup validation files
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF

      - name: Prove revision safety and measure canonical monthly commit stages
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PexcludeStressTests=true \
            --tests com.example.data.MonthlyEvolutionRevisionTrackingTest \
            --tests com.example.usecase.MonthlyCommitPerformanceBenchmarkTest \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace
          grep -Rho 'PERF_MONTHLY_COMMIT_STAGES[^<]*' app/build/test-results/testDebugUnitTest | tee /tmp/monthly-commit-performance.txt
          test -s /tmp/monthly-commit-performance.txt
          python3 - <<'PY' | tee -a /tmp/monthly-commit-performance.txt
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path('app/build/test-results/testDebugUnitTest/TEST-com.example.data.MonthlyEvolutionRevisionTrackingTest.xml')
          if not report.is_file():
              raise SystemExit(f'missing epoch regression report: {report}')
          root = ET.parse(report).getroot()
          tests = int(root.attrib.get('tests', '0'))
          failures = int(root.attrib.get('failures', '0'))
          errors = int(root.attrib.get('errors', '0'))
          skipped = int(root.attrib.get('skipped', '0'))
          if tests < 10 or failures or errors or skipped:
              raise SystemExit(
                  f'epoch regression suite incomplete: tests={tests} failures={failures} errors={errors} skipped={skipped}'
              )
          print(
              f'EPOCH_REGRESSION_TESTS tests={tests} failures={failures} errors={errors} skipped={skipped}'
          )
          PY

      - name: Upload benchmark result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monthly-commit-performance-${{ github.sha }}
          path: /tmp/monthly-commit-performance.txt
          if-no-files-found: error
          retention-days: 1
