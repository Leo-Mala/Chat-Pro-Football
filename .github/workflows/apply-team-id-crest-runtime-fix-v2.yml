name: Apply long team-id crest runtime fix

on:
  push:
    branches: [fix/3.0.1-manual-test-bugs]
    paths: [.github/workflows/apply-team-id-crest-runtime-fix-v2.yml]

permissions:
  contents: write

jobs:
  patch-compile-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact UI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def one(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=s.count(old)
              if n != 1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              p.write_text(s.replace(old,new,1), encoding='utf-8')

          one('app/src/main/java/com/example/ui/screens/GameScreens.kt',
              'fun TeamBadge(\n    teamName: String,\n    logoUrl: String?,\n    modifier: Modifier = Modifier,',
              'fun TeamBadge(\n    teamName: String,\n    logoUrl: String?,\n    teamId: Long? = null,\n    modifier: Modifier = Modifier,', 'badge-signature')
          one('app/src/main/java/com/example/ui/screens/GameScreens.kt',
              '    val badgeColor = getTeamColor(teamName, colorHex)\n    var isSuccess by remember(logoUrl) { mutableStateOf(false) }\n    val resolvedUrl = remember(logoUrl) { resolveLogoUrl(logoUrl) }\n    val isBundledPatchCrest = remember(resolvedUrl) {',
              '    val context = LocalContext.current\n    val badgeColor = getTeamColor(teamName, colorHex)\n    val fallbackUrl = remember(logoUrl) { resolveLogoUrl(logoUrl) }\n    val resolvedUrl = remember(context, teamId, fallbackUrl) {\n        BundledClubCrests.resolve(context, teamId, fallbackUrl)\n    }\n    var isSuccess by remember(resolvedUrl) { mutableStateOf(false) }\n    val isBundledPatchCrest = remember(resolvedUrl) {', 'badge-resolver')
          one('app/src/main/java/com/example/ui/screens/GameScreens.kt',
              '        val abbrev = teamName.take(2).uppercase()\n        val context = androidx.compose.ui.platform.LocalContext.current\n\n        if (!resolvedUrl.isNullOrEmpty()) {',
              '        val abbrev = teamName.take(2).uppercase()\n\n        if (!resolvedUrl.isNullOrEmpty()) {', 'badge-context')
          one('app/src/main/java/com/example/ui/screens/TeamSelectionScreen.kt',
              '                                    if (team.logoUrl != null) {\n                                        val resolvedLogo = remember(team.logoUrl) { resolveLogoUrl(team.logoUrl) }\n                                        Image(\n                                            painter = rememberAsyncImagePainter(resolvedLogo),\n                                            contentDescription = team.name,\n                                            modifier = Modifier.size(36.dp)\n                                        )\n                                    } else {\n                                        Icon(\n                                            Icons.Default.SportsSoccer,\n                                            contentDescription = null,\n                                            tint = AccentLime,\n                                            modifier = Modifier.size(24.dp)\n                                        )\n                                    }',
              '                                    TeamBadge(\n                                        teamName = team.name,\n                                        logoUrl = team.logoUrl,\n                                        teamId = team.id,\n                                        size = 44.dp\n                                    )', 'selection')
          one('app/src/main/java/com/example/ui/components/dashboard/DashboardTabContent.kt',
              '                            TeamBadge(\n                                teamName = pTeam.name,\n                                logoUrl = pTeam.logoUrl,\n                                size = 56.dp\n                            )',
              '                            TeamBadge(\n                                teamName = pTeam.name,\n                                logoUrl = pTeam.logoUrl,\n                                teamId = pTeam.id,\n                                size = 56.dp\n                            )', 'dashboard-player')
          one('app/src/main/java/com/example/ui/components/dashboard/DashboardTabContent.kt',
              '                            TeamBadge(\n                                teamName = opponentName,\n                                logoUrl = opponentLogo,\n                                size = 56.dp\n                            )',
              '                            TeamBadge(\n                                teamName = opponentName,\n                                logoUrl = opponentLogo,\n                                teamId = opponentId,\n                                size = 56.dp\n                            )', 'dashboard-opponent')
          PY

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Prepare Android validation files
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then base64 -d debug.keystore.base64 > debug.keystore; fi
          if [ ! -f debug.keystore ]; then keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug, O=Android, C=US'; fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Compile runtime and test sources
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin -PexcludeStressTests=true --stacktrace

      - name: Commit compiled UI fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/screens/GameScreens.kt app/src/main/java/com/example/ui/screens/TeamSelectionScreen.kt app/src/main/java/com/example/ui/components/dashboard/DashboardTabContent.kt
          git diff --cached --check
          git commit -m 'fix: use stable long team ids for bundled crests'
          git fetch origin fix/3.0.1-manual-test-bugs
          test "$(git rev-parse origin/fix/3.0.1-manual-test-bugs)" = "${GITHUB_SHA}"
          git push origin HEAD:fix/3.0.1-manual-test-bugs
