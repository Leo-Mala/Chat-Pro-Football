name: Diagnostic fix season simulation regression

on:
  push:
    branches:
      - diagnostics/fix-season-simulation-regression-4df4987b
    paths:
      - .github/workflows/diagnostic-fix-season-simulation-regression.yml

permissions:
  contents: write

concurrency:
  group: diagnostic-fix-season-simulation-regression
  cancel-in-progress: false

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: diagnostics/fix-season-simulation-regression-4df4987b
          fetch-depth: 0

      - name: Prove untouched production base
        shell: bash
        run: |
          set -euo pipefail
          BASE=4df4987bd9fe284acdd6c8fb081f5969e568ddc1
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --quiet "$BASE" -- app/src/main app/src/test
          echo "DIAGNOSTIC_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_BASE=$BASE"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Restore continuous season simulation and release diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          vm_path = Path('app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt')
          vm = vm_path.read_text(encoding='utf-8')

          helper_pattern = re.compile(
              r'\ninternal fun shouldPauseSeasonSimulationForExpiringContracts\(expiringContractCount: Int\): Boolean =\n\s*expiringContractCount > 0\n'
          )
          vm, helper_count = helper_pattern.subn('\n', vm, count=1)
          if helper_count != 1:
              raise SystemExit(f'Expected one contract-pause helper, found {helper_count}')

          guard_pattern = re.compile(
              r'\n\s*// Auto-simulation must never make a contract-renewal decision for the\n'
              r'\s*// human manager\. Stop before playing/closing the week so no fixture,\n'
              r'\s*// finance or contract mutation for this week has been committed yet\.\n'
              r'\s*val expiringControlledContracts =\n'
              r'\s*repo\.getControlledRosterExpiringContractCount\(save\.playerTeamId\)\n'
              r'\s*if \(shouldPauseSeasonSimulationForExpiringContracts\(expiringControlledContracts\)\) \{\n'
              r'.*?\n\s*break\n\s*\}\n',
              re.S,
          )
          vm, guard_count = guard_pattern.subn('\n', vm, count=1)
          if guard_count != 1:
              raise SystemExit(f'Expected one pre-week contract abort, found {guard_count}')

          debug_log_pattern = re.compile(
              r'\s*if \(com\.example\.BuildConfig\.DEBUG\) \{\n'
              r'\s*android\.util\.Log\.e\("GameViewModel", "Erro durante a simulação de temporada", e\)\n'
              r'\s*\}'
          )
          replacement = '\n                        android.util.Log.e("GameViewModel", "Erro durante a simulação de temporada", e)'
          vm, log_count = debug_log_pattern.subn(replacement, vm, count=1)
          if log_count != 1:
              raise SystemExit(f'Expected one debug-only simulator log, found {log_count}')

          log_line = '_simulationLogs.value = listOf("Erro na simulação: ${e.localizedMessage ?: "Erro desconhecido"}") + _simulationLogs.value'
          if vm.count(log_line) != 1:
              raise SystemExit(f'Expected one simulator error-state line, found {vm.count(log_line)}')
          vm = vm.replace(
              log_line,
              log_line + '\n                        _toastMessage.emit("Simulação interrompida: ${e.localizedMessage ?: "Erro desconhecido"}")',
              1,
          )
          vm_path.write_text(vm, encoding='utf-8')

          repo_path = Path('app/src/main/java/com/example/data/repository.kt')
          repo = repo_path.read_text(encoding='utf-8')
          repo_pattern = re.compile(
              r'\n\s*/\*\*\n'
              r'\s*\* Counts only non-loaned players currently owned by the controlled sporting roster whose\n'
              r'\s*\* contracts would expire at the next canonical weekly tick\. Season auto-simulation uses this\n'
              r'\s*\* as a fail-safe pause point so it never silently consumes the manager\'s renewal decision\.\n'
              r'\s*\* Manual week progression keeps the existing contract-expiry rule unchanged\.\n'
              r'\s*\*/\n'
              r'\s*suspend fun getControlledRosterExpiringContractCount\(teamId: Long\): Int \{.*?\n\s*\}\n',
              re.S,
          )
          repo, repo_count = repo_pattern.subn('\n', repo, count=1)
          if repo_count != 1:
              raise SystemExit(f'Expected one contract-count repository helper, found {repo_count}')
          repo_path.write_text(repo, encoding='utf-8')

          obsolete = Path('app/src/test/java/com/example/ui/viewmodel/SeasonSimulationContractGuardRegressionTest.kt')
          if not obsolete.exists():
              raise SystemExit('Expected obsolete contract-guard regression test')
          obsolete.unlink()
          PY

          if grep -R -n -E 'shouldPauseSeasonSimulationForExpiringContracts|getControlledRosterExpiringContractCount' app/src/main app/src/test; then
            echo 'Unintended contract guard still exists' >&2
            exit 1
          fi
          grep -n 'Erro durante a simulação de temporada' app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          grep -n 'Simulação interrompida' app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          git diff --check

      - name: Run complete unit regression suite
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee season-simulation-unit-test-output.log

      - name: Persist failing unit diagnostics on diagnostic branch
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -s season-simulation-unit-test-output.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f season-simulation-unit-test-output.log
          git commit -m 'test: capture season simulation regression failure'
          git push origin HEAD:diagnostics/fix-season-simulation-regression-4df4987b

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit validated repair on diagnostic branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt app/src/main/java/com/example/data/repository.kt app/src/test/java/com/example/ui/viewmodel/SeasonSimulationContractGuardRegressionTest.kt
          git diff --cached --check
          git commit -m 'fix: restore continuous season simulation'
          git push origin HEAD:diagnostics/fix-season-simulation-regression-4df4987b
