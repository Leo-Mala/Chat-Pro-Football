name: Android Monthly Batching Phase 2 Diagnostic

on:
  push:
    branches:
      - diagnostics/android-monthly-batching-phase2-4df4987b
    paths:
      - app/src/androidTest/java/com/example/usecase/MonthlyCommitPerformanceAndroidBenchmarkTest.kt
      - .github/scripts/android_monthly_benchmark_diagnostic.sh
      - .github/workflows/android-monthly-benchmark-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-monthly-batching-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monthly-benchmark-api35:
    name: Android API 35 monthly batching benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Enable KVM acceleration when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM unavailable; emulator runner will use its supported fallback."
          fi

      - name: Setup validation configuration and evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-monthly-benchmark-artifacts
          {
            echo "HEAD_SHA=${GITHUB_SHA}"
            echo "PHASE2_BASE_SHA=4df4987bd9fe284acdd6c8fb081f5969e568ddc1"
            echo "PHASE1_BASELINE_SHA=3160bf780f96d36e057cd672bdd4e4a7ec121510"
            echo "ANDROID_API=35"
            echo "DEVICE_PROFILE=pixel_6"
          } > android-monthly-benchmark-artifacts/environment.txt
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"
          cp debug.keystore ~/.android/debug.keystore

      - name: Build Debug target and benchmark instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Run benchmark on installed Android API 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/android_monthly_benchmark_diagnostic.sh

      - name: Upload Android monthly benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-monthly-batching-phase2-api35
          path: android-monthly-benchmark-artifacts/
          if-no-files-found: error
          retention-days: 7
