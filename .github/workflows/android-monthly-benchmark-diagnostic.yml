name: Android Monthly Benchmark Diagnostic

on:
  push:
    branches:
      - diagnostics/android-monthly-benchmark-3160bf7
    paths:
      - app/src/androidTest/java/com/example/usecase/MonthlyCommitPerformanceAndroidBenchmarkTest.kt
      - .github/workflows/android-monthly-benchmark-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-monthly-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monthly-benchmark-api35:
    name: Android API 35 monthly commit benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Enable KVM acceleration when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM unavailable; emulator runner will use its supported fallback."
          fi

      - name: Bootstrap deterministic FC26 asset
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fc26/bootstrap_fc26_asset.py
          python3 tools/fc26/validate_fc26.py \
            app/src/main/assets/football/fc26/fc26_players_2025-09-19.tsv.bin \
            app/src/main/assets/football/fc26/fc26_manifest.json

      - name: Setup validation configuration and Debug signing
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"
          cp debug.keystore ~/.android/debug.keystore

      - name: Build Debug target and benchmark instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Run benchmark on installed Android API 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p android-monthly-benchmark-artifacts
            target_apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
            test_apk=$(find app/build/outputs/apk/androidTest/debug -type f -name '*-androidTest.apk' -print -quit)
            test -n "$target_apk" && test -n "$test_apk"
            adb install -r "$target_apk"
            adb install -r "$test_apk"
            adb logcat -c
            set +e
            adb shell am instrument -w -r \
              -e class com.example.usecase.MonthlyCommitPerformanceAndroidBenchmarkTest \
              com.aistudio.brasfutretro.djuxzt.test/androidx.test.runner.AndroidJUnitRunner \
              | tee android-monthly-benchmark-artifacts/instrumentation.txt
            instrument_status=${PIPESTATUS[0]}
            set -e
            adb logcat -d -v threadtime \
              | grep -E 'MonthlyCommitBenchmark|PERF_ANDROID_MONTHLY_' \
              | tee android-monthly-benchmark-artifacts/logcat.txt || true
            {
              echo "HEAD_SHA=${GITHUB_SHA}"
              echo "ANDROID_API=35"
              echo "DEVICE_PROFILE=pixel_6"
              echo "INSTRUMENT_STATUS=${instrument_status}"
            } | tee android-monthly-benchmark-artifacts/environment.txt
            test "$instrument_status" -eq 0
            grep -q '^INSTRUMENTATION_CODE: -1' android-monthly-benchmark-artifacts/instrumentation.txt
            grep -q 'PERF_ANDROID_MONTHLY_COMMIT_STAGES' android-monthly-benchmark-artifacts/logcat.txt

      - name: Upload Android monthly benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-monthly-benchmark-api35
          path: android-monthly-benchmark-artifacts/
          if-no-files-found: error
          retention-days: 7
