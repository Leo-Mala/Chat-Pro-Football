name: Cleanup Temporary FC26 Branch

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/cleanup-temp-fc26-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0
      - name: Remove accidental temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete tmp/fc26-fallback-perf-patch
