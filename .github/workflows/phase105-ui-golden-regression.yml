name: Phase 10.5 UI Golden Regression

# Diagnóstico manual. A certificação completa de PR/main executa estes mesmos gates dentro de
# phase109-required-certification.yml. Mantê-los fora do gatilho automático evita duplicar runners
# em alterações leves de ícone, texto e recursos visuais.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-10-5-ui-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-critical-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact dispatch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact dispatch head
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: true

      - name: Setup validation google-services.json
        shell: bash
        run: |
          cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF

      - name: Prefetch Robolectric SDK 34 runtime with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          version='14-robolectric-10818077-i7'
          base="https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/$version"
          runtime_dir="$RUNNER_TEMP/robolectric-runtime"
          jar="android-all-instrumented-$version.jar"
          mkdir -p "$runtime_dir"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            "$base/$jar" -o "$runtime_dir/$jar"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            "$base/$jar.sha256" -o "$runtime_dir/$jar.sha256"
          expected="$(awk '{print $1}' "$runtime_dir/$jar.sha256")"
          actual="$(sha256sum "$runtime_dir/$jar" | awk '{print $1}')"
          test "$actual" = "$expected"
          test "$(stat -c%s "$runtime_dir/$jar")" -gt 100000000
          echo "ROBOLECTRIC_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Render critical product UI and accessibility gates
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            -Drobolectric.offline=true \
            -Drobolectric.dependency.dir="$ROBOLECTRIC_RUNTIME_DIR" \
            testDebugUnitTest \
            --tests com.example.MainMenuScreenshotTest \
            --tests com.example.SavesScreenshotTest \
            --tests com.example.Phase105CriticalUiGoldenTest \
            --tests com.example.Phase105AccessibilityAndResilienceTest \
            -Proborazzi.test.record=true \
            -PexcludeStressTests=true \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace

      - name: Verify pinned Phase 10.5 golden manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest='app/src/test/screenshots/phase_10_5_ui.sha256'
          test -s "$manifest"
          test "$(grep -c '^[0-9a-f]\{64\}  .*\.png$' "$manifest")" -eq 11

          # Main menu + Saves tests render directly over their tracked baselines, so verify those
          # three outputs here. Phase105CriticalUiGoldenTest independently renders the remaining
          # eight screens into build/ and fails JUnit on any SHA-256 drift.
          for name in main_menu.png saves_empty.png saves_existing.png; do
            expected="$(awk -v n="$name" '$2 == n { print $1 }' "$manifest")"
            test -n "$expected"
            actual="$(sha256sum "app/src/test/screenshots/$name" | awk '{print $1}')"
            test "$actual" = "$expected" || {
              echo "Visual regression detected in $name" >&2
              exit 1
            }
          done

      - name: Upload rendered critical UI
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-10-5-ui-golden-verification
          path: |
            app/build/phase105-golden-actual/*.png
            app/src/test/screenshots/main_menu.png
            app/src/test/screenshots/saves_empty.png
            app/src/test/screenshots/saves_existing.png
          if-no-files-found: ignore
          retention-days: 1
