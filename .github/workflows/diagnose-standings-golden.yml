name: Diagnose standings golden

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/diagnose-standings-golden.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-standings-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-standings-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CERTIFIED_CREST_DRIVE_FILE_ID: 1fPuUUDmaIut5gapYztvujNWHeRSRbtF3
      EXPECTED_ARCHIVE_SIZE: '11751550'
      EXPECTED_ARCHIVE_SHA256: 3b8419298e03a593f23c750a91fda7613f3af395dcd770c13c9f17278f265dc3
      EXPECTED_CLUB_CRESTS: '1907'
      EXPECTED_FACTUAL_CRESTS: '617'
      EXPECTED_TOTAL_CRESTS: '2524'
      EXPECTED_CREST_FINGERPRINT: d1e1d99114739fe4827a5aa37af2e0f7b71829dd87966ba406ddc622d6050e90
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Record exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "diagnostic_sha=$GITHUB_SHA"

      - name: Recover exact certified crest corpus
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/certified-crests"
          archive="$work/certified-club-crests-2524-d1e1d991.tar.zst"
          recovered="$work/recovered"
          rm -rf "$work" app/src/main/assets/club_crests
          mkdir -p "$recovered" app/src/main/assets/club_crests
          url="https://drive.usercontent.google.com/download?id=${CERTIFIED_CREST_DRIVE_FILE_ID}&export=download&confirm=t"
          curl --fail --location --show-error --silent --retry 3 --retry-all-errors "$url" --output "$archive"
          test "$(stat -c '%s' "$archive")" = "$EXPECTED_ARCHIVE_SIZE"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256"
          tar --zstd -xf "$archive" -C "$recovered"
          source_dir="$recovered/club_crests"
          test -d "$source_dir"
          club="$(find "$source_dir" -maxdepth 1 -type f -name 'club_*.webp' | wc -l)"
          factual="$(find "$source_dir" -maxdepth 1 -type f -name 'factual_*.webp' | wc -l)"
          total="$(find "$source_dir" -maxdepth 1 -type f -name '*.webp' | wc -l)"
          test "$club" = "$EXPECTED_CLUB_CRESTS"
          test "$factual" = "$EXPECTED_FACTUAL_CRESTS"
          test "$total" = "$EXPECTED_TOTAL_CRESTS"
          fingerprint="$(python3 - "$source_dir" <<'PY'
          import hashlib, pathlib, sys
          source=pathlib.Path(sys.argv[1]); h=hashlib.sha256()
          for path in sorted(source.glob('*.webp'), key=lambda p:p.name):
              canonical='assets/club_crests/'+path.name
              h.update(canonical.encode()); h.update(b'\0'); h.update(hashlib.sha256(path.read_bytes()).digest())
          print(h.hexdigest())
          PY
          )"
          test "$fingerprint" = "$EXPECTED_CREST_FINGERPRINT"
          cp "$source_dir"/*.webp app/src/main/assets/club_crests/
          printf 'club=%s\nfactual=%s\ntotal=%s\nfingerprint=%s\n' "$club" "$factual" "$total" "$fingerprint" | tee /tmp/crest-proof.txt

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Prepare Android validation files
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF

      - name: Reproduce standings golden mismatch and capture evidence
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests com.example.Phase105CriticalUiGoldenTest.criticalProductScreens_matchPersistedCareerFixture --stacktrace
          rc=$?
          set -e
          mkdir -p standings-golden-diagnostic
          cp /tmp/crest-proof.txt standings-golden-diagnostic/crest-proof.txt
          cp app/src/test/screenshots/phase_10_5_ui.sha256 standings-golden-diagnostic/expected-hashes.txt
          if [ -d app/build/phase105-golden-actual ]; then
            cp -R app/build/phase105-golden-actual standings-golden-diagnostic/actual
          fi
          if [ -f app/build/phase105-golden-actual/standings.png ]; then
            sha256sum app/build/phase105-golden-actual/standings.png | tee standings-golden-diagnostic/actual-standings.sha256
            file app/build/phase105-golden-actual/standings.png | tee standings-golden-diagnostic/actual-standings.file.txt
          else
            echo 'actual standings screenshot missing' | tee standings-golden-diagnostic/actual-standings-missing.txt
          fi
          grep 'standings.png' app/src/test/screenshots/phase_10_5_ui.sha256 | tee standings-golden-diagnostic/expected-standings.sha256 || true
          cp -R app/build/reports/tests/testDebugUnitTest standings-golden-diagnostic/test-report 2>/dev/null || true
          echo "$rc" > standings-golden-diagnostic/test-exit-code.txt
          exit "$rc"

      - name: Upload standings golden diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standings-golden-diagnostic-${{ github.sha }}
          path: standings-golden-diagnostic/
          if-no-files-found: error
          retention-days: 7
