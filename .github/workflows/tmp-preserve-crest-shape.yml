name: Temporary Preserve Crest Shape

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/tmp-preserve-crest-shape.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Setup validation google-services.json
        shell: bash
        run: |
          printf '%s\n' '{"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}' > app/google-services.json
      - name: Preserve original transparent PNG silhouette in TeamBadge
        run: python3 tools/club_realization/preserve_patch_crest_shape.py
      - name: Run focused tests and Kotlin compile
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PexcludeStressTests=true --tests com.example.data.BrasfootPatchCrestsTest --tests com.example.data.BrasfootRealClubIdentityTest kspDebugKotlin --stacktrace
      - name: Commit validated UI behavior and remove workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-preserve-crest-shape.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/screens/GameScreens.kt .github/workflows/tmp-preserve-crest-shape.yml
          git commit -m 'fix: preserve original patch crest shape'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
