name: Temporary Preserve Crest Shape

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/tmp-preserve-crest-shape.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Setup validation google-services.json
        shell: bash
        run: |
          cat << 'GOOGLE_EOF' > app/google-services.json
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          GOOGLE_EOF
      - name: Preserve original transparent PNG silhouette in TeamBadge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/screens/GameScreens.kt')
          text = p.read_text(encoding='utf-8')
          start = text.index('@Composable\nfun TeamBadge(')
          end = text.index('\n@Composable\nfun GameApp(', start)
          replacement = '''@Composable
fun TeamBadge(
    teamName: String,
    logoUrl: String?,
    modifier: Modifier = Modifier,
    size: androidx.compose.ui.unit.Dp = 44.dp,
    colorHex: String? = null
) {
    val badgeColor = getTeamColor(teamName, colorHex)
    var isSuccess by remember(logoUrl) { mutableStateOf(false) }
    val resolvedUrl = remember(logoUrl) { resolveLogoUrl(logoUrl) }
    val isBundledPatchCrest = remember(resolvedUrl) {
        BrasfootPatchCrests.isBundledAssetUri(resolvedUrl)
    }

    val containerModifier = if (isBundledPatchCrest) {
        modifier.size(size)
    } else {
        modifier
            .size(size)
            .background(
                brush = androidx.compose.ui.graphics.Brush.verticalGradient(
                    colors = listOf(
                        badgeColor.copy(alpha = 0.85f),
                        badgeColor
                    )
                ),
                shape = CircleShape
            )
            .border(2.dp, Color.White.copy(alpha = 0.8f), CircleShape)
    }

    Box(
        modifier = containerModifier,
        contentAlignment = Alignment.Center
    ) {
        val abbrev = teamName.take(2).uppercase()
        val context = androidx.compose.ui.platform.LocalContext.current

        if (!resolvedUrl.isNullOrEmpty()) {
            val imageRequest = remember(resolvedUrl) {
                coil.request.ImageRequest.Builder(context)
                    .data(resolvedUrl)
                    .crossfade(!isBundledPatchCrest)
                    .diskCachePolicy(coil.request.CachePolicy.ENABLED)
                    .memoryCachePolicy(coil.request.CachePolicy.ENABLED)
                    .build()
            }

            val painter = rememberAsyncImagePainter(
                model = imageRequest,
                onSuccess = { isSuccess = true },
                onError = { isSuccess = false }
            )
            Image(
                painter = painter,
                contentDescription = teamName,
                contentScale = ContentScale.Fit,
                modifier = if (isBundledPatchCrest) {
                    Modifier.size(size)
                } else {
                    Modifier
                        .size(size * 0.8f)
                        .clip(CircleShape)
                }
            )
        }

        if (!isSuccess) {
            val isLightColor = badgeColor.red > 0.8f && badgeColor.green > 0.8f && badgeColor.blue > 0.8f
            val textColor = if (isLightColor) Color(0xFF111111) else Color.White
            Text(
                text = abbrev,
                color = textColor,
                fontWeight = FontWeight.Black,
                fontSize = (size.value * 0.35f).sp
            )
        }
    }
}
'''
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Run focused tests and Kotlin compile
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PexcludeStressTests=true \
            --tests com.example.data.BrasfootPatchCrestsTest \
            --tests com.example.data.BrasfootRealClubIdentityTest \
            kspDebugKotlin --stacktrace
      - name: Commit validated UI behavior and remove workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-preserve-crest-shape.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/screens/GameScreens.kt .github/workflows/tmp-preserve-crest-shape.yml
          git commit -m 'fix: preserve original patch crest shape'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
