name: Recover final club input history

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/recover-final-club-input-history.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full repository refs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Locate historical materializer runs and transient heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/materializer-runs.tsv"
          : > "$out"
          for day in 2026-08-29 2026-08-30 2026-08-31 2026-09-01; do
            for page in $(seq 1 10); do
              response="$(gh api -H 'X-GitHub-Api-Version: 2022-11-28' "/repos/${GITHUB_REPOSITORY}/actions/runs?created=${day}&per_page=100&page=${page}")"
              count="$(jq '.workflow_runs | length' <<<"$response")"
              [ "$count" -gt 0 ] || break
              jq -r '.workflow_runs[] | select((.path // "") | contains("materialize-final-real-clubs.yml")) | [.id,.head_sha,.status,(.conclusion // ""),.created_at,.path] | @tsv' <<<"$response" >> "$out"
            done
          done
          sort -u "$out" -o "$out"
          echo "materializer_run_count=$(wc -l < "$out")"
          cat "$out"

          while IFS=$'\t' read -r run_id sha status conclusion created path; do
            [ -n "$sha" ] || continue
            echo "checking_run=$run_id head_sha=$sha status=$status conclusion=$conclusion created=$created"
            git fetch --no-tags --depth=1 origin "$sha" >/dev/null 2>&1 || true
            if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git ls-tree -r --name-only "$sha" | grep '^\.club-realization-input/' || true
            else
              echo "head_sha_not_fetchable=$sha"
            fi
          done < "$out"

      - name: Record deterministic recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'expected_archive_sha256=1c8c35e08715d030ea200d0f33d8095b0c165954e36bb8d65f812fe7b0788bdf'
            echo 'expected_plan_rows=1907'
            echo 'required_final_corpus=1907 club_ + 617 factual_ = 2524'
            echo 'required_final_fingerprint=d1e1d99114739fe4827a5aa37af2e0f7b71829dd87966ba406ddc622d6050e90'
          } | tee "$RUNNER_TEMP/recovery-evidence.txt"

      - name: Upload recovery diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-club-input-history-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/materializer-runs.tsv
            ${{ runner.temp }}/recovery-evidence.txt
          if-no-files-found: error
          retention-days: 7
