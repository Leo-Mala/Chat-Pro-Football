name: Recover final club input history

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/recover-final-club-input-history.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full repository refs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Scan every reachable commit for materialized crest corpus
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/crest-history.tsv"
          : > "$out"
          git rev-list --all | sort -u > "$RUNNER_TEMP/commits.txt"
          echo "reachable_commits=$(wc -l < "$RUNNER_TEMP/commits.txt")"
          while read -r sha; do
            paths="$(git ls-tree -r --name-only "$sha")"
            count="$(grep -Ec '^app/src/main/assets/club_crests/club_[^/]+\.(png|svg)$' <<<"$paths" || true)"
            factual="$(grep -Ec '^app/src/main/assets/club_crests/factual_[^/]+\.(png|svg)$' <<<"$paths" || true)"
            plan=0; manifest=0; replacement=0
            grep -qx 'docs/club-realization/validated-replacement-plan.csv' <<<"$paths" && plan=1 || true
            grep -qx 'docs/club-realization/crest-sha256.csv' <<<"$paths" && manifest=1 || true
            grep -Eq 'BrasfootRealClubReplacementData\.kt$' <<<"$paths" && replacement=1 || true
            if [ "$count" -gt 0 ] || [ "$plan" -eq 1 ] || [ "$manifest" -eq 1 ]; then
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$sha" "$count" "$factual" "$plan" "$manifest" "$replacement" >> "$out"
            fi
          done < "$RUNNER_TEMP/commits.txt"

          echo 'sha club_count factual_count validated_plan crest_manifest replacement_data'
          sort -t$'\t' -k2,2nr "$out" | head -100
          max="$(awk -F'\t' 'BEGIN{m=0} $2>m{m=$2} END{print m}' "$out")"
          echo "max_historical_club_crests=$max"
          awk -F'\t' '$2==1907 || ($4==1 && $5==1) {print}' "$out" | tee "$RUNNER_TEMP/exact-candidates.tsv"

      - name: Export strongest historical candidate if present
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(awk -F'\t' '$2==1907 && $5==1 {print $1; exit}' "$RUNNER_TEMP/exact-candidates.tsv" || true)"
          mkdir -p "$RUNNER_TEMP/candidate"
          if [ -z "$candidate" ]; then
            echo 'NO_EXACT_COMMITTED_1907_CANDIDATE' | tee "$RUNNER_TEMP/candidate/STATUS.txt"
            exit 0
          fi
          echo "$candidate" | tee "$RUNNER_TEMP/candidate/COMMIT_SHA.txt"
          git archive --format=tar "$candidate" \
            app/src/main/assets/club_crests \
            docs/club-realization \
            2>/dev/null | tar -xf - -C "$RUNNER_TEMP/candidate"
          find "$RUNNER_TEMP/candidate/app/src/main/assets/club_crests" -type f | sort | wc -l
          sha256sum "$RUNNER_TEMP/candidate"/app/src/main/assets/club_crests/* | sort > "$RUNNER_TEMP/candidate/crest-files.sha256"

      - name: Record deterministic recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'expected_archive_sha256=1c8c35e08715d030ea200d0f33d8095b0c165954e36bb8d65f812fe7b0788bdf'
            echo 'expected_plan_rows=1907'
            echo 'required_final_corpus=1907 club_ + 617 factual_ = 2524'
            echo 'required_final_fingerprint=d1e1d99114739fe4827a5aa37af2e0f7b71829dd87966ba406ddc622d6050e90'
          } | tee "$RUNNER_TEMP/recovery-evidence.txt"

      - name: Upload recovery diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: committed-crest-history-${{ github.sha }}
          path: |
            ${{ runner.temp }}/crest-history.tsv
            ${{ runner.temp }}/exact-candidates.tsv
            ${{ runner.temp }}/candidate/
            ${{ runner.temp }}/recovery-evidence.txt
          if-no-files-found: error
          retention-days: 7
