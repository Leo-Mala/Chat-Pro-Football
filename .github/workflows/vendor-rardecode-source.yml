name: Temporary audit dependency export

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs

permissions:
  contents: read

concurrency:
  group: temporary-audit-dependency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact project head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: project
          persist-credentials: false
          fetch-depth: 1

      - name: Verify and package project source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C project rev-parse HEAD)" = "${GITHUB_SHA}"
          tar --exclude='project/.git' -czf project-source.tar.gz project
          sha256sum project-source.tar.gz > PROJECT_SHA256SUMS.txt
          printf '%s\n' "${GITHUB_SHA}" > PROJECT_COMMIT.txt

      - name: Checkout exact rardecode source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: nwaples/rardecode
          ref: 4e5b2a5cc5359c6a0547de170f8518d1103cb296
          path: rardecode
          persist-credentials: false
          fetch-depth: 1

      - name: Verify rardecode source and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rardecode rev-parse HEAD)" = "4e5b2a5cc5359c6a0547de170f8518d1103cb296"
          printf '%s  %s\n' \
            '4e5b2a5cc5359c6a0547de170f8518d1103cb296' \
            'nwaples/rardecode' > SOURCE_COMMIT.txt
          tar --exclude='rardecode/.git' -czf rardecode-source.tar.gz rardecode SOURCE_COMMIT.txt
          sha256sum rardecode-source.tar.gz > RARDECODE_SHA256SUMS.txt

      - name: Download and verify javaobj-py3 wheel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip download \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --dest . \
            'javaobj-py3==0.6.1'
          test -f javaobj_py3-0.6.1-py2.py3-none-any.whl
          echo 'da97c61cb050bad37cca00523b1a617cc26ed2b698b6322cbc118820a4f52b30  javaobj_py3-0.6.1-py2.py3-none-any.whl' | sha256sum -c -

      - name: Upload audit dependencies
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: club-audit-dependencies
          path: |
            project-source.tar.gz
            PROJECT_COMMIT.txt
            PROJECT_SHA256SUMS.txt
            rardecode-source.tar.gz
            SOURCE_COMMIT.txt
            RARDECODE_SHA256SUMS.txt
            javaobj_py3-0.6.1-py2.py3-none-any.whl
          if-no-files-found: error
          retention-days: 1
