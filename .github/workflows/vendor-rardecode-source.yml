name: Temporary Wikidata club source export

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs

permissions:
  contents: read

concurrency:
  group: temporary-wikidata-club-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query Wikidata clubs with same-entity logos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          countries = {
              'Czech Republic': 'Q213',
              'Colombia': 'Q739',
              'Mexico': 'Q96',
              'Costa Rica': 'Q800',
              'Guatemala': 'Q774',
              'El Salvador': 'Q792',
              'Jamaica': 'Q766',
              'Saudi Arabia': 'Q851',
              'Iran': 'Q794',
          }
          endpoint = 'https://query.wikidata.org/sparql'
          rows = []
          for country, qid in countries.items():
              query = f'''SELECT DISTINCT ?club ?clubLabel ?logo WHERE {{
                ?club wdt:P31/wdt:P279* wd:Q476028 ;
                      wdt:P17 wd:{qid} ;
                      wdt:P154 ?logo .
                SERVICE wikibase:label {{ bd:serviceParam wikibase:language "en,es,cs,ar,fa". }}
              }} ORDER BY ?clubLabel'''
              url = endpoint + '?' + urllib.parse.urlencode({'query': query, 'format': 'json'})
              req = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'Chat-Pro-Football club identity audit/3.0.1 (GitHub Actions)'}
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = json.load(response)
              for binding in payload['results']['bindings']:
                  rows.append({
                      'country': country,
                      'wikidataId': binding['club']['value'].rsplit('/', 1)[-1],
                      'name': binding['clubLabel']['value'],
                      'logoUrl': binding['logo']['value'],
                  })
              print(country, len(payload['results']['bindings']))
              time.sleep(0.2)

          rows.sort(key=lambda row: (row['country'], row['name'].casefold(), row['wikidataId']))
          Path('wikidata_clubs_with_logos.json').write_text(
              json.dumps(rows, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          Path('SOURCE.txt').write_text(
              'Wikidata Query Service\n'
              'constraint=P31/P279* Q476028 association football club; P17 exact country; P154 logo\n',
              encoding='utf-8'
          )
          sha = hashlib.sha256(Path('wikidata_clubs_with_logos.json').read_bytes()).hexdigest()
          print('total', len(rows), 'sha256', sha)
          PY
          sha256sum wikidata_clubs_with_logos.json SOURCE.txt > SHA256SUMS.txt

      - name: Upload Wikidata audit source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wikidata-club-audit-source-${{ github.sha }}
          path: |
            wikidata_clubs_with_logos.json
            SOURCE.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
