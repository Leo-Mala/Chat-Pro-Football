name: Temporary rardecode source export

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs

permissions:
  contents: read

concurrency:
  group: temporary-rardecode-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact rardecode source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: nwaples/rardecode
          ref: 4e5b2a5cc5359c6a0547de170f8518d1103cb296
          path: rardecode
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source commit and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C rardecode rev-parse HEAD)" = "4e5b2a5cc5359c6a0547de170f8518d1103cb296"
          printf '%s  %s\n' \
            '4e5b2a5cc5359c6a0547de170f8518d1103cb296' \
            'nwaples/rardecode' > SOURCE_COMMIT.txt
          tar --exclude='rardecode/.git' -czf rardecode-source.tar.gz rardecode SOURCE_COMMIT.txt
          sha256sum rardecode-source.tar.gz > SHA256SUMS.txt

      - name: Upload source package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rardecode-source-4e5b2a5
          path: |
            rardecode-source.tar.gz
            SOURCE_COMMIT.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
