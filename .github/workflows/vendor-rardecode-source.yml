name: Temporary external club source export

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs

permissions:
  contents: read

concurrency:
  group: temporary-external-club-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact structured team dataset
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: hixcoder/football-teams-flags
          ref: c7cc76cd99ca073e939f3a893583ec7aa89a8527
          path: teams
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout independent logo repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Leo4815162342/football-logos
          ref: 32e43168524e17d4b599d1ae9069623267b23ea0
          path: logos
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source commits and filter target countries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C teams rev-parse HEAD)" = "c7cc76cd99ca073e939f3a893583ec7aa89a8527"
          test "$(git -C logos rev-parse HEAD)" = "32e43168524e17d4b599d1ae9069623267b23ea0"
          python3 - <<'PY'
          import json
          from pathlib import Path

          wanted = {
              'Saudi Arabia', 'Qatar', 'Chile', 'China', 'Colombia', 'South Korea',
              'Costa Rica', 'Egypt', 'El Salvador', 'Guatemala', 'Iran', 'Jamaica',
              'Mexico', 'Paraguay', 'Czech Republic', 'Uruguay'
          }
          data = json.loads(Path('teams/football_teams.json').read_text(encoding='utf-8'))
          selected = [
              row for row in data
              if row.get('country') in wanted
              and 'national team' not in row.get('name', '').casefold()
          ]
          selected.sort(key=lambda row: (row['country'], row['name'].casefold()))
          Path('external_teams.json').write_text(
              json.dumps(selected, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print('selected structured candidates:', len(selected))
          for country in sorted(wanted):
              print(country, sum(1 for row in selected if row['country'] == country))
          PY
          find logos -type f \( -iname '*.png' -o -iname '*.svg' -o -iname '*.webp' \) \
            -printf '%P\n' | sort > independent_logo_index.txt
          printf '%s\n' \
            'hixcoder/football-teams-flags@c7cc76cd99ca073e939f3a893583ec7aa89a8527' \
            'Leo4815162342/football-logos@32e43168524e17d4b599d1ae9069623267b23ea0' \
            > SOURCE_COMMITS.txt
          sha256sum external_teams.json independent_logo_index.txt SOURCE_COMMITS.txt > SHA256SUMS.txt

      - name: Upload external club audit sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-club-audit-sources-${{ github.sha }}
          path: |
            external_teams.json
            independent_logo_index.txt
            SOURCE_COMMITS.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
