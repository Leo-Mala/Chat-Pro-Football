name: Runtime career creation performance

on:
  push:
    branches:
      - agent/3.0.1-runtime-bugfixes
    paths:
      - .github/workflows/runtime-career-performance.yml

permissions:
  contents: read

concurrency:
  group: runtime-career-performance-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_PACKAGE: com.aistudio.brasfutretro.djuxzt
  TEST_PACKAGE: com.aistudio.brasfutretro.djuxzt.test
  TEST_RUNNER: androidx.test.runner.AndroidJUnitRunner

jobs:
  release-career-performance:
    name: Installed Release career performance
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact measurement head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Enable KVM acceleration when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Bootstrap and validate deterministic FC26 asset
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fc26/bootstrap_fc26_asset.py
          python3 tools/fc26/validate_fc26.py app/src/main/assets/football/fc26/fc26_players_2025-09-19.tsv.bin app/src/main/assets/football/fc26/fc26_manifest.json
      - name: Setup validation configuration and signing
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF
          mkdir -p ~/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          cp debug.keystore ~/.android/debug.keystore
          release_keystore="$RUNNER_TEMP/runtime-validation-release.jks"
          store_password="ci-validation-only"
          key_alias="runtime-validation"
          key_password="ci-validation-only"
          keytool -genkeypair -v -keystore "$release_keystore" -storepass "$store_password" -alias "$key_alias" -keypass "$key_password" -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Pro Football Runtime CI, O=CI, C=BR"
          {
            echo "KEYSTORE_PATH=$release_keystore"
            echo "STORE_PASSWORD=$store_password"
            echo "KEY_ALIAS=$key_alias"
            echo "KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"
      - name: Build signed Release target and instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew -PinstrumentedBuildType=release assembleRelease assembleReleaseAndroidTest bundleRelease --stacktrace
      - name: Install Release and execute real career flow
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash .github/scripts/phase107_emulator_gate.sh release release-api35
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-career-performance-evidence
          path: phase107-artifacts/release-api35/
          if-no-files-found: error
          retention-days: 1
