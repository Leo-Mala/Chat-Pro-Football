name: FC26 Remaining Lower-Tier Coverage

on:
  pull_request:
    branches: [ "main", "master" ]
    types: [opened, synchronize, reopened]
    paths:
      - 'app/src/main/java/com/example/MainApplication.kt'
      - 'app/src/main/java/com/example/data/Fc26RemainingClubCoverage2026_27.kt'
      - 'app/src/main/java/com/example/data/EuropeanAuditedLowerTierClubTargetMaterializer2026_27.kt'
      - 'app/src/main/java/com/example/data/EuropeanFactualClubTargetMaterializer2026_27.kt'
      - 'app/src/main/java/com/example/data/StableTeamIdentityRegistry.kt'
      - 'app/src/main/java/com/example/data/Fc26ClubMappingRegistry.kt'
      - 'app/src/test/java/com/example/data/EuropeanStableTeamIdentityTest.kt'
      - 'app/src/test/java/com/example/data/EuropeanAuditedLowerTierClubTargetMaterializerTest.kt'
      - 'app/src/test/java/com/example/data/Fc26RemainingLowerTierCoverageReportTest.kt'
      - 'app/src/test/java/com/example/data/Fc26FactualTargetMaterializationReportTest.kt'
      - 'reports/fc26_remaining_lower_tier_audit_phase_9_11a2.md'
      - 'reports/phase_10_4_fc26_safe_loans.md'
      - '.github/workflows/fc26-remaining-lower-tier-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fc26-remaining-lower-tier-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    # Intentionally runs for Draft PRs: Phase 9.11A2 must remain Draft until explicit merge approval.
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          else
            cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF
          fi

      - name: Setup Debug Keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Run core regressions and migration-save safety
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest -PexcludeStressTests=true --stacktrace

      - name: Validate Phase 9.11A2 acceptance policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('reports/fc26_remaining_lower_tier_coverage_report.json')
          report = json.loads(path.read_text())
          before = report['before']
          after = report['after']
          implementation = report['implementation']
          audit = report['transitionAudit']
          safety = report['safety']

          assert report['phase'] == '9.11A2'
          assert before['matchedClubs'] == 296
          assert before['unmatchedClubs'] == 364
          assert before['ambiguousClubs'] == 2
          assert before['blockedPlayers'] == 10050
          assert implementation['existingTargetNameVariants'] == 42
          assert implementation['lowerTierFactualClubs'] == 47
          assert implementation['implementedClubs'] == 89
          assert implementation['implementedPlayers'] == 2497
          assert implementation['targetTeamsBefore'] == implementation['targetTeamsAfter']
          assert after['matchedClubs'] == 385
          assert after['unmatchedClubs'] == 275
          assert after['ambiguousClubs'] == 2
          assert after['importedPlayers'] == 10852
          assert after['blockedPlayers'] == 7553
          assert audit['gainedMatches'] == 89
          assert audit['gainedPlayers'] == 2497
          assert audit['lostMatches'] == 0
          assert audit['redirectedMatches'] == 0
          assert audit['unchangedLegacyIdsChanged'] == 0
          assert safety['fuzzyAutoMatchingIntroduced'] is False
          assert safety['arbitraryAliasesIntroduced'] is False
          assert safety['fc26RatingsMutated'] is False
          assert safety['fc26PotentialMutated'] is False
          assert safety['fc26AttributesMutated'] is False
          assert safety['efootballOnlyPlayersImported'] is False
          assert safety['roomMigrationRequired'] is False
          assert safety['roomVersion'] == 21
          print('Phase 9.11A2 acceptance policy validated')
          print(json.dumps({
              'matchedClubs': after['matchedClubs'],
              'unmatchedClubs': after['unmatchedClubs'],
              'ambiguousClubs': after['ambiguousClubs'],
              'importedPlayers': after['importedPlayers'],
              'blockedPlayers': after['blockedPlayers'],
              'gainedMatches': audit['gainedMatches'],
              'lostMatches': audit['lostMatches'],
              'redirectedMatches': audit['redirectedMatches']
          }, indent=2))
          PY

      - name: Run save-slot and Room migration safety tests explicitly
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests com.example.SaveSlotIsolationTest \
            --tests com.example.migrations.MigrationSafetyTest \
            --tests com.example.migrations.MigrationCompatibilityTest \
            --stacktrace

      - name: Run 20 and 100 season stress tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests com.example.TwentySeasonStressTest \
            --tests com.example.OneHundredSeasonMatchByMatchStressTest \
            --stacktrace

      - name: Verify current Room schema
        id: room_schema
        shell: bash
        run: |
          set -euo pipefail
          db_version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('app/src/main/java/com/example/data/database.kt').read_text()
          match = re.search(r'\bversion\s*=\s*(\d+)', source)
          if not match:
              raise SystemExit('Could not resolve Room database version')
          print(match.group(1))
          PY
          )
          schema_file="app/schemas/com.example.data.AppDatabase/${db_version}.json"
          test -f "$schema_file"
          git ls-files --error-unmatch "$schema_file" >/dev/null
          echo "schema_file=$schema_file" >> "$GITHUB_OUTPUT"
          echo "Current Room schema validated and tracked: $schema_file"

      - name: Upload Phase 9.11A2 audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fc26-remaining-lower-tier-coverage
          path: |
            reports/fc26_remaining_lower_tier_audit_phase_9_11a2.md
            reports/fc26_remaining_lower_tier_coverage_report.json
          if-no-files-found: error

      - name: Upload Room schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-${{ github.sha }}
          path: ${{ steps.room_schema.outputs.schema_file }}
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-phase-9-11A2
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-9-11A2-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
