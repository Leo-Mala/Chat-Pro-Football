name: Apply proven crest load-state fix v3

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/apply-team-badge-load-success-fix-v3.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CERTIFIED_CREST_DRIVE_FILE_ID: 1fPuUUDmaIut5gapYztvujNWHeRSRbtF3
      EXPECTED_ARCHIVE_SIZE: '11751550'
      EXPECTED_ARCHIVE_SHA256: 3b8419298e03a593f23c750a91fda7613f3af395dcd770c13c9f17278f265dc3
      EXPECTED_CLUB_CRESTS: '1907'
      EXPECTED_FACTUAL_CRESTS: '617'
      EXPECTED_TOTAL_CRESTS: '2524'
      EXPECTED_CREST_FINGERPRINT: d1e1d99114739fe4827a5aa37af2e0f7b71829dd87966ba406ddc622d6050e90
    steps:
      - name: Checkout exact promotion head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4

      - name: Apply structural TeamBadge state fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/example/ui/screens/GameScreens.kt')
          text=p.read_text(); start=text.index('fun TeamBadge('); end=text.index('\n@Composable\nfun GameApp', start)
          before,seg,after=text[:start],text[start:end],text[end:]
          op='            Image(\n                painter = painter,'
          cl='            )\n        }\n\n        if (!isSuccess) {'
          if seg.count(op)!=1 or seg.count(cl)!=1: raise SystemExit('TeamBadge structural invariants changed')
          seg=seg.replace(op,'            if (isSuccess) {\n                Image(\n                    painter = painter,',1)
          seg=seg.replace(cl,'                )\n            }\n        }\n\n        if (!isSuccess) {',1)
          p.write_text(before+seg+after)
          PY
          git diff --check

      - name: Recover and certify exact crest corpus
        shell: bash
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/certified-crests"; a="$w/corpus.tar.zst"; r="$w/recovered"
          rm -rf "$w" app/src/main/assets/club_crests; mkdir -p "$r" app/src/main/assets/club_crests
          curl --fail --location --show-error --silent --retry 3 --retry-all-errors "https://drive.usercontent.google.com/download?id=${CERTIFIED_CREST_DRIVE_FILE_ID}&export=download&confirm=t" -o "$a"
          test "$(stat -c '%s' "$a")" = "$EXPECTED_ARCHIVE_SIZE"
          test "$(sha256sum "$a"|awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256"
          tar --zstd -xf "$a" -C "$r"; s="$r/club_crests"
          test "$(find "$s" -maxdepth 1 -type f -name 'club_*.webp'|wc -l)" = "$EXPECTED_CLUB_CRESTS"
          test "$(find "$s" -maxdepth 1 -type f -name 'factual_*.webp'|wc -l)" = "$EXPECTED_FACTUAL_CRESTS"
          test "$(find "$s" -maxdepth 1 -type f -name '*.webp'|wc -l)" = "$EXPECTED_TOTAL_CRESTS"
          fp="$(python3 - "$s" <<'PY'
          import hashlib,pathlib,sys
          s=pathlib.Path(sys.argv[1]); h=hashlib.sha256()
          for p in sorted(s.glob('*.webp'),key=lambda x:x.name): h.update(('assets/club_crests/'+p.name).encode()); h.update(b'\0'); h.update(hashlib.sha256(p.read_bytes()).digest())
          print(h.hexdigest())
          PY
          )"; test "$fp" = "$EXPECTED_CREST_FINGERPRINT"
          cp "$s"/*.webp app/src/main/assets/club_crests/

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Prepare Android validation file
        shell: bash
        run: |
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF

      - name: Compile production patch
        shell: bash
        run: chmod +x gradlew && ./gradlew compileDebugKotlin --stacktrace

      - name: Require complete Phase 10.5 golden PASS
        shell: bash
        run: ./gradlew testDebugUnitTest --tests com.example.Phase105CriticalUiGoldenTest.criticalProductScreens_matchPersistedCareerFixture --stacktrace

      - name: Require all seven approved hashes unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('app'); expected={}
          for line in (root/'src/test/screenshots/phase_10_5_ui.sha256').read_text().splitlines():
              line=line.strip()
              if line and not line.startswith('#'):
                  sha,name=line.split(None,1); expected[name]=sha
          actual=root/'build/phase105-golden-actual'
          for name,sha in expected.items():
              got=hashlib.sha256((actual/name).read_bytes()).hexdigest()
              print(got,name)
              if got!=sha: raise SystemExit(f'golden mismatch {name}: {got} != {sha}')
          PY

      - name: Commit only proven production fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/club_crests app/google-services.json
          git rm .github/workflows/apply-team-badge-load-success-fix.yml .github/workflows/apply-team-badge-load-success-fix-v2.yml .github/workflows/apply-team-badge-load-success-fix-v3.yml
          git add app/src/main/java/com/example/ui/screens/GameScreens.kt
          git diff --cached --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: render crest only after load success'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
