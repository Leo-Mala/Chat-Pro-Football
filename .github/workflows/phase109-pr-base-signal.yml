name: Phase 10.9 PR Base Signal

on:
  pull_request:
    branches: [main]
    types: [edited, reopened]

permissions:
  contents: read

jobs:
  signal-base-edit:
    name: Signal base edit to main
    if: github.event.action == 'reopened' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit trusted-consumer signal only
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.pull_request.base.ref }}' = 'main'
          test -n '${{ github.event.pull_request.head.sha }}'
          echo 'Base/reopen signal emitted; no candidate code is checked out or executed.'
