name: Phase 10.5 Record Final UI Baselines

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/phase105-record-final-ui.yml'
      - 'app/src/test/java/com/example/MainMenuScreenshotTest.kt'
      - 'app/src/test/java/com/example/SavesScreenshotTest.kt'
      - 'app/src/test/java/com/example/Phase105CriticalUiGoldenTest.kt'
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'

permissions:
  contents: read

concurrency:
  group: phase-10-5-record-final-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  record-final-ui:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Setup validation google-services.json
        shell: bash
        run: |
          cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF

      - name: Prefetch Robolectric SDK 34 runtime with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          version='14-robolectric-10818077-i7'
          base="https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/$version"
          runtime_dir="$RUNNER_TEMP/robolectric-runtime"
          jar="android-all-instrumented-$version.jar"
          mkdir -p "$runtime_dir"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            "$base/$jar" -o "$runtime_dir/$jar"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            "$base/$jar.sha256" -o "$runtime_dir/$jar.sha256"
          expected="$(awk '{print $1}' "$runtime_dir/$jar.sha256")"
          actual="$(sha256sum "$runtime_dir/$jar" | awk '{print $1}')"
          test "$actual" = "$expected"
          test "$(stat -c%s "$runtime_dir/$jar")" -gt 100000000
          echo "ROBOLECTRIC_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Record real product baselines
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            -Drobolectric.offline=true \
            -Drobolectric.dependency.dir="$ROBOLECTRIC_RUNTIME_DIR" \
            testDebugUnitTest \
            --tests com.example.MainMenuScreenshotTest \
            --tests com.example.SavesScreenshotTest \
            --tests com.example.Phase105CriticalUiGoldenTest \
            -Proborazzi.test.record=true \
            -PexcludeStressTests=true \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace

      - name: Require all critical baselines
        shell: bash
        run: |
          set -euo pipefail
          required=(
            main_menu.png
            saves_empty.png
            saves_existing.png
            dashboard.png
            squad.png
            tactics.png
            transfers.png
            finances.png
            standings.png
            team_selection.png
            live_match.png
          )
          for name in "${required[@]}"; do
            test -s "app/src/test/screenshots/$name" || {
              echo "Missing required baseline: $name" >&2
              exit 1
            }
          done
          printf 'Recorded baselines:\n'
          find app/src/test/screenshots -maxdepth 1 -type f -name '*.png' -print | sort

      - name: Upload final UI baselines
        uses: actions/upload-artifact@v4
        with:
          name: phase-10-5-final-ui-baselines
          path: app/src/test/screenshots/*.png
          if-no-files-found: error
          retention-days: 1