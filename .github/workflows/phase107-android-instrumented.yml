name: Phase 10.7 Android Instrumented Release

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/scripts/phase107_emulator_gate.sh'
      - '.github/workflows/phase107-android-instrumented.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase107-android-instrumented-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_PACKAGE: com.aistudio.brasfutretro.djuxzt
  TEST_PACKAGE: com.aistudio.brasfutretro.djuxzt.test
  TEST_RUNNER: androidx.test.runner.AndroidJUnitRunner

jobs:
  api-smoke:
    name: Android API ${{ matrix.api-level }} installed startup smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 30]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Bootstrap deterministic FC26 asset
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fc26/bootstrap_fc26_asset.py
          python3 tools/fc26/validate_fc26.py app/src/main/assets/football/fc26/fc26_players_2025-09-19.tsv.bin app/src/main/assets/football/fc26/fc26_manifest.json
      - name: Setup Android validation files
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF
          mkdir -p ~/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          cp debug.keystore ~/.android/debug.keystore
      - name: Build Debug target and instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Install and run real Android startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash .github/scripts/phase107_emulator_gate.sh smoke api-${{ matrix.api-level }}
      - name: Upload API smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase107-api-${{ matrix.api-level }}-evidence
          path: phase107-artifacts/api-${{ matrix.api-level }}/
          if-no-files-found: error
          retention-days: 1

  instrumented-debug-current:
    name: Android API 35 full instrumented Debug
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Bootstrap and validate deterministic FC26 asset
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fc26/bootstrap_fc26_asset.py
          python3 tools/fc26/validate_fc26.py app/src/main/assets/football/fc26/fc26_players_2025-09-19.tsv.bin app/src/main/assets/football/fc26/fc26_manifest.json
      - name: Setup validation google-services and Debug signing
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF
          mkdir -p ~/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          cp debug.keystore ~/.android/debug.keystore
      - name: Build Debug target and instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Execute full installed Android suite and external process restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash .github/scripts/phase107_emulator_gate.sh debug-full debug-api35
      - name: Upload full Debug instrumented evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase107-debug-api35-evidence
          path: phase107-artifacts/debug-api35/
          if-no-files-found: error
          retention-days: 1

  instrumented-release-current:
    name: Android API 35 installed Release certification
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Bootstrap and validate deterministic FC26 asset
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fc26/bootstrap_fc26_asset.py
          python3 tools/fc26/validate_fc26.py app/src/main/assets/football/fc26/fc26_players_2025-09-19.tsv.bin app/src/main/assets/football/fc26/fc26_manifest.json
      - name: Setup validation configuration and signing
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF
          mkdir -p ~/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          cp debug.keystore ~/.android/debug.keystore
          release_keystore="$RUNNER_TEMP/phase107-validation-release.jks"
          store_password="ci-validation-only"
          key_alias="phase107-validation"
          key_password="ci-validation-only"
          keytool -genkeypair -v -keystore "$release_keystore" -storepass "$store_password" -alias "$key_alias" -keypass "$key_password" -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Pro Football Phase 10.7 CI, O=CI, C=BR"
          {
            echo "KEYSTORE_PATH=$release_keystore"
            echo "STORE_PASSWORD=$store_password"
            echo "KEY_ALIAS=$key_alias"
            echo "KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"
      - name: Build signed Release target and Release instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew -PinstrumentedBuildType=release assembleRelease assembleReleaseAndroidTest bundleRelease --stacktrace
          release_apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          release_test_apk=$(find app/build/outputs/apk/androidTest/release -type f -name '*-androidTest.apk' -print -quit)
          release_aab=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)
          test -n "$release_apk" && test -n "$release_test_apk" && test -n "$release_aab"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs "$release_apk"
          "$apksigner" verify --verbose --print-certs "$release_test_apk"
          jarsigner -verify -strict -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -certs "$release_aab"
      - name: Install Release and certify startup/save/process restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash .github/scripts/phase107_emulator_gate.sh release release-api35
      - name: Upload Release instrumented evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase107-release-api35-evidence
          path: phase107-artifacts/release-api35/
          if-no-files-found: error
          retention-days: 1
      - name: Upload signed validation Release APK and AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase107-release-builds
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 1
