name: FC26 Remaining Factual Baselines A3

on:
  pull_request:
    branches: [ "main", "master" ]
    types: [opened, synchronize, reopened]
    paths:
      - 'app/src/main/java/com/example/MainApplication.kt'
      - 'app/src/main/java/com/example/data/Fc26RemainingFactualBaselinesA3_2026_27.kt'
      - 'app/src/main/java/com/example/data/EuropeanAuditedFactualBaselinesA3Materializer2026_27.kt'
      - 'app/src/main/java/com/example/data/EuropeanAuditedLowerTierClubTargetMaterializer2026_27.kt'
      - 'app/src/main/java/com/example/data/EuropeanFactualClubTargetMaterializer2026_27.kt'
      - 'app/src/main/java/com/example/data/StableTeamIdentityRegistry.kt'
      - 'app/src/main/java/com/example/data/Fc26ClubMappingRegistry.kt'
      - 'app/src/test/java/com/example/data/Fc26RemainingFactualBaselinesA3ReportTest.kt'
      - 'reports/fc26_remaining_factual_baselines_a3_audit.md'
      - '.github/workflows/fc26-remaining-factual-baselines-a3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fc26-remaining-factual-baselines-a3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    # Intentionally Draft-compatible. Merge remains forbidden until explicit later authorization.
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enforce Phase 9.11A3 scope immutability
        shell: bash
        run: |
          set -euo pipefail
          BASE=442856f1823cd3774ec1d20da8995881d5de0a9f
          git diff --exit-code "$BASE" -- \
            app/src/main/java/com/example/data/Fc26PlayerMapper.kt \
            app/src/main/java/com/example/data/Fc26DatasetModels.kt \
            app/src/main/java/com/example/data/PlayerAttributes.kt \
            app/src/main/java/com/example/data/entities.kt \
            app/src/main/java/com/example/data/daos.kt \
            app/src/main/java/com/example/data/database.kt \
            app/src/main/java/com/example/data/migrations
          echo "FC26 mapper/attributes and Room schema surfaces are unchanged from A2."

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          else
            cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": { "package_name": "com.aistudio.brasfutretro.djuxzt" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF
          fi

      - name: Setup Debug Keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -f "debug.keystore.base64" ]; then base64 -d debug.keystore.base64 > debug.keystore; fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Run core regressions and migration-save safety
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest -PexcludeStressTests=true --stacktrace

      - name: Validate Phase 9.11A3 acceptance policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/fc26_remaining_factual_baselines_a3_report.json').read_text())
          before = report['before']; after = report['after']; impl = report['implementation']
          audit = report['transitionAudit']; safety = report['safety']
          assert report['phase'] == '9.11A3'
          assert before == {'targetTeams':2524,'matchedClubs':385,'unmatchedClubs':275,'ambiguousClubs':2,'importedPlayers':10852,'blockedPlayers':7553}
          assert impl['implementedClubs'] == 15
          assert impl['implementedPlayers'] == 392
          assert impl['targetTeamsBefore'] == impl['targetTeamsAfter'] == 2524
          assert after == {'targetTeams':2524,'matchedClubs':400,'unmatchedClubs':260,'ambiguousClubs':2,'importedPlayers':11244,'blockedPlayers':7161}
          assert audit['gainedMatches'] == 15 and audit['gainedPlayers'] == 392
          assert audit['lostMatches'] == 0 and audit['redirectedMatches'] == 0
          assert audit['unchangedLegacyIdsChanged'] == 0
          assert safety['fuzzyAutoMatchingIntroduced'] is False
          assert safety['arbitraryAliasesIntroduced'] is False
          assert safety['fc26RatingsMutated'] is False
          assert safety['fc26PotentialMutated'] is False
          assert safety['fc26AttributesMutated'] is False
          assert safety['efootballOnlyPlayersImported'] is False
          assert safety['roomMigrationRequired'] is False and safety['roomVersion'] == 21
          print('Phase 9.11A3 acceptance policy validated')
          PY

      - name: Run save-slot, Room and FC26 persistence tests explicitly
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests com.example.SaveSlotIsolationTest \
            --tests com.example.migrations.MigrationSafetyTest \
            --tests com.example.migrations.MigrationCompatibilityTest \
            --tests com.example.data.Fc26FullSeedIntegrationTest \
            --stacktrace

      - name: Run 20 and 100 season stress tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests com.example.TwentySeasonStressTest \
            --tests com.example.OneHundredSeasonMatchByMatchStressTest \
            --stacktrace

      - name: Verify Room schema V21
        id: room_schema
        shell: bash
        run: |
          set -euo pipefail
          db_version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('app/src/main/java/com/example/data/database.kt').read_text()
          match = re.search(r'\bversion\s*=\s*(\d+)', source)
          if not match: raise SystemExit('Could not resolve Room database version')
          print(match.group(1))
          PY
          )
          test "$db_version" = "21"
          schema_file="app/schemas/com.example.data.AppDatabase/${db_version}.json"
          test -f "$schema_file"
          echo "schema_file=$schema_file" >> "$GITHUB_OUTPUT"
          echo "Room schema validated unchanged: $schema_file"

      - name: Upload Phase 9.11A3 audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fc26-remaining-factual-baselines-a3
          path: |
            reports/fc26_remaining_factual_baselines_a3_audit.md
            reports/fc26_remaining_factual_baselines_a3_report.json
          if-no-files-found: error

      - name: Upload Room schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-${{ github.sha }}
          path: ${{ steps.room_schema.outputs.schema_file }}
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-phase-9-11A3
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-9-11A3-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
