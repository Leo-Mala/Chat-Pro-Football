name: Phase 10.5 Targeted Stamina Refactor

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/phase10-5-stamina-targeted-refactor.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Replace full-table stamina read and remove this temporary workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt')
          text = path.read_text()
          old = '''                    val allPls = repo.getAllPlayers()\n                    val myPlayers = allPls.filter { it.teamId == save.playerTeamId }\n'''
          new = '''                    val myPlayers = repo.getPlayersByTeam(save.playerTeamId)\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one stamina full-table anchor, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git rm .github/workflows/phase10-5-stamina-targeted-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          git commit -m 'perf: target controlled roster for infinite stamina'
          git fetch origin "$HEAD_BRANCH"
          git rebase "origin/$HEAD_BRANCH"
          git push origin HEAD:"$HEAD_BRANCH"
