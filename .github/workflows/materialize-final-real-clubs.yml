name: Materialize final real clubs

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .club-realization-input/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-final-real-clubs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact working head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reassemble and validate complete audited input
        shell: bash
        env:
          CANONICAL_ARCHIVE_SHA256: 7e82ed9f20c41a9385877898f39f1dfd6395917e00f3c12c4560d2a91771778f
          TRANSPORT_V1_SHA256: 5d74b39e19b1cf756fc0f8f3f113734aa177e9d7d6736b9348db473a6cd384c9
          HARDENED_PLAN_SHA256: eb4e5a4919eb3690f5ad9e0508d44bd523ed85ff2b7a75ba667dc15c87b58be1
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/club-realization-input"
          archive="$RUNNER_TEMP/final-club-realization-input.tar.gz"
          mkdir -p "$input_root"
          shopt -s nullglob

          canonical_parts=(.club-realization-input/final-club-realization-input.tar.gz.part*)
          transport_parts=(.club-realization-input/final-club-realization-transport-v1.tar.gz.part*)
          complete_canonical=.club-realization-input/final-club-realization-input.tar.gz
          complete_transport=.club-realization-input/final-club-realization-transport-v1.tar.gz

          sources=0
          if [ -f "$complete_canonical" ]; then
            cp "$complete_canonical" "$archive"
            sources=$((sources + 1))
          fi
          if [ -f "$complete_transport" ]; then
            cp "$complete_transport" "$archive"
            sources=$((sources + 1))
          fi
          if [ "${#canonical_parts[@]}" -gt 0 ]; then
            cat "${canonical_parts[@]}" > "$archive"
            sources=$((sources + 1))
          fi
          if [ "${#transport_parts[@]}" -gt 0 ]; then
            cat "${transport_parts[@]}" > "$archive"
            sources=$((sources + 1))
          fi
          test "$sources" -eq 1

          actual_archive_sha=$(sha256sum "$archive" | awk '{print $1}')
          case "$actual_archive_sha" in
            "$CANONICAL_ARCHIVE_SHA256"|"$TRANSPORT_V1_SHA256") ;;
            *)
              echo "unapproved complete input archive sha256=$actual_archive_sha" >&2
              exit 1
              ;;
          esac

          tar -xzf "$archive" -C "$input_root"
          test -f "$input_root/plan.csv"
          test -f "$input_root/metadata.json"
          test -d "$input_root/source-crests"
          echo "$HARDENED_PLAN_SHA256  $input_root/plan.csv" | sha256sum -c -
          test "$(($(wc -l < "$input_root/plan.csv") - 1))" -eq 1907
          test "$(find "$input_root/source-crests" -maxdepth 1 -type f \( -name '*.png' -o -name '*.svg' \) | wc -l)" -eq 1907

          INPUT_ROOT="$input_root" \
          HARDENED_PLAN_SHA256="$HARDENED_PLAN_SHA256" \
          CANONICAL_ARCHIVE_SHA256="$CANONICAL_ARCHIVE_SHA256" \
          python3 - <<'PY'
          from __future__ import annotations
          import csv
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ['INPUT_ROOT'])
          plan = root / 'plan.csv'
          crest_dir = root / 'source-crests'
          with plan.open(encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))
          if len(rows) != 1907:
              raise SystemExit(f'plan rows {len(rows)} != 1907')
          names = [row['crestFileName'] for row in rows]
          if len(set(names)) != 1907:
              raise SystemExit('crestFileName values are not unique')
          team_ids = [row['legacyTeamId'] for row in rows]
          if len(set(team_ids)) != 1907:
              raise SystemExit('legacyTeamId values are not unique')
          expected = set(names)
          actual = {path.name for path in crest_dir.iterdir() if path.is_file() and path.suffix.lower() in {'.png', '.svg'}}
          if actual != expected:
              missing = sorted(expected - actual)
              extra = sorted(actual - expected)
              raise SystemExit(f'source crest set mismatch missing={missing[:10]} extra={extra[:10]}')
          for row in rows:
              data = (crest_dir / row['crestFileName']).read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest.lower() != row['sourceCrestSha256'].lower():
                  raise SystemExit(
                      f"source crest sha mismatch {row['crestFileName']} expected={row['sourceCrestSha256']} actual={digest}"
                  )
          metadata = json.loads((root / 'metadata.json').read_text(encoding='utf-8'))
          transport_format = metadata.get('format')
          if transport_format == 'chat-pro-football-club-realization-transport-v1':
              if metadata.get('crestCount') != 1907:
                  raise SystemExit('transport metadata crestCount != 1907')
              if metadata.get('planSha256') != os.environ['HARDENED_PLAN_SHA256']:
                  raise SystemExit('transport metadata planSha256 mismatch')
              if metadata.get('canonicalArchiveSha256') != os.environ['CANONICAL_ARCHIVE_SHA256']:
                  raise SystemExit('transport metadata canonicalArchiveSha256 mismatch')
          print('complete_input_verified=true')
          print('source_crests=1907')
          PY

      - name: Materialize and independently verify 1907 replacements
        shell: bash
        env:
          HARDENED_PLAN_SHA256: eb4e5a4919eb3690f5ad9e0508d44bd523ed85ff2b7a75ba667dc15c87b58be1
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/club_realization/materialize_validated_patch_plan.py \
            tools/club_realization/verify_materialized_bundle.py
          python3 tools/club_realization/materialize_validated_patch_plan.py \
            --plan "$RUNNER_TEMP/club-realization-input/plan.csv" \
            --crests-dir "$RUNNER_TEMP/club-realization-input/source-crests"
          python3 tools/club_realization/verify_materialized_bundle.py
          cp "$RUNNER_TEMP/club-realization-input/plan.csv" docs/club-realization/validated-replacement-plan.csv
          echo "$HARDENED_PLAN_SHA256  docs/club-realization/validated-replacement-plan.csv" | sha256sum -c -
          test "$(($(wc -l < docs/club-realization/validated-replacement-plan.csv) - 1))" -eq 1907
          test "$(find app/src/main/assets/club_crests -maxdepth 1 -type f \( -name '*.png' -o -name '*.svg' \) | wc -l)" -eq 1907
          test "$(($(wc -l < docs/club-realization/crest-sha256.csv) - 1))" -eq 1907

      - name: Commit verified materialization to working branch only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .club-realization-input
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .club-realization-input \
            app/src/main/assets/club_crests \
            app/src/main/java/com/example/data/BrasfootRealClubReplacementData.kt \
            docs/club-realization/crest-sha256.csv \
            docs/club-realization/validated-replacement-plan.csv
          git diff --cached --check
          git commit -m 'data: materialize 1907 audited real clubs'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
