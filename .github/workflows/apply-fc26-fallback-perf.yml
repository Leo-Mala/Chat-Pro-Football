name: Apply FC26 Fallback Perf Patch

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/apply-fc26-fallback-perf.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0

      - name: Apply lossless FC26 fallback generation optimization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # DefaultData: keep the canonical 30-player API untouched semantically, but add a
          # FC26-only path that consumes the exact same RNG sequence and materializes only the
          # 20 players that Fc26FallbackRosterPolicy would retain.
          path = Path('app/src/main/java/com/example/data/DefaultData.kt')
          text = path.read_text()
          sig = '    fun generateRosterForTeam(teamId: Long, teamRating: Int, teamName: String, country: String): List<Player> {\n'
          replacement = '''    fun generateRosterForTeam(teamId: Long, teamRating: Int, teamName: String, country: String): List<Player> =\n        generateRosterForTeamInternal(teamId, teamRating, teamName, country, retainFc26FallbackOnly = false)\n\n    /**\n     * FC26 precisa somente dos 20 jogadores que a política de fallback reteria do elenco canônico\n     * de 30. Mantemos todos os sorteios na mesma ordem para preservar ids/nomes/força/atributos,\n     * mas evitamos construir/copiar/calcular mercado para os dez jogadores descartados.\n     */\n    internal fun generateFc26FallbackRosterForTeam(\n        teamId: Long,\n        teamRating: Int,\n        teamName: String,\n        country: String\n    ): List<Player> =\n        generateRosterForTeamInternal(teamId, teamRating, teamName, country, retainFc26FallbackOnly = true)\n\n    private fun generateRosterForTeamInternal(\n        teamId: Long,\n        teamRating: Int,\n        teamName: String,\n        country: String,\n        retainFc26FallbackOnly: Boolean\n    ): List<Player> {\n'''
          if sig not in text:
              raise SystemExit('DefaultData signature not found')
          text = text.replace(sig, replacement, 1)

          old = '        val list = mutableListOf<Player>()\n        val rand = Random(teamId + teamRating * 17L)\n'
          new = '        val list = mutableListOf<Player>()\n        val generatedNames = mutableListOf<String>()\n        val rand = Random(teamId + teamRating * 17L)\n'
          if old not in text:
              raise SystemExit('DefaultData list init not found')
          text = text.replace(old, new, 1)

          old = '            val matchedStar = realStars.find { it.position == pos && list.none { p -> p.name == it.name } }\n'
          new = '            val matchedStar = realStars.find { it.position == pos && generatedNames.none { generated -> generated == it.name } }\n'
          if old not in text:
              raise SystemExit('DefaultData star matcher not found')
          text = text.replace(old, new, 1)

          old = '''            val force = if (matchedStar != null) {\n'''
          new = '''            generatedNames.add(name)\n\n            val force = if (matchedStar != null) {\n'''
          if old not in text:
              raise SystemExit('DefaultData force marker not found')
          text = text.replace(old, new, 1)

          old = '''            val playerId = if (teamId > 0) (teamId * 1000L + (i + 1L)) else 0L\n            val basePlayer = Player(\n'''
          new = '''            val playerId = if (teamId > 0) (teamId * 1000L + (i + 1L)) else 0L\n            // Estes três sorteios faziam parte da avaliação dos argumentos do Player. Eles\n            // continuam sendo consumidos até para índices descartados, preservando o RNG byte a byte.\n            val moral = rand.safeNextInt(75, 94)\n            val careerApps = rand.safeNextInt(0, 150)\n            val careerGoals = if (pos == "ATA" || pos == "MEI") rand.safeNextInt(0, 55) else rand.safeNextInt(0, 8)\n\n            if (retainFc26FallbackOnly && !fc26FallbackRetainsCanonicalIndex(i)) {\n                continue\n            }\n\n            val basePlayer = Player(\n'''
          if old not in text:
              raise SystemExit('DefaultData Player marker not found')
          text = text.replace(old, new, 1)
          text = text.replace('                moral = rand.safeNextInt(75, 94),\n', '                moral = moral,\n', 1)
          text = text.replace('                careerApps = rand.safeNextInt(0, 150),\n', '                careerApps = careerApps,\n', 1)
          text = text.replace('                careerGoals = if (pos == "ATA" || pos == "MEI") rand.safeNextInt(0, 55) else rand.safeNextInt(0, 8),\n', '                careerGoals = careerGoals,\n', 1)

          marker = '    private data class StarTemplate(val name: String, val position: String, val force: Int, val age: Int)\n'
          helper = '''    private fun fc26FallbackRetainsCanonicalIndex(index: Int): Boolean = when (index) {\n        // Exatamente os primeiros 2 GOL, 4 ZAG, 3 LAT, 3 VOL, 4 MEI e 4 ATA selecionados\n        // por Fc26FallbackRosterPolicy sobre a distribuição canônica de 30 jogadores acima.\n        0, 1,\n        3, 4, 5, 6,\n        8, 9, 10,\n        12, 13, 14,\n        17, 18, 19, 20,\n        21, 22, 23, 24 -> true\n        else -> false\n    }\n\n'''
          if marker not in text:
              raise SystemExit('DefaultData StarTemplate marker not found')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)

          # FC26 production paths now feed the planner the already-selected canonical 20 players.
          # The planner still applies Fc26FallbackRosterPolicy.select(), which is an identity copy at size 20.
          path = Path('app/src/main/java/com/example/data/EuropeanNewSaveSeedCoordinator.kt')
          text = path.read_text()
          old = '''                proceduralRosterFactory = { team ->\n                    DefaultData.generateRosterForTeam(team.id, team.rating, team.name, team.country)\n                }\n'''
          new = '''                proceduralRosterFactory = { team ->\n                    DefaultData.generateFc26FallbackRosterForTeam(team.id, team.rating, team.name, team.country)\n                }\n'''
          count = text.count(old)
          if count < 2:
              raise SystemExit(f'Expected at least two coordinator roster factories, got {count}')
          # Only FC26 occurrences: first buildPendingSeed and prepareForFc26. Preserve European paths.
          first = text.find(old)
          text = text[:first] + text[first:].replace(old, new, 1)
          second_search_from = text.find('internal fun prepareForFc26')
          second = text.find(old, second_search_from)
          if second < 0:
              raise SystemExit('prepareForFc26 factory not found')
          text = text[:second] + text[second:].replace(old, new, 1)
          path.write_text(text)

          # Keep explicit full-plan prewarm consistent if it is used again later.
          path = Path('app/src/main/java/com/example/data/Fc26SeedPlanner.kt')
          text = path.read_text()
          old = '''        return build(teams, dataset) { team ->\n            DefaultData.generateRosterForTeam(team.id, team.rating, team.name, team.country)\n        }\n'''
          new = '''        return build(teams, dataset) { team ->\n            DefaultData.generateFc26FallbackRosterForTeam(team.id, team.rating, team.name, team.country)\n        }\n'''
          if old not in text:
              raise SystemExit('Fc26SeedPlanner prewarm factory not found')
          path.write_text(text.replace(old, new, 1))

          # Regression on the already-focused test class: every production team must be exactly equal
          # to select(fullCanonical30), field-for-field via Player data-class equality.
          path = Path('app/src/test/java/com/example/data/Fc26SeedPlannerTest.kt')
          text = path.read_text()
          marker = 'class Fc26SeedPlannerTest {\n'
          test = '''class Fc26SeedPlannerTest {\n    @Test fun `optimized FC26 fallback exactly matches canonical selection for production universe`() {\n        val teams = ProductionCareerSeedPrewarm.buildProductionTeamUniverse()\n        assertTrue(teams.size >= 1_000)\n\n        teams.forEach { team ->\n            val canonical = DefaultData.generateRosterForTeam(team.id, team.rating, team.name, team.country)\n            val expected = Fc26FallbackRosterPolicy.select(canonical)\n            val optimized = DefaultData.generateFc26FallbackRosterForTeam(team.id, team.rating, team.name, team.country)\n            assertEquals("${team.country}/${team.name}", expected, optimized)\n        }\n    }\n\n'''
          if marker not in text:
              raise SystemExit('Fc26SeedPlannerTest class marker not found')
          path.write_text(text.replace(marker, test, 1))
          PY

          git diff --check

      - name: Commit production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/DefaultData.kt \
                  app/src/main/java/com/example/data/EuropeanNewSaveSeedCoordinator.kt \
                  app/src/main/java/com/example/data/Fc26SeedPlanner.kt \
                  app/src/test/java/com/example/data/Fc26SeedPlannerTest.kt
          git diff --cached --check
          git commit -m 'perf: avoid discarded FC26 fallback player materialization'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
