name: Commit focused runtime fixes once

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/commit-runtime-fixes-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact working head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply already-audited runtime bugfix round
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/manual_test/apply_runtime_bugfix_round_20260831.py
          python3 tools/manual_test/apply_runtime_bugfix_round_20260831.py

      - name: Commit only focused source and regression changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            app/src/main/java/com/example/data/daos.kt \
            app/src/main/java/com/example/data/repository.kt \
            app/src/main/java/com/example/usecase/PlayerEvolutionUseCase.kt \
            app/src/main/java/com/example/ui/screens/EditorScreen.kt \
            app/src/main/java/com/example/ui/components/editor/EditorCards.kt \
            app/src/main/java/com/example/ui/components/editor/EditorDialogs.kt \
            app/src/main/java/com/example/ui/screens/MatchSimulationScreen.kt \
            app/src/main/java/com/example/ui/screens/StandingsScreen.kt \
            app/src/main/java/com/example/ui/components/standings/TopScorersView.kt \
            app/src/main/java/com/example/ui/viewmodel/GameViewModelMatch.kt \
            app/src/test/java/com/example/ui/screens/ClubCrestUiIdentityRegressionTest.kt \
            app/src/test/java/com/example/ui/viewmodel/LiveMatchPersistenceOrderingRegressionTest.kt \
            app/src/test/java/com/example/ui/viewmodel/LiveMatchSkipRegressionTest.kt \
            app/src/test/java/com/example/usecase/CompletedFixtureDashboardRegressionTest.kt \
            app/src/test/java/com/example/usecase/MonthlyEvolutionWeekFourRegressionTest.kt
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix: stabilize crests live match completion and week four'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
