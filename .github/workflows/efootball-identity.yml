name: eFootball Identity Reconciliation

on:
  pull_request:
    branches: [ "main", "master" ]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/efootball/**'
      - 'reports/fc26_efootball_identity_report.json'
      - 'reports/fc26_efootball_identity_summary.md'
      - '.github/workflows/efootball-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efootball-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run eFootball reconciliation unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/efootball/tests -t .
          python3 -m py_compile tools/efootball/*.py tools/efootball/tests/*.py

      - name: Validate committed reconciliation summary invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/fc26_efootball_identity_report.json').read_text(encoding='utf-8'))
          classes = report['classification']
          assert classes['sum'] == report['efootball2026']['total']
          assert sum(classes[k] for k in ('groupA','groupB','groupC1','groupC2','groupC3','groupD','groupE')) == classes['sum']
          assert report['anomalies']['duplicateKonamiIds'] == 0
          assert report['anomalies']['duplicateSecureFc26Ids'] == 0
          assert report['anomalies']['duplicateSecureKonamiIds'] == 0
          assert report['playersDb']['baseKonamiIdStatus'] == 'BASE_KONAMI_ID_NOT_AVAILABLE'
          assert report['policy']['fc26RemainsPrimary'] is True
          assert report['policy']['importsEfootballOnlyPlayers'] is False
          assert report['policy']['mutatesFc26RatingsPotentialAttributesOrClubs'] is False
          assert report['sourceMetadata']['fc26']['sha256'] == '4399cb2bcc2a14a2872e76a118f8f4bf64d7954503949c75751a14f33863e3b2'
          print('eFootball reconciliation summary invariants validated')
          PY

      - name: Run European bulk importer tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/europe_importer/tests -t .

      - name: Bootstrap deterministic FC26 player asset
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fc26/bootstrap_fc26_asset.py

      - name: Validate checked-in FC26 player asset
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fc26/validate_fc26.py \
            app/src/main/assets/football/fc26/fc26_players_2025-09-19.tsv.bin \
            app/src/main/assets/football/fc26/fc26_manifest.json

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          else
            cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF
          fi

      - name: Setup Debug Keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug --stacktrace

      - name: Run core regression and migration-save safety
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest -PexcludeStressTests=true --stacktrace

      - name: Run 20 and 100 season stress tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests com.example.TwentySeasonStressTest \
            --tests com.example.OneHundredSeasonMatchByMatchStressTest \
            --stacktrace

      - name: Verify exported Room schema
        shell: bash
        run: |
          set -euo pipefail
          db_version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('app/src/main/java/com/example/data/database.kt').read_text()
          match = re.search(r'\bversion\s*=\s*(\d+)', source)
          if not match:
              raise SystemExit('Could not resolve Room database version')
          print(match.group(1))
          PY
          )
          schema_file="app/schemas/com.example.data.AppDatabase/${db_version}.json"
          test -f "$schema_file"
          test "$db_version" = "21"
          echo "Room V${db_version} schema validated: $schema_file"
