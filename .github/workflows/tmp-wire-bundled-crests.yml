name: Temporary Wire Bundled Crests

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/tmp-wire-bundled-crests.yml

permissions:
  contents: write

jobs:
  wire-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Setup validation google-services.json
        shell: bash
        run: |
          cat << 'GOOGLE_EOF' > app/google-services.json
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          GOOGLE_EOF
      - name: Route local crest lookup through patch catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/data/DefaultData.kt')
          text = p.read_text(encoding='utf-8')
          old = 'BrasfootRealClubIdentity.crestAssetUriFor(country, name)?.let { return it }'
          new = 'BrasfootPatchCrests.assetUriFor(country, name)?.let { return it }'
          if old not in text:
              raise SystemExit('DefaultData local crest hook not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run focused crest and identity tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PexcludeStressTests=true \
            --tests com.example.data.BrasfootPatchCrestsTest \
            --tests com.example.data.BrasfootRealClubIdentityTest \
            --stacktrace
      - name: Commit validated wiring and remove workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-wire-bundled-crests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/DefaultData.kt .github/workflows/tmp-wire-bundled-crests.yml
          git commit -m 'feat: route club badges to bundled patch crests'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
