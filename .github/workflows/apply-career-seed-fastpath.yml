name: Apply career seed fast path

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/apply-career-seed-fastpath.yml

permissions:
  contents: write

concurrency:
  group: apply-career-seed-fastpath-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply pristine-template fast paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt')
          s = p.read_text(encoding='utf-8')
          old = "    internal suspend fun seedAllDefaultTeams(targetRepo: GameRepository = repo, activeCountry: String = _selectedCountry.value) {\n        val existingTeams = targetRepo.getAllTeams()\n"
          new = "    internal suspend fun seedAllDefaultTeams(targetRepo: GameRepository = repo, activeCountry: String = _selectedCountry.value) {\n        // Um slot recém-criado por createFromAsset já contém o universo global completo.\n        // O marker íntegro permite evitar 2.524 resoluções de template/ID/logo e consultas de elenco.\n        if (targetRepo.pristineCareerSeedTemplateOrNull() != null) return\n\n        val existingTeams = targetRepo.getAllTeams()\n"
          if old not in s: raise SystemExit('seed anchor not found')
          s = s.replace(old, new, 1)
          start = s.index('        // 1. Preparação dos dados de times em memória do zero\n')
          end = s.index('        // 2. Cálculo do calendário em memória ANTES da transação do banco.\n', start)
          replacement = "        // Um slot novo pode ter sido criado diretamente do baseline Room empacotado.\n        val prebuiltSeedMarker = targetRepo.pristineCareerSeedTemplateOrNull()\n        val usePrebuiltCareerSeed = prebuiltSeedMarker != null\n\n        // 1. No fast path, reutiliza os 2.524 clubes já validados no template em vez de\n        // reconstruir objetos, recalcular IDs e resolver logos novamente.\n        val clubSetupStartedAtNs = System.nanoTime()\n        val dbTeams: List<Team> = if (usePrebuiltCareerSeed) {\n            targetRepo.getAllTeams()\n        } else {\n            buildList {\n                for (countryKey in GlobalFootballSystem.keys) {\n                    val templates = DefaultData.getTeamsForCountry(countryKey)\n                    for (t in templates) {\n                        val globalId = GlobalFootballSystem.getGlobalId(countryKey, t.name)\n                        add(Team(id = globalId, name = t.name, city = t.city, state = t.state, country = countryKey, division = t.division, rating = t.rating, stadiumName = t.stadium, logoUrl = DefaultData.getLogoForTeam(t.name, countryKey), isPlayerControlled = (globalId == teamId)))\n                    }\n                }\n            }\n        }\n        val clubSetupMs = (System.nanoTime() - clubSetupStartedAtNs) / 1_000_000L\n\n"
          s = s[:start] + replacement + s[end:]
          old_selected = "        val playerSelectedTeam = dbTeams.find { it.id == teamId }\n"
          new_selected = "        val playerSelectedTeam = dbTeams.find { it.id == teamId }?.let { selected ->\n            if (usePrebuiltCareerSeed && !selected.isPlayerControlled) selected.copy(isPlayerControlled = true) else selected\n        }\n"
          if old_selected not in s: raise SystemExit('selected-team anchor not found')
          s = s.replace(old_selected, new_selected, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest --tests 'com.example.data.CareerSeedTemplateRuntimeTest' --tests 'com.example.usecase.CareerCreationPerformanceTest' --tests 'com.example.usecase.DatabaseIntegrityFastPathTest'

      - name: Commit validated fast path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/apply-career-seed-fastpath.yml
          git add -A -- app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt .github/workflows/apply-career-seed-fastpath.yml
          git diff --cached --check
          git commit -m 'perf: reuse pristine career seed teams'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
