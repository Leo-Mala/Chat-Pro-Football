name: Optimize save-open integrity gate

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/optimize-save-open-integrity.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 1

      - name: Configure JDK 17
        uses: actions/setup-java@7a445ee88d4e23b52c33f0f0f0f31c8b7e7e4bd3
        with:
          distribution: temurin
          java-version: '17'

      - name: Patch duplicate integrity repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt')
          s=p.read_text()
          s=s.replace('    internal var hasSelfHealedThisSave = false\n','')
          old='''                            // Integridade do Banco: delega verificação e reparo de elencos ao UseCase
                            if (!hasSelfHealedThisSave) {
                                hasSelfHealedThisSave = true
                                val integrityUseCase = DatabaseIntegrityUseCase(currentRepository)
                                integrityUseCase.repairDatabase()
                            }
'''
          new='''                            // A integridade pertence à sessão do slot. A seleção do slot e este collector
                            // podem chegar aqui em paralelo; SaveSession.hasSelfHealed é o gate único para
                            // impedir duas varreduras completas do mesmo banco durante a abertura.
                            val currentSession = _activeSaveSession.value
                            if (currentSession != null && currentSession.repository === currentRepository) {
                                repairRostersIfNecessarySync(currentSession)
                            }
'''
          if old not in s:
              raise SystemExit('expected integrity collector block not found')
          s=s.replace(old,new,1)
          s=s.replace('''                } else {
                    hasSelfHealedThisSave = false
                }
''','''                }
''',1)
          if 'hasSelfHealedThisSave' in s:
              raise SystemExit('legacy integrity gate still referenced')
          p.write_text(s)
          PY
          git diff --check
          git diff -- app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt

      - name: Focused compile and unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Commit optimized session gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          git diff --cached --quiet && { echo 'No code change to commit'; exit 0; }
          git commit -m 'perf: avoid duplicate integrity repair on save open'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
