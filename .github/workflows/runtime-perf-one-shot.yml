name: Runtime career performance one-shot

on:
  push:
    branches:
      - agent/3.0.1-runtime-bugfixes
    paths:
      - .github/workflows/runtime-perf-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: run exact career performance patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/3.0.1-runtime-bugfixes
          fetch-depth: 0
      - name: Apply exact fail-closed performance patch
        run: python3 scripts/runtime_perf_patch.py
      - name: Commit optimized runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/PlayerAttributes.kt \
                  app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          git diff --cached --check
          git diff --cached --quiet && { echo "No performance patch output"; exit 1; }
          git commit -m "perf: remove JSON allocation hotspot from career seed"
          git push origin HEAD:agent/3.0.1-runtime-bugfixes
