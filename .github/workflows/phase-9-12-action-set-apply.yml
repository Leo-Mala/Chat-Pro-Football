name: Phase 9.12 Action Set Apply

on:
  push:
    branches:
      - agent/fc26-post-bulk-roster-architecture-audit
    paths:
      - '.github/workflows/phase-9-12-action-set-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fc26-post-bulk-roster-architecture-audit
          fetch-depth: 0

      - name: Apply targeted action-set patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1))

          dao_path = 'app/src/main/java/com/example/data/daos.kt'
          dao_old = '''    @Query("SELECT * FROM players WHERE id = :id")
              suspend fun getPlayer(id: Long): Player?
          '''
          dao_new = '''    @Query("SELECT * FROM players WHERE id = :id")
              suspend fun getPlayer(id: Long): Player?

              /**
               * Phase 9.12B: contract tick as SQL action sets.
               * Expirations must run before the >1 decrement so a 2-week contract becomes 1,
               * not 0, during a single weekly tick.
               */
              @Query("""
                  UPDATE players
                  SET contractDurationWeeks = 0,
                      isStarter = 0,
                      salary = 0
                  WHERE contractDurationWeeks = 1 AND isOnLoan = 1
              """)
              suspend fun expireLoanContractsAtOneWeek(): Int

              @Query("""
                  UPDATE players
                  SET contractDurationWeeks = 0,
                      teamId = NULL,
                      originalTeamId = NULL,
                      isStarter = 0,
                      salary = 0
                  WHERE contractDurationWeeks = 1 AND isOnLoan = 0
              """)
              suspend fun expireNonLoanContractsAtOneWeek(): Int

              @Query("""
                  UPDATE players
                  SET contractDurationWeeks = contractDurationWeeks - 1
                  WHERE contractDurationWeeks > 1
              """)
              suspend fun decrementLongerContractsOneWeek(): Int
          '''
          replace_once(dao_path, dao_old, dao_new)

          repo_path = 'app/src/main/java/com/example/data/repository.kt'
          repo_old = '''    suspend fun getFreeAgents(): List<Player> = db.playerDao().getFreeAgents()
              suspend fun getPlayer(id: Long): Player? = db.playerDao().getPlayer(id)
          '''
          repo_new = '''    suspend fun getFreeAgents(): List<Player> = db.playerDao().getFreeAgents()
              suspend fun getPlayer(id: Long): Player? = db.playerDao().getPlayer(id)

              /**
               * Applies the canonical weekly contract lifecycle without materializing the full Player table.
               * Ordering is part of the contract: rows at exactly one week expire first; only rows that
               * started the tick above one week are decremented afterwards.
               */
              suspend fun processWeeklyPlayerContractTick() = db.withTransaction {
                  val players = db.playerDao()
                  players.expireLoanContractsAtOneWeek()
                  players.expireNonLoanContractsAtOneWeek()
                  players.decrementLongerContractsOneWeek()
              }
          '''
          replace_once(repo_path, repo_old, repo_new)

          transfers_path = 'app/src/main/java/com/example/usecase/ProcessTransfersUseCase.kt'
          transfers_old = '''    suspend fun processWeeklyContractsAndLoans() {
                  val allPlayers = repository.getAllPlayers()
                  val updatedPlayers = mutableListOf<Player>()

                  for (player in allPlayers) {
                      var updated = player
                      var modified = false

                      if (updated.contractDurationWeeks > 0) {
                          val newWeeks = updated.contractDurationWeeks - 1
                          if (newWeeks <= 0) {
                              if (updated.isOnLoan) {
                                  // Se estiver emprestado, zera a duração do contrato sem transformar em Free Agent ainda.
                                  // A virada para Free Agent ocorrerá ao término do empréstimo em FinanceUseCase.
                                  updated = updated.copy(
                                      contractDurationWeeks = 0,
                                      isStarter = false,
                                      salary = 0L
                                  )
                              } else {
                                  updated = updated.copy(
                                      contractDurationWeeks = 0,
                                      teamId = null,
                                      originalTeamId = null,
                                      isStarter = false,
                                      salary = 0L
                                  )
                              }
                          } else {
                              updated = updated.copy(contractDurationWeeks = newWeeks)
                          }
                          modified = true
                      }

                      if (modified) {
                          updatedPlayers.add(updated)
                      }
                  }

                  if (updatedPlayers.isNotEmpty()) {
                      repository.updatePlayers(updatedPlayers)
                  }
              }
          '''
          transfers_new = '''    suspend fun processWeeklyContractsAndLoans() {
                  // Phase 9.12B: preserve the exact canonical lifecycle using SQL action sets instead of
                  // loading and rewriting every contracted Player row through Kotlin/Room @Update.
                  repository.processWeeklyPlayerContractTick()
              }
          '''
          replace_once(transfers_path, transfers_old, transfers_new)

          test_path = Path('app/src/test/java/com/example/usecase/ProcessTransfersUseCaseTest.kt')
          test_text = test_path.read_text()
          marker = '''    @Test
              fun sellPlayer_succeeds_when_buyer_exists() = runTest {'''
          if marker not in test_text:
              raise SystemExit('ProcessTransfersUseCaseTest marker missing')
          extra_test = r'''

              @Test
              fun weekly_contract_tick_preserves_existing_expiration_semantics() = runTest {
                  repository.saveTeams(
                      listOf(
                          Team(id = 1L, name = "Owner", city = "A", state = "AA", division = 1),
                          Team(id = 2L, name = "Borrower", city = "B", state = "BB", division = 1)
                      )
                  )
                  repository.savePlayers(
                      listOf(
                          Player(
                              id = 101L,
                              teamId = 1L,
                              name = "Two Weeks",
                              age = 24,
                              position = "MEI",
                              force = 70,
                              salary = 9_000L,
                              contractDurationWeeks = 2,
                              isStarter = true
                          ),
                          Player(
                              id = 102L,
                              teamId = 1L,
                              name = "Expires",
                              age = 25,
                              position = "ATA",
                              force = 71,
                              salary = 10_000L,
                              contractDurationWeeks = 1,
                              isStarter = true
                          ),
                          Player(
                              id = 103L,
                              teamId = 2L,
                              originalTeamId = 1L,
                              name = "Loan Expires",
                              age = 23,
                              position = "DEF",
                              force = 69,
                              salary = 8_000L,
                              contractDurationWeeks = 1,
                              isStarter = true,
                              isOnLoan = true,
                              loanWeeksRemaining = 4
                          ),
                          Player(
                              id = 104L,
                              teamId = 1L,
                              name = "Already Zero",
                              age = 28,
                              position = "GOL",
                              force = 68,
                              salary = 7_000L,
                              contractDurationWeeks = 0,
                              isStarter = true
                          )
                      )
                  )

                  useCase.processWeeklyContractsAndLoans()

                  val twoWeeks = requireNotNull(repository.getPlayer(101L))
                  assertEquals(1, twoWeeks.contractDurationWeeks)
                  assertEquals(1L, twoWeeks.teamId)
                  assertEquals(9_000L, twoWeeks.salary)
                  assertTrue(twoWeeks.isStarter)

                  val expired = requireNotNull(repository.getPlayer(102L))
                  assertEquals(0, expired.contractDurationWeeks)
                  assertEquals(null, expired.teamId)
                  assertEquals(null, expired.originalTeamId)
                  assertEquals(0L, expired.salary)
                  assertTrue(!expired.isStarter)

                  val loanExpired = requireNotNull(repository.getPlayer(103L))
                  assertEquals(0, loanExpired.contractDurationWeeks)
                  assertEquals(2L, loanExpired.teamId)
                  assertEquals(1L, loanExpired.originalTeamId)
                  assertEquals(0L, loanExpired.salary)
                  assertTrue(loanExpired.isOnLoan)
                  assertTrue(!loanExpired.isStarter)

                  val alreadyZero = requireNotNull(repository.getPlayer(104L))
                  assertEquals(0, alreadyZero.contractDurationWeeks)
                  assertEquals(1L, alreadyZero.teamId)
                  assertEquals(7_000L, alreadyZero.salary)
                  assertTrue(alreadyZero.isStarter)
              }
          '''
          idx = test_text.rfind('\n}')
          if idx < 0:
              raise SystemExit('ProcessTransfersUseCaseTest closing brace missing')
          test_path.write_text(test_text[:idx] + extra_test + test_text[idx:])

          audit = Path('reports/fc26_post_bulk_roster_architecture_audit_phase_9_12a.md')
          audit_text = audit.read_text()
          audit_text += r'''

          ## 9.12A dependency-map closure and 9.12B first implementation slice

          The weekly player lifecycle was traced from `GameViewModel.processWeekEndEconomicAndEvolution()`.

          | Stage | Frequency | Baseline player access | Classification | 9.12 decision |
          |---|---|---|---|---|
          | CPU contract renewal | weekly | full `getAllPlayers()` | replaceable in a later Strategy-A slice | retain temporarily because its snapshot also feeds the already-fast CPU integrity pass |
          | contract tick | weekly | full `getAllPlayers()` + chunked `@Update` for every active contract | **replaceable now** | replace with ordered SQL action sets |
          | CPU squad integrity | weekly | consumes renewal snapshot; measured ~116 ms after PR #41 | currently acceptable | preserve behavior while contract tick is isolated |
          | monthly evolution | every 4 weeks | full `getAllPlayers()` | semantically global / consciously retained | do not change in first slice |
          | season transition / aging / retirement | once per season | full `getAllPlayers()` | semantically global / required | retain |
          | integrity repair | season transition / explicit repair | full-table validation/repair | non-weekly safety path | retain |
          | match simulation/stats | per match | team/ID-targeted reads | already targeted | retain |

          ### Strategy-A slice 1

          `ProcessTransfersUseCase.processWeeklyContractsAndLoans()` is converted from Kotlin materialization to three ordered SQL action sets:

          1. expire loaned players at exactly 1 contract week, preserving borrower/owner identity;
          2. expire non-loaned players at exactly 1 week into true free-agent state;
          3. decrement only contracts that started the tick above 1 week.

          Expiration precedes decrement deliberately: reversing the order would make a 2-week contract expire in the same tick and would be a semantic regression.

          This is a DAO/query-only optimization. It adds no entity, column, index, migration, identity rule, player-data mutation rule, or FC26 mapping change. Room remains V21.

          The next measurement gate is the real FC26 CareerFunctionalFlow path. If this slice removes the dominant ~25.9 s contract block and leaves sufficient margin, lazy roster materialization remains unnecessary. If renewal remains dominant, Strategy-A slice 2 will replace renewal's full-table dependency and redesign the integrity input around roster summaries/actionable teams.
          '''
          audit.write_text(audit_text)
          PY

          git rm .github/workflows/phase-9-12-action-set-apply.yml

          git config user.name 'phase-9-12-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -- app/src/main/java/com/example/data/daos.kt
          git add -- app/src/main/java/com/example/data/repository.kt
          git add -- app/src/main/java/com/example/usecase/ProcessTransfersUseCase.kt
          git add -- app/src/test/java/com/example/usecase/ProcessTransfersUseCaseTest.kt
          git add -- reports/fc26_post_bulk_roster_architecture_audit_phase_9_12a.md
          git add -- .github/workflows/phase-9-12-action-set-apply.yml
          git diff --cached --check
          git commit -m 'perf: apply weekly contract action sets'
          git push origin HEAD:agent/fc26-post-bulk-roster-architecture-audit
