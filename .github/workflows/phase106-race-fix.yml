name: Phase 10.6 exact race fix

on:
  push:
    branches:
      - agent/phase-10-6-save-durability-recovery
    paths:
      - '.github/workflows/phase106-race-fix.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase106-race-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply exact function replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          def replace_between(text, start_marker, end_marker, replacement, label):
              starts = text.count(start_marker)
              ends = text.count(end_marker)
              if starts != 1 or ends != 1:
                  raise SystemExit(f'{label} boundary mismatch: start={starts} end={ends}')
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              current = text[start:end]
              if current == replacement:
                  return text, False
              return text[:start] + replacement + text[end:], True

          repo_path = Path('app/src/main/java/com/example/data/repository.kt')
          repo_text = repo_path.read_text()
          repo_replacement = indent(dedent('''\
          suspend fun deleteSave() = db.withTransaction {
              if (db.gameSaveDao().getGameSave() != null) {
                  throw CancellationException(
                      "Exclusão parcial de GameSave bloqueada: remova explicitamente o banco do slot."
                  )
              }
              db.gameSaveDao().deleteSave()
          }
          '''), '    ')
          repo_text, _ = replace_between(
              repo_text,
              '    suspend fun deleteSave()',
              '\n\n    suspend fun promoteAcademyPlayerAtomically',
              repo_replacement.rstrip(),
              'repository.kt deleteSave'
          )
          repo_path.write_text(repo_text)

          vm_path = Path('app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt')
          vm_text = vm_path.read_text()
          select_replacement = indent(dedent('''\
          fun selectSaveSlot(saveId: String) {
              val gen = sessionGeneration.incrementAndGet()
              val repository = saveRepository.getRepositoryForSlot(saveId)
              val session = SaveSession(saveId, repository, gen)
              _activeSaveSession.value = session
              _currentSaveId.value = saveId
              _selectedTeamId.value = null

              viewModelScope.launch(Dispatchers.IO) {
                  try {
                      if (session.generation != sessionGeneration.get()) return@launch
                      val targetRepo = session.repository

                      seedAllDefaultTeams(targetRepo, _selectedCountry.value)
                      if (session.generation != sessionGeneration.get()) return@launch

                      val teams = targetRepo.getAllTeams()
                      val save = targetRepo.getGameSave()
                      if (save != null) {
                          val targetTeam = targetRepo.getTeam(save.playerTeamId)
                          if (targetTeam != null) {
                              val resolvedCountry = DefaultData.getCountryForTeam(targetTeam.name)
                              withContext(Dispatchers.Main) {
                                  _selectedCountry.value = resolvedCountry
                              }
                          }
                      } else {
                          withContext(Dispatchers.Main) {
                              _selectedCountry.value = "Brasil"
                          }
                      }

                      repairRostersIfNecessarySync(session)

                      if (session.generation != sessionGeneration.get()) return@launch

                      if (save != null) {
                          val seasonFixtures = targetRepo.getFixturesForSeason(save.currentSeason)
                          if (seasonFixtures.isEmpty() && teams.isNotEmpty()) {
                              val newFixtures = generateFixturesForSeason(save.currentSeason, teams, save.playerTeamId)
                              targetRepo.saveFixtures(newFixtures)
                          }
                      }
                  } catch (e: kotlinx.coroutines.CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      Log.e("GameViewModel", "Falha ao abrir carreira do slot $saveId; preservando para recuperação", e)
                      if (session.generation != sessionGeneration.get()) return@launch

                      sessionGeneration.incrementAndGet()
                      _activeSaveSession.value = null
                      _currentSaveId.value = null
                      _selectedTeamId.value = null
                      _matchState.value = MatchState.IDLE
                      saveRepository.closeAndRemoveSlot(saveId)

                      try {
                          saveSlots.value = preferencesRepo.loadSaveSlots()
                      } catch (reconcileError: kotlinx.coroutines.CancellationException) {
                          throw reconcileError
                      } catch (reconcileError: Exception) {
                          Log.e("GameViewModel", "Falha ao reconciliar slot $saveId após erro de abertura", reconcileError)
                      }
                      _toastMessage.emit("Não foi possível abrir a carreira. O slot foi preservado para recuperação.")
                  }
              }
          }
          '''), '    ')
          vm_text, _ = replace_between(
              vm_text,
              '    fun selectSaveSlot(saveId: String) {',
              '\n\n    fun repairRostersIfNecessary()',
              select_replacement.rstrip(),
              'GameViewModel selectSaveSlot'
          )

          country_replacement = indent(dedent('''\
          fun selectCountry(country: String) {
              val session = _activeSaveSession.value ?: return
              val targetRepo = session.repository
              val generation = session.generation
              _selectedCountry.value = country

              viewModelScope.launch(Dispatchers.IO) {
                  if (generation != sessionGeneration.get()) return@launch

                  targetRepo.withTransaction {
                      targetRepo.deleteSave()
                      targetRepo.deleteFixtures()
                      targetRepo.deleteOffers()
                      seedAllDefaultTeams(targetRepo, country)
                  }
                  _selectedTeamId.value = null
              }
          }
          '''), '    ')
          vm_text, _ = replace_between(
              vm_text,
              '    fun selectCountry(country: String) {',
              '\n\n    enum class MatchState',
              country_replacement.rstrip(),
              'GameViewModel selectCountry'
          )
          vm_path.write_text(vm_text)
          PY

          git diff --check
          git diff --stat -- app/src/main/java/com/example/data/repository.kt app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          git diff -- app/src/main/java/com/example/data/repository.kt app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt

      - name: Commit exact fixes when needed
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/com/example/data/repository.kt app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt; then
            echo "Exact race fixes already present."
            exit 0
          fi
          git config user.name "Leo-Mala"
          git config user.email "leomalaj10@gmail.com"
          git add app/src/main/java/com/example/data/repository.kt app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          git commit -m "fix(save): close slot lifecycle races"
          git push origin "HEAD:${BRANCH_NAME}"
