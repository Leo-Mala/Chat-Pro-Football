# CI-only trigger for the latest tested manual-test fixes.
# Certified candidate after compact monthly delta benchmark and 512 MB season gate.
name: Build recovered crest APK

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/build-recovered-crest-apk.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CERTIFIED_CREST_DRIVE_FILE_ID: 1fPuUUDmaIut5gapYztvujNWHeRSRbtF3
      EXPECTED_ARCHIVE_SIZE: '11751550'
      EXPECTED_ARCHIVE_SHA256: 3b8419298e03a593f23c750a91fda7613f3af395dcd770c13c9f17278f265dc3
      EXPECTED_CLUB_CRESTS: '1907'
      EXPECTED_FACTUAL_CRESTS: '617'
      EXPECTED_TOTAL_CRESTS: '2524'
      EXPECTED_CREST_FINGERPRINT: d1e1d99114739fe4827a5aa37af2e0f7b71829dd87966ba406ddc622d6050e90
      EXPECTED_SIGNING_CERT_SHA256: 28ee293d63da9b2c3f3b8ab25c29f19464ab90431c440b4a1e71bf36c9bef741
      EXPECTED_NATIVE_SO_COUNT: '8'
    steps:
      - name: Checkout exact bugfix head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record exact build SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "BUILD_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Recover exact certified 2524-crest runtime from durable Drive backup
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/recovered-crest-source"
          archive="$work/certified-club-crests-2524-d1e1d991.tar.zst"
          recovered="$work/recovered"
          rm -rf "$work" app/src/main/assets/club_crests
          mkdir -p "$recovered" app/src/main/assets/club_crests

          url="https://drive.usercontent.google.com/download?id=${CERTIFIED_CREST_DRIVE_FILE_ID}&export=download&confirm=t"
          curl --fail --location --show-error --silent \
            --retry 3 --retry-all-errors \
            "$url" \
            --output "$archive"

          actual_size="$(stat -c '%s' "$archive")"
          actual_sha="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual_size" = "$EXPECTED_ARCHIVE_SIZE"
          test "$actual_sha" = "$EXPECTED_ARCHIVE_SHA256"

          tar --zstd -xf "$archive" -C "$recovered"
          source_dir="$recovered/club_crests"
          test -d "$source_dir"

          club="$(find "$source_dir" -maxdepth 1 -type f -name 'club_*.webp' | wc -l)"
          factual="$(find "$source_dir" -maxdepth 1 -type f -name 'factual_*.webp' | wc -l)"
          total="$(find "$source_dir" -maxdepth 1 -type f -name '*.webp' | wc -l)"
          test "$club" = "$EXPECTED_CLUB_CRESTS"
          test "$factual" = "$EXPECTED_FACTUAL_CRESTS"
          test "$total" = "$EXPECTED_TOTAL_CRESTS"

          fingerprint="$(python3 - "$source_dir" <<'PY'
          import hashlib
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          files = sorted(source.glob('*.webp'), key=lambda p: p.name)
          digest = hashlib.sha256()
          for path in files:
              canonical = 'assets/club_crests/' + path.name
              digest.update(canonical.encode('utf-8'))
              digest.update(b'\0')
              digest.update(hashlib.sha256(path.read_bytes()).digest())
          print(digest.hexdigest())
          PY
          )"
          test "$fingerprint" = "$EXPECTED_CREST_FINGERPRINT"

          cat > "$work/critical-crests.sha256" <<'EOF'
          65ca6430af87241277c2bc6c25264b60d1d7b4697ff7b1b0fd7e51a52479509c  factual_4009.webp
          e07d74e4519b4eb2ab49a8e87a992b13b4b0817f366c7712183e281530a1d530  factual_4014.webp
          a9843c342c2149147e0413248643f9ed62d2a462ad70093512be95dbfff6212e  factual_4002.webp
          3cc63888b2f1a21d8d80d19dc46299b4bfef95e8c221442569169b18075ccd32  factual_4008.webp
          6f1413f8d8a6b7ba3893c764bd7b1dd81ec3442479549eee68de30d8c06271c8  factual_4017.webp
          aa567ebbaaf2b3b84bbf27b8b8f417f9d6039fa7eff6f11187b597565c17484f  factual_4004.webp
          4ce17fb59fe799fa82a6d4a2ad03a97a226fe75c86b0b5d5f8c06f0d16f11b2a  factual_4018.webp
          EOF
          (
            cd "$source_dir"
            sha256sum -c "$work/critical-crests.sha256"
          )

          cp "$source_dir"/*.webp app/src/main/assets/club_crests/
          test "$(find app/src/main/assets/club_crests -maxdepth 1 -type f -name '*.webp' | wc -l)" = "$EXPECTED_TOTAL_CRESTS"

          echo "source_drive_file_id=${CERTIFIED_CREST_DRIVE_FILE_ID}" >> "$GITHUB_OUTPUT"
          echo "source_archive_sha256=${actual_sha}" >> "$GITHUB_OUTPUT"
          echo "source_archive_size=${actual_size}" >> "$GITHUB_OUTPUT"
          echo "source_crest_fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"
          echo "Recovered certified runtime from Drive: ${club} club + ${factual} factual = ${total}; fingerprint=${fingerprint}"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Prepare Android validation files
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then base64 -d debug.keystore.base64 > debug.keystore; fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug, O=Android, C=US'
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Run real crest resolver regression
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            --tests com.example.data.BundledClubCrestsTest \
            --stacktrace

      - name: Run mandatory current manual-test regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            -PexcludeStressTests=true \
            --tests com.example.ui.viewmodel.PostGameReturnToCentralRegressionTest \
            --tests com.example.usecase.SeasonSimulationCompletionRegressionTest \
            --tests com.example.usecase.FullSeasonSimulationDoesNotHangRegressionTest \
            --tests com.example.ui.viewmodel.ClubStrengthImmediateRefreshTest \
            --tests com.example.ui.viewmodel.ClubStrength99RosterConsistencyTest \
            --tests com.example.usecase.MarketPurchaseImmediateRemovalTest \
            --tests com.example.usecase.MarketStrengthAlwaysVisibleTest \
            --tests com.example.usecase.ScoutRemovalNavigationTest \
            --tests com.example.usecase.LeagueTableImmediateRefreshTest \
            --tests com.example.data.FixtureRealClubIdentityCrestRegressionTest \
            --tests com.example.CoachAvatarPersistenceTest \
            --tests com.example.ui.viewmodel.LiveMatchSkipRegressionTest \
            --tests com.example.ui.viewmodel.LiveMatchPersistenceOrderingRegressionTest \
            --tests com.example.ui.viewmodel.Post90FinalizationStateRegressionTest \
            --tests com.example.ui.viewmodel.LiveMatchFinalizationCannotBeCancelledRegressionTest \
            --tests com.example.ui.viewmodel.LiveMatchFinalizationIdempotencyRegressionTest \
            --tests com.example.ui.viewmodel.TeamStrength99RealEditorPathRegressionTest \
            --tests com.example.ui.viewmodel.TeamStrength99PersistenceRegressionTest \
            --tests com.example.ui.viewmodel.TeamRatingDoesNotDropAfter99EditRegressionTest \
            --tests com.example.ui.viewmodel.EditorRosterNoFalseZeroRegressionTest \
            --tests com.example.ui.screens.ClubCrestUiIdentityRegressionTest \
            --tests com.example.ui.screens.LiveMatchFeedOrderingRegressionTest \
            --tests com.example.usecase.CompletedFixtureDashboardRegressionTest \
            --tests com.example.usecase.MonthlyEvolutionWeekFourRegressionTest \
            --tests com.example.usecase.SeasonSimulationRegressionTest \
            --tests com.example.data.PreCareerEditorOverridesTest \
            --tests com.example.ui.screens.EditorNavigationRegressionTest \
            --tests com.example.usecase.RestartSeasonPersistenceTest \
            --tests com.example.usecase.MarketPurchaseRefreshTest \
            --tests com.example.usecase.MarketPurchasePersistenceTest \
            --tests com.example.usecase.MatchStatisticsIdempotencyTest \
            --tests com.example.ui.viewmodel.ClubStrengthReactiveUpdateTest \
            --tests com.example.ui.viewmodel.PlayerEditorReactiveUpdateTest \
            --tests com.example.data.PlayerEvolutionRegressionTest \
            --tests com.example.data.PlayerEvolutionMonthlyEngineRegressionTest \
            --tests com.example.data.MonthlyEvolutionHistoryBulkWriterTest \
            --tests com.example.data.ManualStrengthPersistenceRegressionTest \
            --tests com.example.usecase.TacticsUseCaseAutoLineupTest \
            --tests com.example.WeeklyFinalizationAtomicityTest \
            --tests com.example.InterruptedWeeklyCloseRecoveryTest \
            --tests com.example.Phase106LifecycleRaceRegressionTest \
            --tests com.example.usecase.CpuSquadManagementUseCaseTest \
            --tests com.example.usecase.PlayerSaleBuyerCapacityRegressionTest \
            --tests com.example.usecase.PlayerSaleImmediateRemovalRegressionTest \
            --tests com.example.usecase.PlayerSalePersistenceRegressionTest \
            --tests com.example.usecase.PlayerSaleNoDoubleCreditRegressionTest \
            --tests com.example.usecase.InstallmentSaleBuyerCapacityRegressionTest \
            --tests com.example.usecase.CareerCreationPerformanceTest \
            --tests com.example.data.CareerSeedTemplateRuntimeTest \
            --tests com.example.data.ProceduralRosterOnlyTest \
            --tests com.example.data.BrasfootRealClubIdentityTest \
            --tests com.example.data.BrasfootPatchCrestsTest \
            --stacktrace

      - name: Build installable Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          mkdir -p manual-test-apk
          out="manual-test-apk/Pro-Football-3.0.1-manual-test-${GITHUB_SHA}.apk"
          cp "$apk" "$out"
          sha256sum "$out" | tee manual-test-apk/SHA256SUMS.txt
          stat -c 'size_bytes=%s' "$out" | tee manual-test-apk/APK_SIZE.txt
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'branch=%s\n' "$GITHUB_REF_NAME"
            printf 'source_drive_file_id=%s\n' '${{ steps.recover.outputs.source_drive_file_id }}'
            printf 'source_archive_sha256=%s\n' '${{ steps.recover.outputs.source_archive_sha256 }}'
            printf 'source_archive_size=%s\n' '${{ steps.recover.outputs.source_archive_size }}'
            printf 'source_crest_fingerprint=%s\n' '${{ steps.recover.outputs.source_crest_fingerprint }}'
          } > manual-test-apk/BUILD_INFO.txt

      - name: Validate APK integrity signature 16K alignment and certified crest fingerprint
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find manual-test-apk -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          unzip -t "$apk" >/dev/null

          total=$(unzip -Z1 "$apk" | grep -c '^assets/club_crests/[^/]*$' || true)
          club=$(unzip -Z1 "$apk" | grep -Ec '^assets/club_crests/club_[0-9]+\.webp$' || true)
          factual=$(unzip -Z1 "$apk" | grep -Ec '^assets/club_crests/factual_[0-9]+\.webp$' || true)
          test "$total" = "$EXPECTED_TOTAL_CRESTS"
          test "$club" = "$EXPECTED_CLUB_CRESTS"
          test "$factual" = "$EXPECTED_FACTUAL_CRESTS"

          fingerprint=$(python3 - "$apk" <<'PY'
          import hashlib
          import pathlib
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as z:
              names = sorted(
                  n for n in z.namelist()
                  if n.startswith('assets/club_crests/') and not n.endswith('/')
              )
              h = hashlib.sha256()
              for name in names:
                  canonical = 'assets/club_crests/' + pathlib.PurePosixPath(name).name
                  h.update(canonical.encode('utf-8'))
                  h.update(b'\0')
                  h.update(hashlib.sha256(z.read(name)).digest())
              print(h.hexdigest())
          PY
          )
          test "$fingerprint" = "$EXPECTED_CREST_FINGERPRINT"

          so_count=$(unzip -Z1 "$apk" | grep -Ec '^lib/[^/]+/[^/]+\.so$' || true)
          test "$so_count" = "$EXPECTED_NATIVE_SO_COUNT"
          printf 'native_so_count=%s\n' "$so_count" | tee manual-test-apk/NATIVE_LIBS.txt

          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)
          test -n "$bt"
          zipalign="$ANDROID_HOME/build-tools/$bt/zipalign"
          apksigner="$ANDROID_HOME/build-tools/$bt/apksigner"
          aapt="$ANDROID_HOME/build-tools/$bt/aapt"
          test -x "$zipalign"
          test -x "$apksigner"
          test -x "$aapt"

          "$zipalign" -c -v 4 "$apk" >/dev/null
          "$zipalign" -c -P 16 -v 4 "$apk" | tee manual-test-apk/ALIGNMENT_16K.txt
          "$apksigner" verify --verbose --print-certs "$apk" | tee manual-test-apk/SIGNATURE.txt
          cert_sha256=$(awk -F': ' '/certificate SHA-256 digest/ {print $NF; exit}' manual-test-apk/SIGNATURE.txt)
          test -n "$cert_sha256"
          actual_cert=$(printf '%s' "$cert_sha256" | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]')
          expected_cert=$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]')
          test "${#actual_cert}" -eq 64
          test "$actual_cert" = "$expected_cert"
          printf 'certificate_sha256=%s\n' "$actual_cert" | tee manual-test-apk/SIGNING_IDENTITY.txt

          "$aapt" dump badging "$apk" | tee manual-test-apk/BADGING.txt
          grep -q "package: name='com.aistudio.brasfutretro.djuxzt' versionCode='32' versionName='3.0.1'" manual-test-apk/BADGING.txt
          printf 'crest_total=%s\nclub=%s\nfactual=%s\nfingerprint=%s\n' \
            "$total" "$club" "$factual" "$fingerprint" | tee manual-test-apk/CREST_BUNDLE.txt

      - name: Upload exact installable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crest-fix-manual-test-apk-${{ github.sha }}
          path: manual-test-apk/
          if-no-files-found: error
          retention-days: 7

      - name: Upload focused failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crest-fix-failure-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
