name: Season simulation regression repair v3

on:
  push:
    branches:
      - diagnostics/fix-season-simulation-regression-4df4987b
    paths:
      - .github/workflows/season-simulation-regression-fix-v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: diagnostics/fix-season-simulation-regression-4df4987b
          fetch-depth: 0

      - name: Verify production source still matches official base
        run: |
          set -euo pipefail
          BASE=4df4987bd9fe284acdd6c8fb081f5969e568ddc1
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --quiet "$BASE" -- app/src/main app/src/test

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Apply exact regression repair
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-season-simulation-regression-repair.py
          ! grep -R -n -E 'shouldPauseSeasonSimulationForExpiringContracts|getControlledRosterExpiringContractCount' app/src/main app/src/test
          grep -n 'Erro durante a simulação de temporada' app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          grep -n 'Simulação interrompida' app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          git diff --check

      - name: Compile repaired debug sources
        run: ./gradlew kspDebugKotlin compileDebugKotlin --stacktrace

      - name: Run focused season simulation regression tests
        run: ./gradlew testDebugUnitTest --tests com.example.ui.viewmodel.SeasonSimulationContinuousRegressionTest --stacktrace

      - name: Create ephemeral CI debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt \
                  app/src/main/java/com/example/data/repository.kt \
                  app/src/test/java/com/example/ui/viewmodel/SeasonSimulationContractGuardRegressionTest.kt \
                  app/src/test/java/com/example/ui/viewmodel/SeasonSimulationContinuousRegressionTest.kt
          git diff --cached --check
          git commit -m 'fix: restore continuous season simulation'
          git push origin HEAD:diagnostics/fix-season-simulation-regression-4df4987b
