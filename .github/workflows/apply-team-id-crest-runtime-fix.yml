name: Apply team-id crest runtime fix

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/apply-team-id-crest-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch-and-compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact working head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply fail-closed UI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          game = Path('app/src/main/java/com/example/ui/screens/GameScreens.kt')
          replace_once(
              game,
              'fun TeamBadge(\n    teamName: String,\n    logoUrl: String?,\n    modifier: Modifier = Modifier,',
              'fun TeamBadge(\n    teamName: String,\n    logoUrl: String?,\n    teamId: Int? = null,\n    modifier: Modifier = Modifier,',
              'TeamBadge signature',
          )
          replace_once(
              game,
              '    val badgeColor = getTeamColor(teamName, colorHex)\n    var isSuccess by remember(logoUrl) { mutableStateOf(false) }\n    val resolvedUrl = remember(logoUrl) { resolveLogoUrl(logoUrl) }\n    val isBundledPatchCrest = remember(resolvedUrl) {',
              '    val context = LocalContext.current\n    val badgeColor = getTeamColor(teamName, colorHex)\n    val fallbackUrl = remember(logoUrl) { resolveLogoUrl(logoUrl) }\n    val resolvedUrl = remember(context, teamId, fallbackUrl) {\n        BundledClubCrests.resolve(context, teamId, fallbackUrl)\n    }\n    var isSuccess by remember(resolvedUrl) { mutableStateOf(false) }\n    val isBundledPatchCrest = remember(resolvedUrl) {',
              'TeamBadge resolver',
          )
          replace_once(
              game,
              '        val abbrev = teamName.take(2).uppercase()\n        val context = androidx.compose.ui.platform.LocalContext.current\n\n        if (!resolvedUrl.isNullOrEmpty()) {',
              '        val abbrev = teamName.take(2).uppercase()\n\n        if (!resolvedUrl.isNullOrEmpty()) {',
              'TeamBadge context de-duplication',
          )

          selection = Path('app/src/main/java/com/example/ui/screens/TeamSelectionScreen.kt')
          replace_once(
              selection,
              '''                                // Emblem placeholder or Url image
                                Box(
                                    modifier = Modifier
                                        .size(44.dp)
                                        .background(MaterialTheme.colorScheme.onBackground.copy(alpha = 0.1f), CircleShape),
                                    contentAlignment = Alignment.Center
                                ) {
                                    if (team.logoUrl != null) {
                                        val resolvedLogo = remember(team.logoUrl) { resolveLogoUrl(team.logoUrl) }
                                        Image(
                                            painter = rememberAsyncImagePainter(resolvedLogo),
                                            contentDescription = team.name,
                                            modifier = Modifier.size(36.dp)
                                        )
                                    } else {
                                        Icon(
                                            Icons.Default.SportsSoccer,
                                            contentDescription = null,
                                            tint = AccentLime,
                                            modifier = Modifier.size(24.dp)
                                        )
                                    }
                                }''',
              '''                                TeamBadge(
                                    teamName = team.name,
                                    logoUrl = team.logoUrl,
                                    teamId = team.id,
                                    size = 44.dp
                                )''',
              'team selection crest renderer',
          )

          dashboard = Path('app/src/main/java/com/example/ui/components/dashboard/DashboardTabContent.kt')
          replace_once(
              dashboard,
              '                            TeamBadge(\n                                teamName = pTeam.name,\n                                logoUrl = pTeam.logoUrl,\n                                size = 56.dp\n                            )',
              '                            TeamBadge(\n                                teamName = pTeam.name,\n                                logoUrl = pTeam.logoUrl,\n                                teamId = pTeam.id,\n                                size = 56.dp\n                            )',
              'dashboard player crest',
          )
          replace_once(
              dashboard,
              '                            TeamBadge(\n                                teamName = opponentName,\n                                logoUrl = opponentLogo,\n                                size = 56.dp\n                            )',
              '                            TeamBadge(\n                                teamName = opponentName,\n                                logoUrl = opponentLogo,\n                                teamId = opponentId,\n                                size = 56.dp\n                            )',
              'dashboard opponent crest',
          )
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Setup validation google-services.json
        shell: bash
        run: |
          cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},
            "client": [{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],
            "configuration_version":"1"
          }
          GOOGLE_EOF

      - name: Setup debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then base64 -d debug.keystore.base64 > debug.keystore; fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Compile production and regression test sources
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:compileDebugUnitTestKotlin -PexcludeStressTests=true --stacktrace

      - name: Commit only after successful compilation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/example/ui/screens/GameScreens.kt \
            app/src/main/java/com/example/ui/screens/TeamSelectionScreen.kt \
            app/src/main/java/com/example/ui/components/dashboard/DashboardTabContent.kt
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix: use stable team ids for bundled crests'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
