name: Certified crest Android decode

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/certified-crest-android-decode.yml
      - .accelerated-realization/certified-crest-android-decode.trigger
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: certified-crest-android-decode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decode-certified-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CLUB_CRESTS: '1907'
      EXPECTED_FACTUAL_CRESTS: '617'
      EXPECTED_TOTAL_CRESTS: '2524'
      EXPECTED_CREST_FINGERPRINT: d1e1d99114739fe4827a5aa37af2e0f7b71829dd87966ba406ddc622d6050e90
    steps:
      - name: Checkout exact gate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Recover exact certified runtime from permanent v3.0.1 release assets
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/certified-crest-release"
          rm -rf "$work" app/src/main/assets/club_crests
          mkdir -p "$work/assets" "$work/recovered" app/src/main/assets/club_crests

          gh release download v3.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Pro-Football-3.0.1-vc32.apk' \
            --pattern 'Pro-Football-3.0.1-vc32.aab' \
            --dir "$work/assets"
          sha256sum "$work"/assets/* | tee "$work/release-assets.sha256"

          python3 - "$work" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys
          import zipfile

          work = pathlib.Path(sys.argv[1])
          target = os.environ['EXPECTED_CREST_FINGERPRINT']
          expected_total = int(os.environ['EXPECTED_TOTAL_CRESTS'])
          expected_club = int(os.environ['EXPECTED_CLUB_CRESTS'])
          expected_factual = int(os.environ['EXPECTED_FACTUAL_CRESTS'])
          report = []
          recovered = False

          for path in sorted((work / 'assets').glob('*')):
              if path.suffix not in {'.apk', '.aab'}:
                  continue
              with zipfile.ZipFile(path) as z:
                  names = []
                  prefix_used = None
                  for prefix in ('assets/club_crests/', 'base/assets/club_crests/'):
                      candidate = sorted(
                          n for n in z.namelist()
                          if n.startswith(prefix) and not n.endswith('/')
                      )
                      if candidate:
                          names = candidate
                          prefix_used = prefix
                          break

                  club = sum(pathlib.PurePosixPath(n).name.startswith('club_') for n in names)
                  factual = sum(pathlib.PurePosixPath(n).name.startswith('factual_') for n in names)
                  digest = hashlib.sha256()
                  for name in names:
                      canonical = 'assets/club_crests/' + pathlib.PurePosixPath(name).name
                      digest.update(canonical.encode('utf-8'))
                      digest.update(b'\0')
                      digest.update(hashlib.sha256(z.read(name)).digest())
                  fingerprint = digest.hexdigest() if names else None
                  row = {
                      'file': path.name,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                      'prefix': prefix_used,
                      'total': len(names),
                      'club': club,
                      'factual': factual,
                      'fingerprint': fingerprint,
                  }
                  report.append(row)
                  print(json.dumps(row, sort_keys=True))

                  if (
                      len(names) == expected_total
                      and club == expected_club
                      and factual == expected_factual
                      and fingerprint == target
                  ):
                      out = work / 'recovered'
                      for name in names:
                          (out / pathlib.PurePosixPath(name).name).write_bytes(z.read(name))
                      (out / 'SOURCE.txt').write_text(path.name + '\n', encoding='utf-8')
                      (out / 'FINGERPRINT.txt').write_text(fingerprint + '\n', encoding='utf-8')
                      recovered = True
                      break

          (work / 'release-crest-inspection.json').write_text(
              json.dumps(report, indent=2), encoding='utf-8'
          )
          if not recovered:
              raise SystemExit(
                  'No permanent v3.0.1 release asset proved the exact certified 2524-crest fingerprint.'
              )
          PY

          test "$(find "$work/recovered" -maxdepth 1 -type f -name '*.webp' | wc -l)" = "$EXPECTED_TOTAL_CRESTS"
          test "$(find "$work/recovered" -maxdepth 1 -type f -name 'club_*.webp' | wc -l)" = "$EXPECTED_CLUB_CRESTS"
          test "$(find "$work/recovered" -maxdepth 1 -type f -name 'factual_*.webp' | wc -l)" = "$EXPECTED_FACTUAL_CRESTS"
          test "$(cat "$work/recovered/FINGERPRINT.txt")" = "$EXPECTED_CREST_FINGERPRINT"

          cp "$work/recovered"/*.webp app/src/main/assets/club_crests/
          printf 'total=%s\nclub=%s\nfactual=%s\nfingerprint=%s\nsource=%s\n' \
            "$EXPECTED_TOTAL_CRESTS" \
            "$EXPECTED_CLUB_CRESTS" \
            "$EXPECTED_FACTUAL_CRESTS" \
            "$EXPECTED_CREST_FINGERPRINT" \
            "$(cat "$work/recovered/SOURCE.txt")" \
            | tee "$RUNNER_TEMP/crest-runtime.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Prepare Android validation files
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then base64 -d debug.keystore.base64 > debug.keystore; fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug, O=Android, C=US'
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Run certified resolver and structural corpus regression
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PexcludeStressTests=true \
            --tests com.example.data.BundledClubCrestsTest \
            --stacktrace

      - name: Build target and AndroidTest APKs with certified corpus
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$(find app/build/outputs/apk/androidTest/debug -type f -name '*-androidTest.apk' -print -quit)"

      - name: Enable KVM acceleration when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device not exposed; emulator will use supported fallback."
          fi

      - name: Decode all 2524 certified crests on Android API 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            target_apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
            test_apk=$(find app/build/outputs/apk/androidTest/debug -type f -name '*-androidTest.apk' -print -quit)
            test -n "$target_apk"
            test -n "$test_apk"
            adb install -r "$target_apk"
            adb install -r "$test_apk"
            adb shell am instrument -w -r \
              -e class com.example.data.BundledClubCrestsAndroidDecodeInstrumentedTest \
              com.aistudio.brasfutretro.djuxzt.test/androidx.test.runner.AndroidJUnitRunner \
              | tee "$RUNNER_TEMP/crest-android-decode.txt"
            grep -q 'OK (1 test)' "$RUNNER_TEMP/crest-android-decode.txt"

      - name: Upload crest decode evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certified-crest-android-decode-${{ github.sha }}
          path: |
            ${{ runner.temp }}/crest-runtime.txt
            ${{ runner.temp }}/crest-android-decode.txt
          if-no-files-found: warn
          retention-days: 7
