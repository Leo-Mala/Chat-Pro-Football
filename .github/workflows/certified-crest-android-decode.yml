name: Certified crest Android decode

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/certified-crest-android-decode.yml
      - .accelerated-realization/certified-crest-android-decode.trigger
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: certified-crest-android-decode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decode-certified-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CERTIFIED_CREST_DRIVE_FILE_ID: 1fPuUUDmaIut5gapYztvujNWHeRSRbtF3
      EXPECTED_ARCHIVE_SIZE: '11751550'
      EXPECTED_ARCHIVE_SHA256: 3b8419298e03a593f23c750a91fda7613f3af395dcd770c13c9f17278f265dc3
      EXPECTED_CLUB_CRESTS: '1907'
      EXPECTED_FACTUAL_CRESTS: '617'
      EXPECTED_TOTAL_CRESTS: '2524'
      EXPECTED_CREST_FINGERPRINT: d1e1d99114739fe4827a5aa37af2e0f7b71829dd87966ba406ddc622d6050e90
    steps:
      - name: Checkout exact gate head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Recover exact certified runtime from durable Drive backup
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/certified-crest-drive"
          archive="$work/certified-club-crests-2524-d1e1d991.tar.zst"
          recovered="$work/recovered"
          rm -rf "$work" app/src/main/assets/club_crests
          mkdir -p "$recovered" app/src/main/assets/club_crests

          url="https://drive.usercontent.google.com/download?id=${CERTIFIED_CREST_DRIVE_FILE_ID}&export=download&confirm=t"
          curl --fail --location --show-error --silent \
            --retry 3 --retry-all-errors \
            "$url" \
            --output "$archive"

          actual_size="$(stat -c '%s' "$archive")"
          actual_sha="$(sha256sum "$archive" | awk '{print $1}')"
          printf 'archive_size=%s\narchive_sha256=%s\n' "$actual_size" "$actual_sha" | tee "$work/archive-identity.txt"
          test "$actual_size" = "$EXPECTED_ARCHIVE_SIZE"
          test "$actual_sha" = "$EXPECTED_ARCHIVE_SHA256"

          tar --zstd -xf "$archive" -C "$recovered"
          source_dir="$recovered/club_crests"
          test -d "$source_dir"
          test "$(find "$source_dir" -maxdepth 1 -type f -name 'club_*.webp' | wc -l)" = "$EXPECTED_CLUB_CRESTS"
          test "$(find "$source_dir" -maxdepth 1 -type f -name 'factual_*.webp' | wc -l)" = "$EXPECTED_FACTUAL_CRESTS"
          test "$(find "$source_dir" -maxdepth 1 -type f -name '*.webp' | wc -l)" = "$EXPECTED_TOTAL_CRESTS"

          python3 - "$source_dir" <<'PY'
          import hashlib
          import os
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          expected = os.environ['EXPECTED_CREST_FINGERPRINT']
          files = sorted(source.glob('*.webp'), key=lambda p: p.name)
          digest = hashlib.sha256()
          for path in files:
              canonical = 'assets/club_crests/' + path.name
              digest.update(canonical.encode('utf-8'))
              digest.update(b'\0')
              digest.update(hashlib.sha256(path.read_bytes()).digest())
          actual = digest.hexdigest()
          print(f'crest_fingerprint={actual}')
          if actual != expected:
              raise SystemExit(f'Certified crest fingerprint mismatch: {actual} != {expected}')
          PY

          cat > "$work/critical-crests.sha256" <<'EOF'
          65ca6430af87241277c2bc6c25264b60d1d7b4697ff7b1b0fd7e51a52479509c  factual_4009.webp
          e07d74e4519b4eb2ab49a8e87a992b13b4b0817f366c7712183e281530a1d530  factual_4014.webp
          a9843c342c2149147e0413248643f9ed62d2a462ad70093512be95dbfff6212e  factual_4002.webp
          3cc63888b2f1a21d8d80d19dc46299b4bfef95e8c221442569169b18075ccd32  factual_4008.webp
          6f1413f8d8a6b7ba3893c764bd7b1dd81ec3442479549eee68de30d8c06271c8  factual_4017.webp
          aa567ebbaaf2b3b84bbf27b8b8f417f9d6039fa7eff6f11187b597565c17484f  factual_4004.webp
          4ce17fb59fe799fa82a6d4a2ad03a97a226fe75c86b0b5d5f8c06f0d16f11b2a  factual_4018.webp
          EOF
          (
            cd "$source_dir"
            sha256sum -c "$work/critical-crests.sha256"
          )

          cp "$source_dir"/*.webp app/src/main/assets/club_crests/
          printf 'total=%s\nclub=%s\nfactual=%s\nfingerprint=%s\narchive_sha256=%s\narchive_size=%s\nsource=google-drive:%s\n' \
            "$EXPECTED_TOTAL_CRESTS" \
            "$EXPECTED_CLUB_CRESTS" \
            "$EXPECTED_FACTUAL_CRESTS" \
            "$EXPECTED_CREST_FINGERPRINT" \
            "$EXPECTED_ARCHIVE_SHA256" \
            "$EXPECTED_ARCHIVE_SIZE" \
            "$CERTIFIED_CREST_DRIVE_FILE_ID" \
            | tee "$RUNNER_TEMP/crest-runtime.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Prepare Android validation files
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then base64 -d debug.keystore.base64 > debug.keystore; fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug, O=Android, C=US'
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Run certified resolver and structural corpus regression
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            --tests com.example.data.BundledClubCrestsTest \
            --stacktrace

      - name: Build target and AndroidTest APKs with certified corpus
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$(find app/build/outputs/apk/androidTest/debug -type f -name '*-androidTest.apk' -print -quit)"

      - name: Enable KVM acceleration when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device not exposed; emulator will use supported fallback."
          fi

      - name: Decode all 2524 certified crests on Android API 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            target_apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
            test_apk=$(find app/build/outputs/apk/androidTest/debug -type f -name '*-androidTest.apk' -print -quit)
            test -n "$target_apk"
            test -n "$test_apk"
            adb install -r "$target_apk"
            adb install -r "$test_apk"
            adb shell am instrument -w -r \
              -e class com.example.data.BundledClubCrestsAndroidDecodeInstrumentedTest \
              com.aistudio.brasfutretro.djuxzt.test/androidx.test.runner.AndroidJUnitRunner \
              | tee "$RUNNER_TEMP/crest-android-decode.txt"
            grep -q 'OK (1 test)' "$RUNNER_TEMP/crest-android-decode.txt"

      - name: Upload crest decode evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: certified-crest-android-decode-${{ github.sha }}
          path: |
            ${{ runner.temp }}/crest-runtime.txt
            ${{ runner.temp }}/crest-android-decode.txt
          if-no-files-found: warn
          retention-days: 7
