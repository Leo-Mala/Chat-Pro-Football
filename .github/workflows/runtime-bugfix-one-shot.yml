name: Runtime bugfix one-shot patch

on:
  push:
    branches:
      - agent/3.0.1-runtime-bugfixes
    paths:
      - .github/workflows/runtime-bugfix-one-shot.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply one-shot runtime patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/3.0.1-runtime-bugfixes
          fetch-depth: 0
      - name: Apply exact fail-closed patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\n--- old ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          # Bulk persistence: Room list @Upsert/@Insert already iterates prepared statements inside
          # the existing transaction. 100-row caller chunking only multiplies DAO call overhead.
          replace_once(
              "app/src/main/java/com/example/data/repository.kt",
              '''        if (teamsToPersist.size > 100) {
            teamsToPersist.chunked(100).forEach { db.teamDao().insertTeams(it) }
        } else {
            db.teamDao().insertTeams(teamsToPersist)
        }''',
              '''        if (teamsToPersist.isNotEmpty()) {
            db.teamDao().insertTeams(teamsToPersist)
        }'''
          )
          replace_once(
              "app/src/main/java/com/example/data/repository.kt",
              '''        if (playersToPersist.size > 100) {
            playersToPersist.chunked(100).forEach { db.playerDao().insertPlayersReplace(it) }
        } else {
            db.playerDao().insertPlayersReplace(playersToPersist)
        }''',
              '''        if (playersToPersist.isNotEmpty()) {
            db.playerDao().insertPlayersReplace(playersToPersist)
        }'''
          )
          replace_once(
              "app/src/main/java/com/example/data/repository.kt",
              '''        if (fixtures.size > 100) {
            fixtures.chunked(100).forEach { db.fixtureDao().insertFixtures(it) }
        } else {
            db.fixtureDao().insertFixtures(fixtures)
        }''',
              '''        db.fixtureDao().insertFixtures(fixtures)'''
          )

          # Persisted fixture lookup for idempotent stat finalization.
          replace_once(
              "app/src/main/java/com/example/data/daos.kt",
              '''    @Query("SELECT * FROM fixtures WHERE season = :season ORDER BY week ASC, matchSlot ASC, id ASC")
    suspend fun getFixturesForSeason(season: Int): List<Fixture>
''',
              '''    @Query("SELECT * FROM fixtures WHERE season = :season ORDER BY week ASC, matchSlot ASC, id ASC")
    suspend fun getFixturesForSeason(season: Int): List<Fixture>

    @Query("SELECT * FROM fixtures WHERE id = :id LIMIT 1")
    suspend fun getFixture(id: Long): Fixture?
'''
          )
          replace_once(
              "app/src/main/java/com/example/data/repository.kt",
              '''    suspend fun getAllFixtures(): List<Fixture> = db.fixtureDao().getAllFixtures()
''',
              '''    suspend fun getAllFixtures(): List<Fixture> = db.fixtureDao().getAllFixtures()
    suspend fun getFixture(id: Long): Fixture? = db.fixtureDao().getFixture(id)
'''
          )

          # Seasonal stats reset must not destroy cumulative career stats.
          replace_once(
              "app/src/main/java/com/example/data/daos.kt",
              '''            injuryWeeksRemaining = 0,
            suspensionWeeksRemaining = 0,
            yellowCardsAccumulated = 0,
            careerGoals = 0
''',
              '''            injuryWeeksRemaining = 0,
            suspensionWeeksRemaining = 0,
            yellowCardsAccumulated = 0,
            gols = 0,
            assistencias = 0,
            partidasDisputadas = 0,
            minutosJogados = 0,
            mediaNotas = 0.0,
            evolucaoMensal = 0.0
'''
          )

          # Auto-simulated user fixture: finalize + player stats once from persisted source of truth.
          replace_once(
              "app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt",
              '''        repo.withTransaction {
            repo.updateFixture(updatedFixture)
            processMatchEventsAndStats(updatedFixture, matchEvents)
        }
        return updatedFixture
''',
              '''        repo.withTransaction {
            val persistedFixture = repo.getFixture(updatedFixture.id)
            if (persistedFixture?.isPlayed != true) {
                repo.updateFixture(updatedFixture)
                processMatchEventsAndStats(updatedFixture, matchEvents)
            }
        }
        return updatedFixture
'''
          )

          # Live fixture: same idempotent persisted guard.
          replace_once(
              "app/src/main/java/com/example/ui/viewmodel/GameViewModelMatch.kt",
              '''            repo.withTransaction {
                repo.updateFixture(updatedFixture)
                processMatchEventsAndStats(updatedFixture, currentMatchEvents)
            }
''',
              '''            repo.withTransaction {
                val persistedFixture = repo.getFixture(updatedFixture.id)
                if (persistedFixture?.isPlayed != true) {
                    repo.updateFixture(updatedFixture)
                    processMatchEventsAndStats(updatedFixture, currentMatchEvents)
                }
            }
'''
          )

          # Maintain cumulative + seasonal player counters together.
          replace_once(
              "app/src/main/java/com/example/ui/viewmodel/GameViewModelMatch.kt",
              '''        var goals = p.careerGoals
        var yellow = p.yellowCardsAccumulated
''',
              '''        var careerGoals = p.careerGoals
        var seasonGoals = p.gols
        var yellow = p.yellowCardsAccumulated
'''
          )
          replace_once(
              "app/src/main/java/com/example/ui/viewmodel/GameViewModelMatch.kt",
              '''                "GOAL" -> if (ev.scorerId == pid) goals += 1
''',
              '''                "GOAL" -> if (ev.scorerId == pid) {
                    careerGoals += 1
                    seasonGoals += 1
                }
'''
          )
          replace_once(
              "app/src/main/java/com/example/ui/viewmodel/GameViewModelMatch.kt",
              '''        playersToUpdate.add(
            p.copy(
                careerGoals = goals,
                careerApps = p.careerApps + if (pid in appearancePlayerIds) 1 else 0,
                yellowCardsAccumulated = yellow,
                suspensionWeeksRemaining = isSuspended,
                injuryWeeksRemaining = injury
            )
        )
''',
              '''        val appeared = pid in appearancePlayerIds
        playersToUpdate.add(
            p.copy(
                careerGoals = careerGoals,
                gols = seasonGoals,
                careerApps = p.careerApps + if (appeared) 1 else 0,
                partidasDisputadas = p.partidasDisputadas + if (appeared) 1 else 0,
                yellowCardsAccumulated = yellow,
                suspensionWeeksRemaining = isSuspended,
                injuryWeeksRemaining = injury
            )
        )
'''
          )

          # Editor closes only after player + affected club strength commit.
          replace_once(
              "app/src/main/java/com/example/ui/screens/EditorScreen.kt",
              '''            onSave = { updatedPlayer ->
                viewModel.savePlayerFromEditor(updatedPlayer)
                editingPlayer = null
            }
''',
              '''            onSave = { updatedPlayer ->
                viewModel.savePlayerFromEditor(updatedPlayer) { saved ->
                    if (saved) editingPlayer = null
                }
            }
'''
          )

          # Real new-career instrumentation.
          replace_once(
              "app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt",
              '''        val generation = session.generation
        val season = 2026

        // 1. Preparação dos dados de times em memória do zero
        val newTeamsToSeed = mutableListOf<Team>()
''',
              '''        val generation = session.generation
        val season = 2026
        val totalStartedAtNs = System.nanoTime()

        // 1. Preparação dos dados de times em memória do zero
        val clubSetupStartedAtNs = System.nanoTime()
        val newTeamsToSeed = mutableListOf<Team>()
'''
          )
          replace_once(
              "app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt",
              '''        val dbTeams = newTeamsToSeed

        // 2. Geração limpa de jogadores para todos os times
        val allPlayersToSave = mutableListOf<Player>()
''',
              '''        val dbTeams = newTeamsToSeed
        val clubSetupMs = (System.nanoTime() - clubSetupStartedAtNs) / 1_000_000L

        // 2. Geração limpa de jogadores para todos os times
        val rosterMaterializationStartedAtNs = System.nanoTime()
        val allPlayersToSave = mutableListOf<Player>()
'''
          )
          replace_once(
              "app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt",
              '''            allPlayersToSave.addAll(roster)
        }

        // 3. Cálculo do calendário em memória ANTES da transação do banco
        val allGeneratedFixtures = generateCalendarUseCase.generateSeasonFixtures(season, dbTeams, teamId, activeCountry)
''',
              '''            allPlayersToSave.addAll(roster)
        }
        val rosterMaterializationMs = (System.nanoTime() - rosterMaterializationStartedAtNs) / 1_000_000L

        // 3. Cálculo do calendário em memória ANTES da transação do banco
        val competitionCalendarStartedAtNs = System.nanoTime()
        val allGeneratedFixtures = generateCalendarUseCase.generateSeasonFixtures(season, dbTeams, teamId, activeCountry)
        val competitionCalendarMs = (System.nanoTime() - competitionCalendarStartedAtNs) / 1_000_000L
'''
          )
          replace_once(
              "app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt",
              '''        // 5. Transação no banco capturado limpando TODAS as tabelas sem exceção
        targetRepo.withTransaction {
            if (generation != sessionGeneration.get()) {
                throw kotlinx.coroutines.CancellationException("Sessão de Novo Jogo mudou antes da limpeza.")
            }
            targetRepo.deleteSave()
''',
              '''        // 5. Transação no banco capturado limpando TODAS as tabelas sem exceção
        var databaseBootstrapMs = 0L
        var persistenceMs = 0L
        targetRepo.withTransaction {
            if (generation != sessionGeneration.get()) {
                throw kotlinx.coroutines.CancellationException("Sessão de Novo Jogo mudou antes da limpeza.")
            }
            val databaseBootstrapStartedAtNs = System.nanoTime()
            targetRepo.deleteSave()
'''
          )
          replace_once(
              "app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt",
              '''            targetRepo.deleteLoans()
            targetRepo.deleteGlobalStandings()

            targetRepo.saveTeams(dbTeams)
''',
              '''            targetRepo.deleteLoans()
            targetRepo.deleteGlobalStandings()
            databaseBootstrapMs = (System.nanoTime() - databaseBootstrapStartedAtNs) / 1_000_000L

            val persistenceStartedAtNs = System.nanoTime()
            targetRepo.saveTeams(dbTeams)
'''
          )
          replace_once(
              "app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt",
              '''            targetRepo.saveFixtures(allGeneratedFixtures)
            targetRepo.saveGameSave(save)
        }
''',
              '''            targetRepo.saveFixtures(allGeneratedFixtures)
            targetRepo.saveGameSave(save)
            persistenceMs = (System.nanoTime() - persistenceStartedAtNs) / 1_000_000L
        }
'''
          )
          replace_once(
              "app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt",
              '''        saveSlots.value = preferencesRepo.loadSaveSlots()
    }

    fun startNewGame(selectedTeamId: Long, coachName: String = "Técnico") {
''',
              '''        saveSlots.value = preferencesRepo.loadSaveSlots()

        val totalMs = (System.nanoTime() - totalStartedAtNs) / 1_000_000L
        val performanceSnapshot = CareerCreationPerformanceSnapshot(
            databaseBootstrapMs = databaseBootstrapMs,
            rosterMaterializationMs = rosterMaterializationMs,
            clubSetupMs = clubSetupMs,
            competitionCalendarMs = competitionCalendarMs,
            persistenceMs = persistenceMs,
            totalMs = totalMs,
            teamCount = dbTeams.size,
            playerCount = allPlayersToSave.size,
            fixtureCount = allGeneratedFixtures.size
        )
        CareerCreationPerformanceMonitor.record(performanceSnapshot)
        Log.i("CareerCreationPerformance", performanceSnapshot.toString())
    }

    fun startNewGame(selectedTeamId: Long, coachName: String = "Técnico") {
'''
          )

      - name: Commit patched runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/data/repository.kt \
                  app/src/main/java/com/example/data/daos.kt \
                  app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt \
                  app/src/main/java/com/example/ui/viewmodel/GameViewModelMatch.kt \
                  app/src/main/java/com/example/ui/screens/EditorScreen.kt
          git diff --cached --check
          git commit -m "fix: make runtime persistence and stats deterministic"
          git push origin HEAD:agent/3.0.1-runtime-bugfixes
