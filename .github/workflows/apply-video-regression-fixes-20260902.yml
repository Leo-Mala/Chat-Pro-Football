name: Apply Video Regression Fixes 2026-09-02

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - 'tools/manual_test/apply_video_core_regressions_20260902.py'
      - 'tools/manual_test/apply_video_monthly_perf_20260902.py'
      - '.github/workflows/apply-video-regression-fixes-20260902.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-video-regression-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Setup validation services and debug keystore
        shell: bash
        run: |
          set -euo pipefail
          cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},
            "client": [{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],
            "configuration_version":"1"
          }
          GOOGLE_EOF
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US' >/dev/null 2>&1

      - name: Apply video-proven regression fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/manual_test/apply_video_core_regressions_20260902.py
          python3 -m py_compile tools/manual_test/apply_video_monthly_perf_20260902.py
          python3 tools/manual_test/apply_video_core_regressions_20260902.py
          python3 tools/manual_test/apply_video_monthly_perf_20260902.py
          git diff --check
          git diff --exit-code -- app/src/main/assets/club_crests
          ! grep -R 'simWeek de 45' app/src/main/java/com/example/ui/components/dashboard/DashboardTabContent.kt

      - name: Run video regression and preserved focused tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            -PexcludeStressTests=true \
            --tests com.example.usecase.SeasonSimulationStopsAtTargetSeasonRegressionTest \
            --tests com.example.ui.screens.SeasonWeekBoundsRegressionTest \
            --tests com.example.ui.viewmodel.EditorExistingCareerRosterRegressionTest \
            --tests com.example.data.MonthlyEvolutionStreamingValidationRegressionTest \
            --tests com.example.ui.viewmodel.ManualTestEditorAndMatchRegressionTest \
            --tests com.example.ui.viewmodel.ClubStrength99RosterConsistencyTest \
            --tests com.example.data.ManualStrengthPersistenceRegressionTest \
            --tests com.example.usecase.SeasonSimulationCompletionRegressionTest \
            --tests com.example.usecase.SeasonSimulationRegressionTest \
            --tests com.example.usecase.FullSeasonSimulationDoesNotHangRegressionTest \
            --tests com.example.usecase.MonthlyEvolutionWeekFourRegressionTest \
            --tests com.example.usecase.MonthlyEvolutionCompactPlanMemoryRegressionTest \
            --tests com.example.data.PlayerEvolutionMonthlyEngineRegressionTest \
            --tests com.example.data.MonthlyEvolutionHistoryBulkWriterTest \
            --tests com.example.InterruptedWeeklyCloseRecoveryTest \
            --tests com.example.Phase106LifecycleRaceRegressionTest \
            --tests com.example.usecase.MatchStatisticsIdempotencyTest \
            --stacktrace

      - name: Measure monthly prepare and commit stages
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            -PexcludeStressTests=true \
            --tests com.example.usecase.MonthlyPreparePerformanceBenchmarkTest \
            --tests com.example.usecase.MonthlyCommitPerformanceBenchmarkTest \
            --tests com.example.usecase.WeekEightClosePerformanceBenchmarkTest \
            --stacktrace

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Commit tested source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt \
            app/src/main/java/com/example/ui/viewmodel/GameViewModelEditor.kt \
            app/src/main/java/com/example/ui/components/dashboard/DashboardTabContent.kt \
            app/src/main/java/com/example/data/MonthlyEvolutionMaintenanceQueries.kt \
            app/src/main/java/com/example/usecase/PlayerEvolutionUseCase.kt \
            app/src/test/java/com/example/usecase/SeasonSimulationStopsAtTargetSeasonRegressionTest.kt \
            app/src/test/java/com/example/ui/screens/SeasonWeekBoundsRegressionTest.kt \
            app/src/test/java/com/example/ui/viewmodel/EditorExistingCareerRosterRegressionTest.kt \
            app/src/test/java/com/example/data/MonthlyEvolutionStreamingValidationRegressionTest.kt
          git diff --cached --quiet && { echo 'No source delta'; exit 0; }
          git commit -m 'fix: stop season simulation and remove monthly validation copy'
          git pull --ff-only origin fix/3.0.1-manual-test-bugs
          git push origin HEAD:fix/3.0.1-manual-test-bugs
