name: Phase 9.12 Roster Architecture Validation

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/src/main/java/com/example/data/daos.kt'
      - 'app/src/main/java/com/example/data/repository.kt'
      - 'app/src/main/java/com/example/usecase/ProcessTransfersUseCase.kt'
      - 'app/src/main/java/com/example/usecase/CpuSquadManagementUseCase.kt'
      - 'app/src/test/java/com/example/usecase/ProcessTransfersUseCaseTest.kt'
      - 'app/src/test/java/com/example/usecase/CpuSquadManagementUseCaseTest.kt'
      - 'app/src/test/java/com/example/Phase912*'
      - 'reports/phase_9_12_*'
      - '.github/workflows/phase-9-12-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-9-12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          else
            cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                "android_client_info": {"package_name": "com.aistudio.brasfutretro.djuxzt"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyDummyKeyForBuildOnly123456"}],
              "services": {"appinvite_service": {"status": 1}}
            }],
            "configuration_version": "1"
          }
          GOOGLE_EOF
          fi

      - name: Setup Debug Keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Verify Room stays V21
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'version\s*=\s*21' app/src/main/java/com/example/data/database.kt
          test -f app/schemas/com.example.data.AppDatabase/21.json

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Run Phase 9.12 focused regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests com.example.usecase.ProcessTransfersUseCaseTest \
            --tests com.example.usecase.CpuSquadManagementUseCaseTest \
            --tests com.example.CareerFunctionalFlowTest \
            --stacktrace

      - name: Run non-stress regression suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest -PexcludeStressTests=true --stacktrace

      - name: Revalidate FC26 bulk invariants
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests com.example.data.Fc26FullSeedIntegrationTest \
            --tests com.example.data.Fc26SeedPlannerTest \
            --tests com.example.data.Fc26PlayerMapperTest \
            --tests com.example.data.StableRealPlayerIdentityTest \
            --tests com.example.data.EuropeanStableTeamIdentityTest \
            --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-9-12-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-phase-9-12
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
