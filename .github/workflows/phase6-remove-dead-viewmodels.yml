name: Phase6 guarded ViewModel cleanup

on:
  push:
    branches:
      - agent/v3-architecture-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout architecture branch
        uses: actions/checkout@v6
        with:
          ref: agent/v3-architecture-cleanup
          fetch-depth: 0

      - name: Apply guarded architecture replacements
        shell: python
        run: |
          from pathlib import Path
          import re

          legacy_imports = [
              "import com.example.ui.viewmodel.MatchViewModel\n",
              "import com.example.ui.viewmodel.TransfersViewModel\n",
              "import com.example.ui.viewmodel.SquadViewModel\n",
              "import com.example.ui.viewmodel.SaveManagerViewModel\n",
          ]

          game_screens = Path("app/src/main/java/com/example/ui/screens/GameScreens.kt")
          text = game_screens.read_text(encoding="utf-8")
          for line in legacy_imports:
              if text.count(line) != 1:
                  raise SystemExit(f"GameScreens expected one import {line.strip()}, found {text.count(line)}")
              text = text.replace(line, "")

          old_signature = (
              "fun GameApp(\n"
              "    viewModel: GameViewModel,\n"
              "    matchViewModel: MatchViewModel? = null,\n"
              "    transfersViewModel: TransfersViewModel? = null,\n"
              "    squadViewModel: SquadViewModel? = null,\n"
              "    saveManagerViewModel: SaveManagerViewModel? = null\n"
              ") {"
          )
          new_signature = "fun GameApp(\n    viewModel: GameViewModel\n) {"
          if text.count(old_signature) != 1:
              raise SystemExit(f"GameApp legacy signature count={text.count(old_signature)}")
          game_screens.write_text(text.replace(old_signature, new_signature), encoding="utf-8")

          squad = Path("app/src/main/java/com/example/ui/screens/SquadScreen.kt")
          text = squad.read_text(encoding="utf-8")
          for line in legacy_imports + ["import androidx.hilt.navigation.compose.hiltViewModel\n"]:
              if text.count(line) != 1:
                  raise SystemExit(f"SquadScreen expected one import {line.strip()}, found {text.count(line)}")
              text = text.replace(line, "")

          current_save_line = "    val currentSaveId by viewModel.currentSaveId.collectAsStateWithLifecycle()\n"
          if text.count(current_save_line) != 1:
              raise SystemExit(f"SquadScreen currentSaveId line count={text.count(current_save_line)}")
          text = text.replace(current_save_line, "")

          cards_start = '        if (activeSubTab == "CARDS_RETRO") {'
          professional_start = '        } else if (activeSubTab == "PROFISSIONAL") {'
          if text.count(cards_start) != 1 or text.count(professional_start) != 1:
              raise SystemExit(
                  f"Unexpected Cards Retrô markers: start={text.count(cards_start)}, end={text.count(professional_start)}"
              )
          start_index = text.index(cards_start)
          end_index = text.index(professional_start, start_index)
          replacement = (
              '        if (activeSubTab == "CARDS_RETRO") {\n'
              '            PlayerListScreen(viewModel = viewModel)\n'
              '        } else if (activeSubTab == "PROFISSIONAL") {'
          )
          text = text[:start_index] + replacement + text[end_index + len(professional_start):]
          squad.write_text(text, encoding="utf-8")

          for screen_name in [
              "FinancesScreen.kt",
              "HistoryScreen.kt",
              "CoachScreen.kt",
              "MatchSimulationScreen.kt",
          ]:
              path = Path("app/src/main/java/com/example/ui/screens") / screen_name
              contents = path.read_text(encoding="utf-8")
              for line in legacy_imports:
                  if contents.count(line) != 1:
                      raise SystemExit(f"{screen_name} expected one import {line.strip()}, found {contents.count(line)}")
                  contents = contents.replace(line, "")
              path.write_text(contents, encoding="utf-8")

          dead_files = [
              Path("app/src/main/java/com/example/ui/viewmodel/MatchViewModel.kt"),
              Path("app/src/main/java/com/example/ui/viewmodel/TransfersViewModel.kt"),
              Path("app/src/main/java/com/example/ui/viewmodel/SquadViewModel.kt"),
              Path("app/src/main/java/com/example/ui/viewmodel/SaveManagerViewModel.kt"),
              Path("app/src/main/java/com/example/ui/viewmodel/PlayerViewModel.kt"),
              Path("app/src/test/java/com/example/ui/viewmodel/MatchViewModelTest.kt"),
          ]
          for path in dead_files:
              if not path.exists():
                  raise SystemExit(f"Expected legacy file missing: {path}")
              path.unlink()

          forbidden = [
              "MatchViewModel",
              "TransfersViewModel",
              "SquadViewModel",
              "SaveManagerViewModel",
              "PlayerViewModel",
              "PlayerListUiState",
              "LiveMatchEvent",
              "MatchStats",
          ]
          roots = [Path("app/src/main/java"), Path("app/src/test/java")]
          offenders = []
          for root in roots:
              for path in root.rglob("*.kt"):
                  contents = path.read_text(encoding="utf-8")
                  for token in forbidden:
                      if re.search(rf"\b{re.escape(token)}\b", contents):
                          offenders.append(f"{path}: {token}")
          if offenders:
              raise SystemExit("Legacy references remain:\n" + "\n".join(offenders))

      - name: Remove bootstrap workflow and commit cleanup
        run: |
          rm .github/workflows/phase6-remove-dead-viewmodels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove duplicate legacy ViewModels [phase6-cleanup]"
          git push origin HEAD:agent/v3-architecture-cleanup
