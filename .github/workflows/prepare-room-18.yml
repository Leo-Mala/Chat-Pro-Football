name: Prepare Room 18 Schema

on:
  push:
    branches:
      - agent/v3-room-migration-safety
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-room-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Room migration branch
        uses: actions/checkout@v6
        with:
          ref: agent/v3-room-migration-safety

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Align backup metadata with Room 18
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/example/ui/viewmodel/SaveManagerViewModel.kt')
          text = path.read_text()
          if text.count('databaseVersion: Int = 17') != 1:
              raise SystemExit('Expected exactly one SaveBackupData databaseVersion declaration at 17')
          if text.count('databaseVersion = 17') != 1:
              raise SystemExit('Expected exactly one export databaseVersion assignment at 17')
          text = text.replace('databaseVersion: Int = 17', 'databaseVersion: Int = 18')
          text = text.replace('databaseVersion = 17', 'databaseVersion = 18')
          path.write_text(text)
          PY

      - name: Setup google-services.json
        shell: bash
        run: |
          set -euo pipefail
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDummyKeyForBuildOnly123456" }
                ],
                "services": {
                  "appinvite_service": { "status": 1 }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Setup Debug Keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"
          cp debug.keystore ~/.android/debug.keystore

      - name: Generate Room 18 schema and run migration safety tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            --tests com.example.SaveSlotIsolationTest \
            --tests com.example.migrations.MigrationSafetyTest \
            --tests com.example.migrations.MigrationCompatibilityTest \
            --stacktrace
          test -f app/schemas/com.example.data.AppDatabase/18.json

      - name: Commit generated Room schema and backup metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/example/ui/viewmodel/SaveManagerViewModel.kt \
            app/schemas/com.example.data.AppDatabase/18.json
          if git diff --cached --quiet; then
            echo 'Room 18 schema and backup metadata already aligned.'
            exit 0
          fi
          git commit -m 'build(room): export schema 18 and align backup metadata'
          git push origin HEAD:agent/v3-room-migration-safety
