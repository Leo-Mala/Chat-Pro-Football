name: Apply interrupted week-close recovery

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/apply-interrupted-week-close-recovery.yml
      - tools/manual_test/apply_interrupted_week_close_recovery.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-interrupted-week-close-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply slot-safe recovery patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/manual_test/apply_interrupted_week_close_recovery.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/test/java/com/example/InterruptedWeeklyCloseRecoveryTest.kt')
          text = p.read_text(encoding='utf-8')
          old = '''    @After
              fun tearDown() = runBlocking {
                  runCatching { saveRepository.closeAllDatabases() }
                  application.deleteDatabase(SlotDatabaseFactory.databaseNameForSlot(slotId))
                  application.deleteDatabase("${SlotDatabaseFactory.databaseNameForSlot(slotId)}_backup")
              }
          '''
          # Keep JUnit lifecycle methods explicitly Unit. The generated expression-body version
          # inherits Boolean from deleteDatabase() and JUnit rejects the class before tests run.
          old = old.replace('              ', '')
          new = '''    @After
    fun tearDown() {
        runBlocking {
            runCatching { saveRepository.closeAllDatabases() }
            application.deleteDatabase(SlotDatabaseFactory.databaseNameForSlot(slotId))
            application.deleteDatabase("${SlotDatabaseFactory.databaseNameForSlot(slotId)}_backup")
        }
    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'tearDown lifecycle anchor count={text.count(old)}, expected=1')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Setup validation google-services.json
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF

      - name: Run recovery and weekly-close regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PexcludeStressTests=true \
            --tests com.example.InterruptedWeeklyCloseRecoveryTest \
            --tests com.example.WeeklyFinalizationAtomicityTest \
            --tests com.example.Phase106LifecycleRaceRegressionTest \
            --tests com.example.ui.viewmodel.LiveMatchPersistenceOrderingRegressionTest \
            --tests com.example.ui.viewmodel.LiveMatchSkipRegressionTest \
            --tests com.example.ui.viewmodel.PostGameReturnToCentralRegressionTest \
            --tests com.example.usecase.CpuSquadManagementUseCaseTest \
            --tests com.example.usecase.MonthlyEvolutionWeekFourRegressionTest \
            --tests com.example.data.PlayerEvolutionMonthlyEngineRegressionTest \
            --stacktrace

      - name: Commit tested production patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/3.0.1-manual-test-bugs
          test "$(git rev-parse origin/fix/3.0.1-manual-test-bugs)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt \
                  app/src/main/java/com/example/ui/viewmodel/GameViewModelMatch.kt \
                  app/src/main/java/com/example/ui/viewmodel/WeeklyCloseRecovery.kt \
                  app/src/test/java/com/example/InterruptedWeeklyCloseRecoveryTest.kt
          git diff --cached --check
          git commit -m 'fix: recover interrupted weekly close exactly once'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
