name: Temporary Wikimedia club supplement export

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs

permissions:
  contents: read

concurrency:
  group: temporary-wikimedia-club-supplement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Enumerate country club categories and validate Wikidata identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, time, urllib.parse, urllib.request
          from collections import deque
          from pathlib import Path

          TARGETS = {
            'Tchéquia': ('Q213', 'Category:Football clubs in the Czech Republic'),
            'Colômbia': ('Q739', 'Category:Football clubs in Colombia'),
            'México': ('Q96', 'Category:Football clubs in Mexico'),
            'Costa Rica': ('Q800', 'Category:Football clubs in Costa Rica'),
            'Guatemala': ('Q774', 'Category:Football clubs in Guatemala'),
            'El Salvador': ('Q792', 'Category:Football clubs in El Salvador'),
            'Jamaica': ('Q766', 'Category:Football clubs in Jamaica'),
            'Arábia Saudita': ('Q851', 'Category:Football clubs in Saudi Arabia'),
            'Irã': ('Q794', 'Category:Football clubs in Iran'),
          }
          UA='Chat-Pro-Football/3.0.1 real-club identity audit (GitHub Actions; Wikimedia read-only)'

          def api(host, params, timeout=60):
            url=host+'?'+urllib.parse.urlencode(params)
            req=urllib.request.Request(url, headers={'User-Agent':UA})
            for attempt in range(5):
              try:
                with urllib.request.urlopen(req, timeout=timeout) as r: return json.load(r)
              except Exception:
                if attempt==4: raise
                time.sleep(1.5*(attempt+1))

          WIKI='https://en.wikipedia.org/w/api.php'
          WD='https://www.wikidata.org/w/api.php'

          def category_pages(root, max_depth=3):
            pages=set(); seen=set(); q=deque([(root,0)])
            while q:
              cat,depth=q.popleft()
              if cat in seen: continue
              seen.add(cat)
              cont=None
              while True:
                params={'action':'query','format':'json','list':'categorymembers','cmtitle':cat,'cmlimit':'500','cmtype':'page|subcat','cmnamespace':'0|14'}
                if cont: params['cmcontinue']=cont
                data=api(WIKI,params)
                for m in data['query']['categorymembers']:
                  if m['ns']==0: pages.add(m['title'])
                  elif m['ns']==14 and depth<max_depth: q.append((m['title'],depth+1))
                cont=data.get('continue',{}).get('cmcontinue')
                if not cont: break
            return sorted(pages)

          def chunks(xs,n=40):
            for i in range(0,len(xs),n): yield xs[i:i+n]

          out=[]
          for country,(country_qid,rootcat) in TARGETS.items():
            titles=category_pages(rootcat)
            title_to_qid={}
            for batch in chunks(titles,40):
              data=api(WIKI,{'action':'query','format':'json','prop':'pageprops','ppprop':'wikibase_item','redirects':'1','titles':'|'.join(batch)})
              for page in data.get('query',{}).get('pages',{}).values():
                qid=page.get('pageprops',{}).get('wikibase_item')
                if qid: title_to_qid[page['title']]=qid
            qids=sorted(set(title_to_qid.values()))
            entities={}
            for batch in chunks(qids,40):
              data=api(WD,{'action':'wbgetentities','format':'json','ids':'|'.join(batch),'props':'labels|claims','languages':'en|es|cs|ar|fa'})
              entities.update(data.get('entities',{}))
            accepted_by_qid={}
            for title,qid in sorted(title_to_qid.items()):
              ent=entities.get(qid,{})
              claims=ent.get('claims',{})
              def item_values(pid):
                vals=[]
                for c in claims.get(pid,[]):
                  v=c.get('mainsnak',{}).get('datavalue',{}).get('value')
                  if isinstance(v,dict) and 'id' in v: vals.append(v['id'])
                return vals
              countries=item_values('P17')
              instances=item_values('P31')
              logos=[]
              for c in claims.get('P154',[]):
                v=c.get('mainsnak',{}).get('datavalue',{}).get('value')
                if isinstance(v,str) and v.strip(): logos.append(v.strip())
              if country_qid not in countries or 'Q476028' not in instances or not logos: continue
              labels=ent.get('labels',{})
              name=(labels.get('en') or labels.get('es') or labels.get('cs') or labels.get('ar') or labels.get('fa') or {}).get('value') or title
              bad=(' women','women\'s',' femenino',' femenina',' u19',' u-19',' u20',' u-20',' youth',' academy')
              folded=' '+name.casefold()
              if any(x in folded for x in bad): continue
              accepted_by_qid.setdefault(qid,{
                'country':country,'wikidataId':qid,'realClubName':name,'wikipediaTitle':title,
                'logoFile':sorted(set(logos),key=str.casefold)[0],
                'commonsSourceUrl':'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+urllib.parse.quote(sorted(set(logos),key=str.casefold)[0]),
              })
            rows=sorted(accepted_by_qid.values(),key=lambda r:(r['realClubName'].casefold(),r['wikidataId']))
            out.extend(rows)
            print(country,'category_pages=',len(titles),'wikidata_items=',len(qids),'accepted=',len(rows))
          out.sort(key=lambda r:(r['country'],r['realClubName'].casefold(),r['wikidataId']))
          Path('wikimedia_club_supplement.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('SOURCE.txt').write_text('English Wikipedia category enumeration + Wikidata exact P17/P31/P154 validation\n',encoding='utf-8')
          print('TOTAL_ACCEPTED',len(out))
          print('SHA256',hashlib.sha256(Path('wikimedia_club_supplement.json').read_bytes()).hexdigest())
          PY
          sha256sum wikimedia_club_supplement.json SOURCE.txt > SHA256SUMS.txt

      - name: Upload read-only supplement index
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wikimedia-club-supplement-${{ github.sha }}
          path: |
            wikimedia_club_supplement.json
            SOURCE.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
