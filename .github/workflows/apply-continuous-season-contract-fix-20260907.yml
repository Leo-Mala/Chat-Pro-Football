name: Apply continuous season contract fix 20260907

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/apply-continuous-season-contract-fix-20260907.yml

permissions:
  contents: write

concurrency:
  group: apply-continuous-season-contract-fix-20260907-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact requested baseline
        shell: bash
        env:
          EXPECTED_BASE: 91a1e1dace66b90b6104376229fabb96f4c7135a
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git diff --name-only "$EXPECTED_BASE"...HEAD)" = ".github/workflows/apply-continuous-season-contract-fix-20260907.yml"

      - name: Apply minimal regression correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: anchor count {count}, expected {expected}: {old[:180]!r}")
              p.write_text(text.replace(old, new, expected), encoding="utf-8")

          repo = "app/src/main/java/com/example/data/repository.kt"
          replace_exact(
              repo,
              '''    /**
     * Read-only fail-safe used by full-season simulation. The controlled club must never lose
     * expiring owned players merely because automatic simulation crossed a weekly contract tick.
     * Manual week progression keeps the existing expiry rule unchanged.
     */
    suspend fun getControlledRosterExpiringContractCount(teamId: Long): Int {
        if (teamId <= 0L) return 0
        return db.openHelper.readableDatabase.query(
            """
            SELECT COUNT(*) AS expiringCount
            FROM players
            WHERE teamId = ?
              AND isOnLoan = 0
              AND contractDurationWeeks = 1
            """.trimIndent(),
            arrayOf<Any>(teamId)
        ).use { cursor ->
            check(cursor.moveToFirst())
            cursor.getInt(cursor.getColumnIndexOrThrow("expiringCount"))
        }
    }

''',
              ''
          )

          vm = "app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt"
          replace_exact(
              vm,
              '''internal fun shouldPauseSeasonSimulationForExpiringContracts(expiringContractCount: Int): Boolean =
    expiringContractCount > 0

''',
              ''
          )
          replace_exact(
              vm,
              '''internal fun seasonSimulationContractPauseMessage(expiringCount: Int): String {
    val label = if (expiringCount == 1) "contrato vence" else "contratos vencem"
    return "$expiringCount $label ao fim desta semana. Renove os contratos ou avance a semana manualmente."
}

''',
              ''
          )
          replace_exact(
              vm,
              '''                            // Never auto-expire the human manager's contracts. Pause before any
                            // fixture, finance or contract mutation for this week is committed.
                            val expiringControlledContracts =
                                repo.getControlledRosterExpiringContractCount(save.playerTeamId)
                            if (shouldPauseSeasonSimulationForExpiringContracts(expiringControlledContracts)) {
                                val pauseMessage = seasonSimulationContractPauseMessage(expiringControlledContracts)
                                val detail = "Temp. ${save.currentSeason} | Sem. $currentWeekNum | $pauseMessage"
                                _lastSimulationError.value = detail
                                _simulationCompetitionName.value = "Simulação pausada"
                                _simulationMatchInfo.value = pauseMessage
                                _simulationLogs.value = (listOf("Simulação pausada: $detail") + _simulationLogs.value).take(25)
                                break
                            }

''',
              ''
          )

          continuous_test = "app/src/test/java/com/example/ui/viewmodel/SeasonSimulationContinuousRegressionTest.kt"
          replace_exact(
              continuous_test,
              '''    @Test
    fun seasonSimulationPausesSafelyAndVisiblyForExpiringControlledContracts() {
        val source = File("src/main/java/com/example/ui/viewmodel/GameViewModel.kt").readText()
        assertTrue(source.contains("shouldPauseSeasonSimulationForExpiringContracts"))
        assertTrue(source.contains("getControlledRosterExpiringContractCount"))
        assertTrue(source.contains("seasonSimulationContractPauseMessage"))
        assertTrue(source.contains("_simulationCompetitionName.value = \\"Simulação pausada\\""))
        assertTrue(source.contains("_lastSimulationError.value = detail"))
        assertTrue(source.contains("listOf(\\"Simulação pausada: \\$detail\\")"))
    }
''',
              '''    @Test
    fun seasonSimulationDoesNotStopForExpiringControlledContracts() {
        val source = File("src/main/java/com/example/ui/viewmodel/GameViewModel.kt").readText()
        assertFalse(source.contains("shouldPauseSeasonSimulationForExpiringContracts"))
        assertFalse(source.contains("getControlledRosterExpiringContractCount"))
        assertFalse(source.contains("seasonSimulationContractPauseMessage"))
        assertTrue(source.contains("shouldPauseSeasonSimulationForIncompleteLineup"))
        assertTrue(source.contains("controlledRosterEligibleCount"))
    }
'''
          )

          roster_test = "app/src/test/java/com/example/ui/viewmodel/RosterCollapseAndAvailabilityRegressionTest.kt"
          replace_exact(
              roster_test,
              '''    @Test
    fun `season simulation contract guard is read only and ignores loaned expiry`() = runTest {
        val user = Team(
            id = 1L,
            name = "Usuário",
            city = "BH",
            state = "MG",
            division = 1,
            isPlayerControlled = true
        )
        val owner = Team(id = 2L, name = "Proprietário", city = "SP", state = "SP", division = 1)
        repository.saveTeams(listOf(user, owner))
        repository.savePlayers(
            listOf(
                Player(id = 101L, teamId = user.id, name = "Expira", age = 25, position = "ZAG", force = 80, contractDurationWeeks = 1),
                Player(id = 102L, teamId = user.id, name = "Seguro", age = 25, position = "MEI", force = 80, contractDurationWeeks = 2),
                Player(id = 103L, teamId = user.id, name = "Emprestado", age = 25, position = "ATA", force = 80, contractDurationWeeks = 1, isOnLoan = true, originalTeamId = owner.id)
            )
        )

        val before = repository.getPlayersByTeam(user.id).associateBy { it.id }
        val expiring = repository.getControlledRosterExpiringContractCount(user.id)

        assertEquals(1, expiring)
        assertTrue(shouldPauseSeasonSimulationForExpiringContracts(expiring))
        assertFalse(shouldPauseSeasonSimulationForExpiringContracts(0))
        assertEquals(before, repository.getPlayersByTeam(user.id).associateBy { it.id })
    }

''',
              ''
          )
          PY

      - name: Verify correction scope
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "shouldPauseSeasonSimulationForExpiringContracts" app/src/main app/src/test
          ! grep -R "getControlledRosterExpiringContractCount" app/src/main app/src/test
          ! grep -R "seasonSimulationContractPauseMessage" app/src/main app/src/test
          grep -q "shouldPauseSeasonSimulationForIncompleteLineup" app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          grep -q "contractPresentation(player.contractDurationWeeks)" app/src/main/java/com/example/ui/screens/PlayerListScreen.kt
          grep -q "ÚLTIMO ANO" app/src/main/java/com/example/ui/screens/ContractStatusPresentation.kt
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Prepare Android validation file
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF

      - name: Run focused continuity and contract presentation regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.example.ui.viewmodel.SeasonSimulationContinuousRegressionTest' \
            --tests 'com.example.ui.viewmodel.RosterCollapseAndAvailabilityRegressionTest' \
            --tests 'com.example.ui.screens.ContractPresentationTest'

      - name: Commit exact tested correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/google-services.json
          git rm .github/workflows/apply-continuous-season-contract-fix-20260907.yml
          git diff --check
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/apply-continuous-season-contract-fix-20260907.yml' \
            'app/src/main/java/com/example/data/repository.kt' \
            'app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt' \
            'app/src/test/java/com/example/ui/viewmodel/RosterCollapseAndAvailabilityRegressionTest.kt' \
            'app/src/test/java/com/example/ui/viewmodel/SeasonSimulationContinuousRegressionTest.kt' | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/repository.kt \
                  app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt \
                  app/src/test/java/com/example/ui/viewmodel/RosterCollapseAndAvailabilityRegressionTest.kt \
                  app/src/test/java/com/example/ui/viewmodel/SeasonSimulationContinuousRegressionTest.kt
          git commit -m 'fix: keep season simulation continuous across contract expiry'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
