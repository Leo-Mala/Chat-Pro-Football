name: Apply continuous season contract fix 20260907

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/apply-continuous-season-contract-fix-20260907.yml

permissions:
  contents: write

concurrency:
  group: apply-continuous-season-contract-fix-20260907-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3

      - name: Verify exact requested baseline
        shell: bash
        env:
          EXPECTED_BASE: 91a1e1dace66b90b6104376229fabb96f4c7135a
        run: |
          set -euo pipefail
          git cat-file -e "$EXPECTED_BASE^{commit}"
          test "$(git diff --name-only "$EXPECTED_BASE"...HEAD)" = ".github/workflows/apply-continuous-season-contract-fix-20260907.yml"

      - name: Apply minimal regression correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def remove_between(path, start, end):
              text = read(path)
              if text.count(start) != 1:
                  raise SystemExit(f"{path}: start marker count={text.count(start)} marker={start!r}")
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              write(path, text[:start_index] + text[end_index:])

          def replace_once(path, old, new):
              text = read(path)
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: replacement anchor count={text.count(old)} anchor={old!r}")
              write(path, text.replace(old, new, 1))

          repo = "app/src/main/java/com/example/data/repository.kt"
          remove_between(
              repo,
              "    /**\n     * Read-only fail-safe used by full-season simulation.",
              "    suspend fun getFreeAgents(): List<Player>"
          )

          vm = "app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt"
          replace_once(
              vm,
              "internal fun shouldPauseSeasonSimulationForExpiringContracts(expiringContractCount: Int): Boolean =\n    expiringContractCount > 0\n\n",
              ""
          )
          remove_between(
              vm,
              "internal fun seasonSimulationContractPauseMessage(expiringCount: Int): String {",
              "internal fun seasonSimulationLineupPauseMessage(rosterSize: Int, eligibleCount: Int): String ="
          )
          remove_between(
              vm,
              "                            // Never auto-expire the human manager's contracts. Pause before any\n",
              "                            // Fail closed instead of silently playing with fewer than eleven\n"
          )

          continuous_test = "app/src/test/java/com/example/ui/viewmodel/SeasonSimulationContinuousRegressionTest.kt"
          old_start = "    @Test\n    fun seasonSimulationPausesSafelyAndVisiblyForExpiringControlledContracts() {"
          next_test = "    @Test\n    fun simulationFailureRemainsDiagnosableAfterReturningToIdle() {"
          new_first_test = "\n".join([
              "    @Test",
              "    fun seasonSimulationDoesNotStopForExpiringControlledContracts() {",
              "        val source = File(\"src/main/java/com/example/ui/viewmodel/GameViewModel.kt\").readText()",
              "        assertFalse(source.contains(\"shouldPauseSeasonSimulationForExpiringContracts\"))",
              "        assertFalse(source.contains(\"getControlledRosterExpiringContractCount\"))",
              "        assertFalse(source.contains(\"seasonSimulationContractPauseMessage\"))",
              "        assertTrue(source.contains(\"shouldPauseSeasonSimulationForIncompleteLineup\"))",
              "        assertTrue(source.contains(\"controlledRosterEligibleCount\"))",
              "    }",
              "",
          ])
          text = read(continuous_test)
          if text.count(old_start) != 1 or text.count(next_test) != 1:
              raise SystemExit("continuous simulation regression test anchors changed")
          a = text.index(old_start)
          b = text.index(next_test, a)
          write(continuous_test, text[:a] + new_first_test + text[b:])

          roster_test = "app/src/test/java/com/example/ui/viewmodel/RosterCollapseAndAvailabilityRegressionTest.kt"
          remove_between(
              roster_test,
              "    @Test\n    fun `season simulation contract guard is read only and ignores loaned expiry`() = runTest {",
              "    @Test\n    fun `season simulation pauses instead of playing with five eligible athletes`() {"
          )
          PY

      - name: Verify correction scope
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "shouldPauseSeasonSimulationForExpiringContracts" app/src/main app/src/test
          ! grep -R "getControlledRosterExpiringContractCount" app/src/main app/src/test
          ! grep -R "seasonSimulationContractPauseMessage" app/src/main app/src/test
          grep -q "shouldPauseSeasonSimulationForIncompleteLineup" app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          grep -q "controlledRosterEligibleCount" app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          grep -q "contractPresentation(player.contractDurationWeeks)" app/src/main/java/com/example/ui/screens/PlayerListScreen.kt
          grep -q "ÚLTIMO ANO" app/src/main/java/com/example/ui/screens/ContractStatusPresentation.kt
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Prepare Android validation file
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF

      - name: Run focused continuity and contract presentation regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.example.ui.viewmodel.SeasonSimulationContinuousRegressionTest' \
            --tests 'com.example.ui.viewmodel.RosterCollapseAndAvailabilityRegressionTest' \
            --tests 'com.example.ui.screens.ContractPresentationTest'

      - name: Commit exact tested correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/google-services.json
          git rm .github/workflows/apply-continuous-season-contract-fix-20260907.yml
          git diff --check
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/apply-continuous-season-contract-fix-20260907.yml' \
            'app/src/main/java/com/example/data/repository.kt' \
            'app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt' \
            'app/src/test/java/com/example/ui/viewmodel/RosterCollapseAndAvailabilityRegressionTest.kt' \
            'app/src/test/java/com/example/ui/viewmodel/SeasonSimulationContinuousRegressionTest.kt' | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/repository.kt \
                  app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt \
                  app/src/test/java/com/example/ui/viewmodel/RosterCollapseAndAvailabilityRegressionTest.kt \
                  app/src/test/java/com/example/ui/viewmodel/SeasonSimulationContinuousRegressionTest.kt
          git commit -m 'fix: keep season simulation continuous across contract expiry'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
