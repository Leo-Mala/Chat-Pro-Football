name: FC26 Bulk Player Import

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/src/main/java/com/example/data/Fc26SeedPlanner.kt'
      - 'app/src/main/java/com/example/data/Fc26PlayerMetadata.kt'
      - 'app/src/main/java/com/example/usecase/CpuSquadManagementUseCase.kt'
      - 'app/src/main/java/com/example/usecase/ProcessTransfersUseCase.kt'
      - 'app/src/test/java/com/example/Fc26WeeklyRuntimeDiagnosticTest.kt'
      - 'app/src/test/java/com/example/data/Fc26*'
      - 'reports/fc26_*'
      - '.github/workflows/fc26-bulk-player-import.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fc26-bulk-player-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enforce bulk-import scope immutability
        shell: bash
        run: |
          set -euo pipefail
          BASE=d5b50f8ef3b42522a39a7c2a183b7e6a1bf184b3
          git cat-file -e "$BASE^{commit}"
          changed="$(git diff --name-only "$BASE"...HEAD)"
          echo "$changed"
          protected='^(app/src/main/java/com/example/data/(Fc26PlayerMapper\.kt|Fc26DatasetModels\.kt|PlayerAttributes\.kt|entities\.kt|daos\.kt|database\.kt)|app/src/main/java/com/example/data/migrations/|app/src/main/java/com/example/data/StableTeamIdentityRegistry\.kt)'
          if echo "$changed" | grep -E "$protected"; then
            echo "Bulk import changed an immutable player/Room/identity surface."
            exit 1
          fi

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          else
            cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},
            "client": [{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],
            "configuration_version":"1"
          }
          GOOGLE_EOF
          fi

      - name: Measure fresh-career player counts and weekly hot paths
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            --tests com.example.Fc26WeeklyRuntimeDiagnosticTest \
            --stacktrace

      - name: Upload weekly runtime diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc26-weekly-runtime-diagnostic
          path: reports/fc26_weekly_runtime_diagnostic.json
          if-no-files-found: error

      - name: Upload diagnostic test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fc26-weekly-runtime-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
