name: FC26 Bulk Player Import

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/src/main/java/com/example/data/Fc26LoanResolver.kt'
      - 'app/src/main/java/com/example/data/Fc26SeedPlanner.kt'
      - 'app/src/main/java/com/example/data/Fc26PlayerMetadata.kt'
      - 'app/src/main/java/com/example/usecase/CpuSquadManagementUseCase.kt'
      - 'app/src/test/java/com/example/data/Fc26*'
      - 'reports/fc26_*'
      - 'reports/phase_10_4_fc26_safe_loans.md'
      - '.github/workflows/fc26-bulk-player-import.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fc26-bulk-player-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    # Do not allocate a runner for draft PRs. Android CI owns the full build,
    # non-stress regression suite and generic Room artifact for normal PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enforce bulk-import scope immutability
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            git fetch origin main --no-tags
            BASE="$(git merge-base origin/main HEAD)"
          fi
          git cat-file -e "$BASE^{commit}"
          changed="$(git diff --name-only "$BASE"...HEAD)"
          echo "$changed"
          protected='^(app/src/main/java/com/example/data/(Fc26PlayerMapper\.kt|Fc26DatasetModels\.kt|PlayerAttributes\.kt|entities\.kt|daos\.kt|database\.kt)|app/src/main/java/com/example/data/migrations/|app/src/main/java/com/example/data/StableTeamIdentityRegistry\.kt)'
          if echo "$changed" | grep -E "$protected"; then
            echo "Bulk import changed an immutable player/Room/identity surface."
            exit 1
          fi

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          else
            cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {"project_number": "000000000000", "project_id": "ci-local", "storage_bucket": "ci-local.appspot.com"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "com.example"}}, "api_key": [{"current_key": "ci-local-key"}]}],
            "configuration_version": "1"
          }
          GOOGLE_EOF
          fi

      - name: Validate full 18,405-player bulk import explicitly
        run: |
          ./gradlew testDebugUnitTest \
            --tests com.example.data.Fc26SeedPlannerTest \
            --tests com.example.data.Fc26FullSeedIntegrationTest \
            --tests com.example.data.EuropeanNewSaveSeedCoordinatorTest \
            --no-daemon --stacktrace

      - name: Stamp Phase 10.4 audit head
        env:
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("reports/phase_10_4_fc26_loans_audit.json")
          if not path.is_file():
              raise SystemExit(f"Missing {path}")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["auditHead"] = os.environ["AUDIT_HEAD_SHA"]
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Verify current Room schema
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('app/src/main/java/com/example/data/database.kt').read_text(encoding='utf-8')
          match = re.search(r'version\s*=\s*(\d+)', text)
          if not match:
              raise SystemExit('Unable to detect Room database version')
          print(match.group(1))
          PY
          )"
          schema="app/schemas/com.example.data.AppDatabase/${version}.json"
          test -f "$schema"
          git ls-files --error-unmatch "$schema"
          echo "Room schema V${version} tracked: $schema"

      - name: Upload FC26 bulk reports
        uses: actions/upload-artifact@v7
        with:
          name: fc26-bulk-player-import-reports
          path: |
            reports/fc26_club_mapping_report.json
            reports/fc26_bulk_import_report.json
            reports/fc26_bulk_import_unresolved.json
            reports/phase_10_4_fc26_loans_audit.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fc26-bulk-player-import-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 1
