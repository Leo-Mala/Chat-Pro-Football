name: Repair Runtime Round Regression Assertions

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - '.github/workflows/hotfix-runtime-round-regression-assertions.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-runtime-round-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0

      - name: Bound roster regression to restart method
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/manual_test/apply_runtime_bugfix_round_20260831.py')
          text = path.read_text(encoding='utf-8')
          old = 'val block = repo.substringAfter("restartSeasonStateAtomically").substringBefore("suspend fun getActiveLoans")'
          new = 'val block = repo.substringAfter("restartSeasonStateAtomically").substringBefore("suspend fun saveTransaction")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one over-broad restart block selector, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile tools/manual_test/apply_runtime_bugfix_round_20260831.py
          git diff --check

      - name: Commit regression repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/manual_test/apply_runtime_bugfix_round_20260831.py
          git diff --cached --check
          git commit -m 'ci: scope restart roster regression to atomic reset method'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
