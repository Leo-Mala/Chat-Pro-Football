name: Career Functional Diagnostic

on:
  push:
    branches: [ "agent/v3-global-standings-qualification" ]
    paths:
      - '.github/workflows/career-functional-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: career-functional-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  career-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/v3-global-standings-qualification

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          else
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Run career functional flow only
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests com.example.CareerFunctionalFlowTest --stacktrace
