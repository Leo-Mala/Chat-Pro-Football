name: Sync Room Schema Artifact

on:
  push:
    branches: [ "agent/v3-global-standings-qualification" ]
    paths:
      - '.github/workflows/schema-sync.yml'

permissions:
  actions: read
  contents: write

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/v3-global-standings-qualification

      - name: Download and validate Room V19 schema
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/artifacts/9274279538/zip \
            > /tmp/room-schema.zip

          rm -rf /tmp/room-schema
          mkdir -p /tmp/room-schema
          unzip -q /tmp/room-schema.zip -d /tmp/room-schema
          test -f /tmp/room-schema/19.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          schema = Path('/tmp/room-schema/19.json')
          data = json.loads(schema.read_text())
          assert data['database']['version'] == 19
          assert data['database']['identityHash'] == '76d5b218c36051d8ee9cafd8c033ee0c'
          tables = {entity['tableName'] for entity in data['database']['entities']}
          assert 'global_league_standings' in tables
          print('Room V19 schema artifact validated.')
          PY

          mkdir -p app/schemas/com.example.data.AppDatabase
          cp /tmp/room-schema/19.json app/schemas/com.example.data.AppDatabase/19.json

      - name: Commit schema and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/schema-sync.yml
          git add app/schemas/com.example.data.AppDatabase/19.json
          git commit -m "chore: version Room schema 19"
          git push origin HEAD:agent/v3-global-standings-qualification
