name: Market value consistency fix

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .accelerated-realization/market-value-consistency.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-value-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Assert exact trigger source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "TRIGGER_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Setup validation google-services.json
        shell: bash
        run: |
          set -euo pipefail
          cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": { "package_name": "com.aistudio.brasfutretro.djuxzt" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF

      - name: Provision validation debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          test -s debug.keystore

      - name: Apply market value patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/manual_test/apply_market_value_consistency_20260903.py
          git diff --check
          if ! git diff --quiet -- app/src/main/assets/club_crests; then
            echo "Certified crest corpus was modified" >&2
            exit 1
          fi

      - name: Run new market regressions and preserved market suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PexcludeStressTests=true \
            --tests com.example.usecase.MarketPlayerValueConsistencyRegressionTest \
            --tests com.example.ui.components.transfers.MarketNegotiationRangeRegressionTest \
            --tests com.example.ui.components.transfers.EditorPlayerValueRangeRegressionTest \
            --tests com.example.usecase.MarketBuyNowPriceConsistencyRegressionTest \
            --tests com.example.ui.screens.MarketPriceFilterRegressionTest \
            --tests com.example.ui.screens.MarketPositionFilterRegressionTest \
            --tests com.example.usecase.MarketPurchaseImmediateRemovalTest \
            --tests com.example.usecase.MarketPurchasePersistenceTest \
            --tests com.example.usecase.MarketPurchaseRefreshTest \
            --tests com.example.usecase.PlayerSaleRegressionTest \
            --tests com.example.usecase.ProcessTransfersUseCaseTest \
            --tests com.example.ui.viewmodel.SeasonSimulationContractGuardRegressionTest \
            --tests com.example.data.EmergencyGoalkeeperSelectionRegressionTest \
            --tests com.example.data.MonthlyEvolutionDigestCompatibilityRegressionTest \
            --stacktrace

      - name: Run all non-stress unit regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest -PexcludeStressTests=true --stacktrace

      - name: Run monthly and finalization performance gates without cache
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest -PexcludeStressTests=true \
            --tests com.example.usecase.MonthlyPreparePerformanceBenchmarkTest \
            --tests com.example.usecase.MonthlyCommitPerformanceBenchmarkTest \
            --tests com.example.ui.viewmodel.LiveMatchFinalizationPerformanceBenchmarkTest \
            --no-build-cache --rerun-tasks --stacktrace

      - name: Assemble debug
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Recheck certified crest corpus is untouched
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet "$TRIGGER_HEAD" -- app/src/main/assets/club_crests; then
            echo "Certified crest corpus changed" >&2
            exit 1
          fi

      - name: Commit only after every gate is green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/example/data/entities.kt \
            app/src/main/java/com/example/usecase/TransferNegotiationUseCase.kt \
            app/src/main/java/com/example/ui/components/squad/SquadComponents.kt \
            app/src/main/java/com/example/ui/components/transfers/PurchaseNegotiationDialog.kt \
            app/src/main/java/com/example/ui/screens/TransfersScreen.kt \
            app/src/test/java/com/example/usecase/MarketPlayerValueConsistencyRegressionTest.kt \
            app/src/test/java/com/example/usecase/MarketBuyNowPriceConsistencyRegressionTest.kt \
            app/src/test/java/com/example/ui/components/transfers/MarketNegotiationRangeRegressionTest.kt \
            app/src/test/java/com/example/ui/components/transfers/EditorPlayerValueRangeRegressionTest.kt \
            app/src/test/java/com/example/ui/screens/MarketPriceFilterRegressionTest.kt \
            app/src/test/java/com/example/ui/screens/MarketPositionFilterRegressionTest.kt \
            docs/manual-test/MARKET_VALUE_DIAGNOSTIC_20260903.md
          git diff --cached --check
          git commit -m "fix: unify player value across market flows"
          git fetch origin fix/3.0.1-manual-test-bugs
          test "$(git rev-parse origin/fix/3.0.1-manual-test-bugs)" = "$TRIGGER_HEAD"
          git push origin HEAD:fix/3.0.1-manual-test-bugs
