name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "Using GOOGLE_SERVICES_JSON secret..."
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          else
            echo "Secret GOOGLE_SERVICES_JSON not provided. Creating fallback google-services.json for compilation..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly123456"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "status": 1
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          echo "google-services.json configured successfully."

      - name: Setup Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Create dummy .env.example
        run: touch .env.example

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Ensure Gradle Wrapper Integrity
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
