name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'app/**'
      - '!app/schemas/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ "main", "master" ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - '!app/schemas/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    # Enquanto o PR é draft nenhum runner é alocado. Ao ficar pronto, um único runner
    # executa build, regressão, migração/save e stress em sequência.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          else
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Setup Debug Keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug --stacktrace

      - name: Run core regression and migration-save safety
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest -PexcludeStressTests=true --stacktrace

      - name: Run 20 and 100 season stress tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests com.example.TwentySeasonStressTest \
            --tests com.example.OneHundredSeasonMatchByMatchStressTest \
            --stacktrace

      - name: Verify exported Room schema
        id: room_schema
        shell: bash
        run: |
          set -euo pipefail
          db_version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('app/src/main/java/com/example/data/database.kt').read_text()
          match = re.search(r'\bversion\s*=\s*(\d+)', source)
          if not match:
              raise SystemExit('Could not resolve Room database version')
          print(match.group(1))
          PY
          )
          schema_file="app/schemas/com.example.data.AppDatabase/${db_version}.json"
          test -f "$schema_file"
          echo "schema_file=$schema_file" >> "$GITHUB_OUTPUT"
          echo "Room schema validated: $schema_file"

      - name: Upload Room schema artifact
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-${{ github.sha }}
          path: ${{ steps.room_schema.outputs.schema_file }}
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
