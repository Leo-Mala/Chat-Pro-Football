name: Diagnostic exact 454345 persistent season error certification

on:
  push:
    branches:
      - diagnostics/persistent-season-error-7188b09d

permissions:
  contents: read

jobs:
  exact-nonstress-unit-certification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact diagnostic patch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 454345032f32fa4e14aba9fbb3ee08f0b10de5f0
          fetch-depth: 1

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "454345032f32fa4e14aba9fbb3ee08f0b10de5f0"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Complete non-stress unit regression suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest -PexcludeStressTests=true --stacktrace
