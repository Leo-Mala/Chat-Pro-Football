name: Temporary Harden Real Club Exact ID

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/tmp-harden-real-club-id.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Setup validation google-services.json
        shell: bash
        run: |
          printf '%s\n' '{"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}' > app/google-services.json
      - name: Patch exact legacy ID preservation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app/src/main/java/com/example/data/BrasfootRealClubIdentity.kt')
          s=p.read_text()
          s=s.replace('data class Replacement(\n        val country: String,', 'data class Replacement(\n        val legacyTeamId: Long,\n        val country: String,')
          s=s.replace('private var legacySlotByRealKey: Map<String, String> = emptyMap()\n    private var crestByRealKey', 'private var legacyTeamIdByRealKey: Map<String, Long> = emptyMap()\n    private var legacySlotByRealKey: Map<String, String> = emptyMap()\n    private var crestByRealKey')
          s=s.replace('val aliases = LinkedHashMap<String, String>(replacements.size)', 'val ids = LinkedHashMap<String, Long>(replacements.size)\n        val aliases = LinkedHashMap<String, String>(replacements.size)')
          s=s.replace('val legacyKeys = HashSet<String>(replacements.size)', 'val legacyIds = HashSet<Long>(replacements.size)\n        val legacyKeys = HashSet<String>(replacements.size)')
          s=s.replace('require(replacement.country.isNotBlank())', 'require(replacement.legacyTeamId > 0L) { "ID legado inválido para ${replacement.realClubName}." }\n            require(legacyIds.add(replacement.legacyTeamId)) { "ID legado reutilizado: ${replacement.legacyTeamId}" }\n            require(replacement.country.isNotBlank())')
          s=s.replace('aliases[realKey] = replacement.legacySlotName', 'ids[realKey] = replacement.legacyTeamId\n            aliases[realKey] = replacement.legacySlotName')
          s=s.replace('legacySlotByRealKey = aliases.toMap()', 'legacyTeamIdByRealKey = ids.toMap()\n            legacySlotByRealKey = aliases.toMap()')
          s=s.replace('fun legacySlotNameFor(country: String, realClubName: String): String? =', 'fun legacyTeamIdFor(country: String, realClubName: String): Long? =\n        synchronized(lock) { legacyTeamIdByRealKey[key(country, realClubName)] }\n\n    fun legacySlotNameFor(country: String, realClubName: String): String? =')
          s=s.replace('legacySlotByRealKey = emptyMap()\n            crestByRealKey', 'legacyTeamIdByRealKey = emptyMap()\n            legacySlotByRealKey = emptyMap()\n            crestByRealKey')
          p.write_text(s)

          p=Path('tools/club_realization/materialize_validated_patch_plan.py')
          s=p.read_text()
          s=s.replace('"        BrasfootRealClubIdentity.Replacement(" +\n            f"country =', '"        BrasfootRealClubIdentity.Replacement(" +\n            f"legacyTeamId = {row.legacy_team_id}L, country =')
          p.write_text(s)

          p=Path('app/src/main/java/com/example/data/GlobalFootballSystem.kt')
          s=p.read_text()
          old='''    fun getGlobalId(country: String, teamName: String): Long {\n        stableSeedIdFor(country, teamName)?.let { return it }'''
          new='''    fun getGlobalId(country: String, teamName: String): Long {\n        // Clubes reais que substituem fillers herdam o ID numérico EXATO do slot congelado.\n        // Isso é mais forte que depender apenas do nome/ordem do catálogo legado.\n        BrasfootRealClubIdentity.legacyTeamIdFor(country, teamName)?.let { return it }\n        stableSeedIdFor(country, teamName)?.let { return it }'''
          if old not in s: raise SystemExit('GlobalFootballSystem anchor not found')
          p.write_text(s.replace(old,new))

          p=Path('app/src/test/java/com/example/data/BrasfootRealClubIdentityTest.kt')
          s=p.read_text()
          s=s.replace('BrasfootRealClubIdentity.Replacement(\n                    country = "Brasil",', 'BrasfootRealClubIdentity.Replacement(\n                    legacyTeamId = 4242L,\n                    country = "Brasil",')
          s=s.replace('assertEquals(\n            "Belo Horizonte FC 2",', 'assertEquals(4242L, BrasfootRealClubIdentity.legacyTeamIdFor("Brasil", "Clube Real de Teste"))\n        assertEquals(\n            "Belo Horizonte FC 2",')
          s=s.replace('BrasfootRealClubIdentity.Replacement("Brasil", 2, "Slot A", "Real A", "a.png"),\n            BrasfootRealClubIdentity.Replacement("Brasil", 2, "Slot A", "Real B", "b.png")', 'BrasfootRealClubIdentity.Replacement(1001L, "Brasil", 2, "Slot A", "Real A", "a.png"),\n            BrasfootRealClubIdentity.Replacement(1002L, "Brasil", 2, "Slot A", "Real B", "b.png")')
          s=s.replace('BrasfootRealClubIdentity.Replacement("Brasil", 2, "Slot A", "Real A", "same.png"),\n            BrasfootRealClubIdentity.Replacement("Brasil", 2, "Slot B", "Real B", "SAME.PNG")', 'BrasfootRealClubIdentity.Replacement(1001L, "Brasil", 2, "Slot A", "Real A", "same.png"),\n            BrasfootRealClubIdentity.Replacement(1002L, "Brasil", 2, "Slot B", "Real B", "SAME.PNG")')
          insert='''\n\n        val duplicateId = listOf(\n            BrasfootRealClubIdentity.Replacement(1001L, "Brasil", 2, "Slot A", "Real A", "a.png"),\n            BrasfootRealClubIdentity.Replacement(1001L, "Brasil", 2, "Slot B", "Real B", "b.png")\n        )\n        assertThrows(IllegalArgumentException::class.java) {\n            BrasfootRealClubIdentity.install(duplicateId)\n        }'''
          s=s.replace('''        assertThrows(IllegalArgumentException::class.java) {\n            BrasfootRealClubIdentity.install(duplicateCrest)\n        }\n    }''','''        assertThrows(IllegalArgumentException::class.java) {\n            BrasfootRealClubIdentity.install(duplicateCrest)\n        }'''+insert+'''\n    }''')
          p.write_text(s)
          PY
      - name: Run focused regression and Kotlin compile
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PexcludeStressTests=true --tests com.example.data.BrasfootRealClubIdentityTest --tests com.example.data.BrasfootPatchCrestsTest kspDebugKotlin --stacktrace
      - name: Commit validated changes
        shell: bash
        run: |
          rm .github/workflows/tmp-harden-real-club-id.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/BrasfootRealClubIdentity.kt app/src/main/java/com/example/data/GlobalFootballSystem.kt app/src/test/java/com/example/data/BrasfootRealClubIdentityTest.kt tools/club_realization/materialize_validated_patch_plan.py .github/workflows/tmp-harden-real-club-id.yml
          git commit -m 'fix: preserve exact ids for realized clubs'
          git pull --rebase origin fix/3.0.1-manual-test-bugs
          git push origin HEAD:fix/3.0.1-manual-test-bugs
