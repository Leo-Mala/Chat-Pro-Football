name: Export current source final

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/export-current-source-final.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact current head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Record exact source head
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee SOURCE_HEAD.txt
      - name: Upload exact source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-pro-football-final-source-${{ github.sha }}
          path: |
            .
            !.git/
          hidden-files: true
          if-no-files-found: error
          retention-days: 2

