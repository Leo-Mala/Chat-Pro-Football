name: Apply season simulation memory fix

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/apply-season-simulation-memory-fix.yml
      - tools/manual_test/apply_season_simulation_memory_fix.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-season-simulation-memory-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply bounded monthly-plan heap patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/manual_test/apply_season_simulation_memory_fix.py
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Setup validation google-services.json
        shell: bash
        run: |
          set -euo pipefail
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF

      - name: Run season simulation memory and atomicity regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest -PexcludeStressTests=true \
            --tests com.example.usecase.MonthlyEvolutionCompactPlanMemoryRegressionTest \
            --tests com.example.PlayerEvolutionPlanAtomicityTest \
            --tests com.example.usecase.MonthlyEvolutionWeekFourRegressionTest \
            --tests com.example.data.PlayerEvolutionMonthlyEngineRegressionTest \
            --tests com.example.data.ManualStrengthPersistenceRegressionTest \
            --tests com.example.usecase.SeasonSimulationRegressionTest \
            --tests com.example.usecase.FullSeasonSimulationDoesNotHangRegressionTest \
            --tests com.example.InterruptedWeeklyCloseRecoveryTest \
            --tests com.example.WeeklyFinalizationAtomicityTest \
            --stacktrace

      - name: Run canonical week-close benchmark through real monthly plan
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest -PexcludeStressTests=true \
            --tests com.example.usecase.WeekEightClosePerformanceBenchmarkTest \
            --rerun-tasks \
            --stacktrace
          grep -Rho 'PERF_BASELINE_WEEK8[^<]*' app/build/test-results/testDebugUnitTest || true

      - name: Commit tested production patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/3.0.1-manual-test-bugs
          test "$(git rev-parse origin/fix/3.0.1-manual-test-bugs)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/MonthlyEvolutionMaintenanceQueries.kt \
                  app/src/main/java/com/example/usecase/PlayerEvolutionUseCase.kt \
                  app/src/test/java/com/example/usecase/MonthlyEvolutionCompactPlanMemoryRegressionTest.kt
          git diff --cached --check
          git commit -m 'perf: bound monthly evolution plan heap'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
