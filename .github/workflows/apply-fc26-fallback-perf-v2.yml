name: Apply FC26 Fallback Perf Patch V2

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/apply-fc26-fallback-perf-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/data/DefaultData.kt')
          t = p.read_text()
          sig = '    fun generateRosterForTeam(teamId: Long, teamRating: Int, teamName: String, country: String): List<Player> {\n'
          rep = '''    fun generateRosterForTeam(teamId: Long, teamRating: Int, teamName: String, country: String): List<Player> =\n        generateRosterForTeamInternal(teamId, teamRating, teamName, country, retainFc26FallbackOnly = false)\n\n    internal fun generateFc26FallbackRosterForTeam(\n        teamId: Long,\n        teamRating: Int,\n        teamName: String,\n        country: String\n    ): List<Player> =\n        generateRosterForTeamInternal(teamId, teamRating, teamName, country, retainFc26FallbackOnly = true)\n\n    private fun generateRosterForTeamInternal(\n        teamId: Long,\n        teamRating: Int,\n        teamName: String,\n        country: String,\n        retainFc26FallbackOnly: Boolean\n    ): List<Player> {\n'''
          if sig not in t: raise SystemExit('signature missing')
          t = t.replace(sig, rep, 1)
          old = '        val list = mutableListOf<Player>()\n        val rand = Random(teamId + teamRating * 17L)\n'
          if old not in t: raise SystemExit('list init missing')
          t = t.replace(old, '        val list = mutableListOf<Player>()\n        val generatedNames = mutableListOf<String>()\n        val rand = Random(teamId + teamRating * 17L)\n', 1)
          old = '            val matchedStar = realStars.find { it.position == pos && list.none { p -> p.name == it.name } }\n'
          if old not in t: raise SystemExit('star matcher missing')
          t = t.replace(old, '            val matchedStar = realStars.find { it.position == pos && generatedNames.none { generated -> generated == it.name } }\n', 1)
          old = '            val force = if (matchedStar != null) {\n'
          if old not in t: raise SystemExit('force marker missing')
          t = t.replace(old, '            generatedNames.add(name)\n\n            val force = if (matchedStar != null) {\n', 1)
          old = '            val playerId = if (teamId > 0) (teamId * 1000L + (i + 1L)) else 0L\n            val basePlayer = Player(\n'
          rep = '''            val playerId = if (teamId > 0) (teamId * 1000L + (i + 1L)) else 0L\n            val moral = rand.safeNextInt(75, 94)\n            val careerApps = rand.safeNextInt(0, 150)\n            val careerGoals = if (pos == "ATA" || pos == "MEI") rand.safeNextInt(0, 55) else rand.safeNextInt(0, 8)\n\n            // Consumimos acima exatamente os mesmos sorteios do elenco canônico. Para FC26, os\n            // dez índices que a política descartaria param aqui, antes das alocações/cálculos caros.\n            if (retainFc26FallbackOnly && !fc26FallbackRetainsCanonicalIndex(i)) continue\n\n            val basePlayer = Player(\n'''
          if old not in t: raise SystemExit('player marker missing')
          t = t.replace(old, rep, 1)
          for old_value, new_value in [
              ('                moral = rand.safeNextInt(75, 94),\n', '                moral = moral,\n'),
              ('                careerApps = rand.safeNextInt(0, 150),\n', '                careerApps = careerApps,\n'),
              ('                careerGoals = if (pos == "ATA" || pos == "MEI") rand.safeNextInt(0, 55) else rand.safeNextInt(0, 8),\n', '                careerGoals = careerGoals,\n')]:
              if old_value not in t: raise SystemExit(f'argument marker missing: {old_value.strip()}')
              t = t.replace(old_value, new_value, 1)
          marker = '    private data class StarTemplate(val name: String, val position: String, val force: Int, val age: Int)\n'
          helper = '''    private fun fc26FallbackRetainsCanonicalIndex(index: Int): Boolean = when (index) {\n        0, 1, 3, 4, 5, 6, 8, 9, 10, 12, 13, 14, 17, 18, 19, 20, 21, 22, 23, 24 -> true\n        else -> false\n    }\n\n'''
          if marker not in t: raise SystemExit('StarTemplate marker missing')
          p.write_text(t.replace(marker, helper + marker, 1))

          # Replace only the FC26 factories, scoped by their surrounding functions.
          p = Path('app/src/main/java/com/example/data/EuropeanNewSaveSeedCoordinator.kt')
          t = p.read_text()
          call = 'DefaultData.generateRosterForTeam(team.id, team.rating, team.name, team.country)'
          optimized = 'DefaultData.generateFc26FallbackRosterForTeam(team.id, team.rating, team.name, team.country)'
          def replace_scoped(text, start_marker, end_marker):
              start = text.find(start_marker)
              if start < 0: raise SystemExit(f'scope start missing: {start_marker}')
              end = text.find(end_marker, start)
              if end < 0: raise SystemExit(f'scope end missing: {end_marker}')
              segment = text[start:end]
              if call not in segment: raise SystemExit(f'FC26 call missing in {start_marker}')
              segment = segment.replace(call, optimized, 1)
              return text[:start] + segment + text[end:]
          t = replace_scoped(t, '    private fun buildPendingSeed', '    private fun withPreCareerOverrides')
          t = replace_scoped(t, '    internal fun prepareForFc26', '    internal fun prepareForDataset')
          p.write_text(t)

          p = Path('app/src/main/java/com/example/data/Fc26SeedPlanner.kt')
          t = p.read_text()
          old = '            DefaultData.generateRosterForTeam(team.id, team.rating, team.name, team.country)\n'
          if old not in t: raise SystemExit('prewarm factory missing')
          p.write_text(t.replace(old, '            DefaultData.generateFc26FallbackRosterForTeam(team.id, team.rating, team.name, team.country)\n', 1))

          p = Path('app/src/test/java/com/example/data/Fc26SeedPlannerTest.kt')
          t = p.read_text()
          marker = 'class Fc26SeedPlannerTest {\n'
          test = '''class Fc26SeedPlannerTest {\n    @Test fun `optimized FC26 fallback exactly matches canonical selection for production universe`() {\n        val teams = ProductionCareerSeedPrewarm.buildProductionTeamUniverse()\n        assertTrue(teams.size >= 1_000)\n        teams.forEach { team ->\n            val expected = Fc26FallbackRosterPolicy.select(\n                DefaultData.generateRosterForTeam(team.id, team.rating, team.name, team.country)\n            )\n            val optimized = DefaultData.generateFc26FallbackRosterForTeam(\n                team.id, team.rating, team.name, team.country\n            )\n            assertEquals("${team.country}/${team.name}", expected, optimized)\n        }\n    }\n\n'''
          if marker not in t: raise SystemExit('test marker missing')
          p.write_text(t.replace(marker, test, 1))
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/data/DefaultData.kt \
                  app/src/main/java/com/example/data/EuropeanNewSaveSeedCoordinator.kt \
                  app/src/main/java/com/example/data/Fc26SeedPlanner.kt \
                  app/src/test/java/com/example/data/Fc26SeedPlannerTest.kt
          git diff --cached --check
          git commit -m 'perf: avoid discarded FC26 fallback player materialization'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
