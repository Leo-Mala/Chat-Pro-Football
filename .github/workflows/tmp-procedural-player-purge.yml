name: Temporary Procedural Player Purge

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/tmp-procedural-player-purge.yml

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0

      - name: Apply procedural-only player patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tmp_procedural_purge.py
          python3 .github/scripts/tmp_procedural_cleanup.py
          python3 .github/scripts/tmp_procedural_cleanup_fix.py
          mapfile -t fc26_files < <(git ls-files | grep -i 'fc26' || true)
          if [ "${#fc26_files[@]}" -gt 0 ]; then
            git rm -f --ignore-unmatch -- "${fc26_files[@]}"
          fi
          git rm -f --ignore-unmatch app/src/main/java/com/example/data/EuropeanNewSaveSeedCoordinator.kt
          git rm -f --ignore-unmatch app/src/main/java/com/example/data/ProductionCareerSeedPrewarm.kt
          echo "Residual FC26 references in active runtime source:"
          git grep -n -i fc26 -- app/src/main/java || true

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Setup validation google-services.json
        shell: bash
        run: |
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"1234567890","project_id":"dummy-project","storage_bucket":"dummy-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.aistudio.brasfutretro.djuxzt"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildOnly123456"}],"services":{"appinvite_service":{"status":1}}}],"configuration_version":"1"}
          EOF

      - name: Compile procedural-only source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew compileDebugKotlin compileDebugUnitTestKotlin -PexcludeStressTests=true --stacktrace

      - name: Generate procedural-only prebuilt Room database
        shell: bash
        run: |
          set -euo pipefail
          rm -f app/src/main/assets/databases/career_seed_template.db
          CAREER_SEED_TEMPLATE_OUTPUT="$PWD/app/src/main/assets/databases/career_seed_template.db" ./gradlew testDebugUnitTest --tests com.example.data.CareerSeedTemplateGeneratorTest -PexcludeStressTests=true --stacktrace
          test -s app/src/main/assets/databases/career_seed_template.db
          python3 - <<'PY'
          import sqlite3
          p = 'app/src/main/assets/databases/career_seed_template.db'
          con = sqlite3.connect(p)
          print('quick_check=', con.execute('pragma quick_check').fetchone()[0])
          print('teams=', con.execute('select count(*) from teams').fetchone()[0])
          print('players=', con.execute('select count(*) from players').fetchone()[0])
          print('marker=', con.execute('select schemaVersion,assetSha256,teamCount,playerCount from career_seed_template_marker where id=1').fetchone())
          print('gamesaves=', con.execute('select count(*) from game_save').fetchone()[0])
          con.close()
          PY

      - name: Run focused procedural regressions
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest -PexcludeStressTests=true --tests com.example.data.ProceduralRosterOnlyTest --tests com.example.data.CareerSeedTemplateRuntimeTest --tests com.example.usecase.CareerCreationPerformanceTest --tests com.example.data.PreCareerEditorOverridesTest --stacktrace

      - name: Commit production patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-procedural-player-purge.yml \
            .github/scripts/tmp_procedural_purge.py \
            .github/scripts/tmp_procedural_cleanup.py \
            .github/scripts/tmp_procedural_cleanup_fix.py
          git add -A
          git diff --cached --check
          git commit -m "refactor: use procedural players only"
          git push origin HEAD:fix/3.0.1-manual-test-bugs

# retry after removing obsolete factual-seed unit fixtures
