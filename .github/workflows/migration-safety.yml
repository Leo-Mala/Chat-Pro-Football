name: Save and Migration Safety

# Diagnóstico manual. Os mesmos testes fazem parte da suíte não-stress executada pelo
# checkpoint consolidado em android.yml, evitando um segundo runner redundante.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          else
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Setup Debug Keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Run save-slot and Room migration safety tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            --tests com.example.SaveSlotIsolationTest \
            --tests com.example.migrations.MigrationSafetyTest \
            --tests com.example.migrations.MigrationCompatibilityTest \
            --stacktrace
