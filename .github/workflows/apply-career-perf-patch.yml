name: Apply Career Perf Patch

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/apply-career-perf-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0

      - name: Patch exact career creation block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path('app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt')
          text = path.read_text()
          start_marker = '        // 2. Geração limpa de jogadores para todos os times\n'
          end_marker = '        val competitionCalendarMs = (System.nanoTime() - competitionCalendarStartedAtNs) / 1_000_000L\n'
          if start_marker not in text:
              raise SystemExit('Expected career creation start marker not found')
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = base64.b64decode('').decode()
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          git commit -m 'perf: skip redundant procedural roster seed'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
