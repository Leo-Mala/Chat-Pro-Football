name: Global Main Audit Diagnostics

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - '.github/workflows/global-main-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-main-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Bootstrap deterministic FC26 player asset
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fc26/bootstrap_fc26_asset.py
          python3 tools/fc26/validate_fc26.py \
            app/src/main/assets/football/fc26/fc26_players_2025-09-19.tsv.bin \
            app/src/main/assets/football/fc26/fc26_manifest.json

      - name: Setup dummy google-services for build-only audit
        shell: bash
        run: |
          set -euo pipefail
          cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF

      - name: Run frozen-main performance harness
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest \
            --tests com.example.data.GlobalMainAuditPerformanceStressTest \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace

      - name: Upload global audit performance report
        uses: actions/upload-artifact@v4
        with:
          name: global-main-audit-performance
          path: reports/global_main_audit_performance.json
          if-no-files-found: error

      - name: Time CareerFunctionalFlowTest
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'careerFunctionalFlowWallSeconds=%e\ncareerFunctionalFlowMaxRssKb=%M' \
            -o reports/global_main_audit_career_time.txt \
            ./gradlew testDebugUnitTest \
              --tests com.example.CareerFunctionalFlowTest \
              -PexcludeStressTests=true \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace

      - name: Time 20-season stress
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'twentySeasonWallSeconds=%e\ntwentySeasonMaxRssKb=%M' \
            -o reports/global_main_audit_20_season_time.txt \
            ./gradlew testDebugUnitTest \
              --tests com.example.TwentySeasonStressTest \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace

      - name: Time 100-season stress
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'hundredSeasonWallSeconds=%e\nhundredSeasonMaxRssKb=%M' \
            -o reports/global_main_audit_100_season_time.txt \
            ./gradlew testDebugUnitTest \
              --tests com.example.OneHundredSeasonMatchByMatchStressTest \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace

      - name: Upload timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-main-audit-timings
          path: reports/global_main_audit_*_time.txt
          if-no-files-found: warn

  release-diagnostics:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup dummy google-services for build-only audit
        shell: bash
        run: |
          set -euo pipefail
          cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF

      - name: Run lint and unsigned release diagnostics truthfully
        shell: bash
        run: |
          set +e
          mkdir -p reports
          ./gradlew lintDebug --stacktrace > reports/global_main_audit_lint.log 2>&1
          lint_status=$?
          ./gradlew assembleRelease --stacktrace > reports/global_main_audit_assemble_release.log 2>&1
          apk_status=$?
          ./gradlew bundleRelease --stacktrace > reports/global_main_audit_bundle_release.log 2>&1
          aab_status=$?
          printf 'lintDebugExit=%s\nassembleReleaseExit=%s\nbundleReleaseExit=%s\n' \
            "$lint_status" "$apk_status" "$aab_status" > reports/global_main_audit_release_status.txt
          cat reports/global_main_audit_release_status.txt
          exit $(( lint_status != 0 || apk_status != 0 || aab_status != 0 ))

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-main-audit-release-diagnostics
          path: |
            reports/global_main_audit_release_status.txt
            reports/global_main_audit_lint.log
            reports/global_main_audit_assemble_release.log
            reports/global_main_audit_bundle_release.log
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
