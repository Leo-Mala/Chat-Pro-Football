name: Phase 10.8 Full Scale Rollover Performance

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/phase108-full-scale-rollover-performance.yml'
      - 'app/**'
      - 'tools/fc26/**'
      - 'reports/phase_10_8_*'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-10-8-rollover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-scale-rollover:
    name: 60,885-player file-backed Room rollover
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$AUDIT_HEAD_SHA"
          echo "Phase 10.8 exact head: $actual"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Bootstrap deterministic FC26 asset
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fc26/bootstrap_fc26_asset.py
          python3 tools/fc26/validate_fc26.py \
            app/src/main/assets/football/fc26/fc26_players_2025-09-19.tsv.bin \
            app/src/main/assets/football/fc26/fc26_manifest.json

      - name: Setup validation google-services.json
        shell: bash
        run: |
          set -euo pipefail
          cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF

      - name: Measure exact-head full-scale season rollover
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            --tests com.example.data.Phase108FullScaleSeasonRolloverPerformanceTest \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace

      - name: Validate report is pinned to exact head
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('reports/phase_10_8_full_scale_rollover.json')
          data = json.loads(path.read_text())
          assert data['auditHead'] == os.environ['AUDIT_HEAD_SHA']
          assert data['dataset']['datasetPlayers'] == 18405
          assert data['dataset']['persistedPlayersIncludingFallback'] == 60885
          assert data['dataset']['duplicatePlayerIds'] == 0
          assert data['dataset']['duplicateTeamIds'] == 0
          assert data['dataset']['overallMutated'] == 0
          assert data['dataset']['potentialMutated'] == 0
          assert data['dataset']['attributesMutated'] == 0
          print(json.dumps({
              'auditHead': data['auditHead'],
              'rolloverMillis': data['timingMillis']['seasonRolloverTotal'],
              'queries': data['queries']['total'],
              'activeLoanLookupPerPlayer': data['queries']['activeLoanLookupPerPlayer'],
              'teamUpdateStatements': data['queries']['teamUpdateStatements'],
              'heapPeakObservedBytes': data['memory']['heapPeakObservedBytes'],
              'walPeakObservedBytes': data['sqlite']['walPeakObservedBytes'],
          }, indent=2))
          PY

      - name: Upload Phase 10.8 performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: phase-10-8-full-scale-rollover-${{ env.AUDIT_HEAD_SHA }}
          path: reports/phase_10_8_full_scale_rollover.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-10-8-rollover-test-report-${{ env.AUDIT_HEAD_SHA }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
