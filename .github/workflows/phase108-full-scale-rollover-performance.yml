name: Phase 10.8 Full Scale Rollover Performance

# Diagnóstico manual. A certificação completa de PR/main executa estes mesmos gates dentro de
# phase109-required-certification.yml. Assim alterações leves não disparam dois rollovers de 60.885
# jogadores, enquanto mudanças de alto risco continuam cobertas pelo Required Certification.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-10-8-rollover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-scale-rollover:
    name: 60,885-player file-backed Room rollover (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [normal, constrained]
    env:
      AUDIT_HEAD_SHA: ${{ github.sha }}
      PHASE108_PROFILE: ${{ matrix.profile }}
      PHASE108_RUNNER_LABEL: ubuntu-latest

    steps:
      - name: Checkout exact dispatch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$AUDIT_HEAD_SHA"
          echo "Phase 10.8 exact head: $actual profile=$PHASE108_PROFILE"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Bootstrap deterministic FC26 asset
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fc26/bootstrap_fc26_asset.py
          python3 tools/fc26/validate_fc26.py \
            app/src/main/assets/football/fc26/fc26_players_2025-09-19.tsv.bin \
            app/src/main/assets/football/fc26/fc26_manifest.json

      - name: Setup validation google-services.json
        shell: bash
        run: |
          set -euo pipefail
          cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id":"1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF

      - name: Measure exact-head full-scale season rollover
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew

          if [[ "$PHASE108_PROFILE" == "constrained" ]]; then
            allowed="$(taskset -pc $$ | sed 's/.*: //')"
            first_cpu="${allowed%%,*}"
            first_cpu="${first_cpu%%-*}"
            export PHASE108_CPU_CONSTRAINT="taskset-single-logical-cpu:${first_cpu}"
            export REPORT_PATH="reports/phase_10_8_full_scale_rollover_constrained.json"
            echo "PHASE108_CPU_CONSTRAINT=$PHASE108_CPU_CONSTRAINT" >> "$GITHUB_ENV"
            echo "REPORT_PATH=$REPORT_PATH" >> "$GITHUB_ENV"
            taskset -c "$first_cpu" ./gradlew testDebugUnitTest \
              --tests com.example.data.Phase108FullScaleSeasonRolloverPerformanceStressTest \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace
          else
            export PHASE108_CPU_CONSTRAINT="none"
            export REPORT_PATH="reports/phase_10_8_full_scale_rollover.json"
            echo "PHASE108_CPU_CONSTRAINT=$PHASE108_CPU_CONSTRAINT" >> "$GITHUB_ENV"
            echo "REPORT_PATH=$REPORT_PATH" >> "$GITHUB_ENV"
            ./gradlew testDebugUnitTest \
              --tests com.example.data.Phase108FullScaleSeasonRolloverPerformanceStressTest \
              --no-build-cache \
              --rerun-tasks \
              --stacktrace
          fi

      - name: Validate report is pinned to exact head and frozen budgets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['REPORT_PATH'])
          data = json.loads(path.read_text())
          assert data['auditHead'] == os.environ['AUDIT_HEAD_SHA']
          assert data['measurementKind'] == 'post_optimization_candidate'
          assert data['profile'] == os.environ['PHASE108_PROFILE']
          assert data['environment']['roomSchema'] == 22
          assert data['dataset']['datasetPlayers'] == 18405
          assert data['dataset']['validatedPlayers'] == 18405
          assert data['dataset']['processedPlayers'] == 18405
          assert data['dataset']['importedPlayers'] == 18405
          assert data['dataset']['notImported'] == 0
          assert data['dataset']['persistedPlayersIncludingFallback'] == 60885
          assert data['dataset']['clubs'] == 2524
          assert data['dataset']['datasetLoanPlayers'] == 1325
          assert data['dataset']['resolvedLoans'] == 816
          assert data['dataset']['rejectedLoans'] == 509
          assert data['dataset']['borrowerNotFound'] == 448
          assert data['dataset']['ownerNotFound'] == 60
          assert data['dataset']['ambiguousLoans'] == 1
          assert data['dataset']['duplicatePlayerIds'] == 0
          assert data['dataset']['duplicateTeamIds'] == 0
          assert data['dataset']['overallMutated'] == 0
          assert data['dataset']['potentialMutated'] == 0
          assert data['dataset']['attributesMutated'] == 0
          assert data['queries']['total'] <= 25000
          assert data['queries']['activeLoanLookupPerPlayer'] == 0
          assert data['queries']['fullEntityPlayerUpdates'] == 0
          assert data['queries']['teamUpdateStatements'] <= 500
          assert data['memory']['heapPeakObservedBytes'] <= 350000000
          assert data['sqlite']['walPeakObservedBytes'] <= 85000000
          assert data['sqlite']['walAfterTruncateCheckpointBytes'] <= 1048576
          assert data['nPlusOne']['activeLoanNPlusOneEliminated'] is True
          assert data['nPlusOne']['fullEntityPlayerUpdateLoopEliminated'] is True
          print(json.dumps({
              'auditHead': data['auditHead'],
              'profile': data['profile'],
              'rolloverMillis': data['timingMillis']['seasonRolloverTotal'],
              'stageMillis': data['timingMillis']['stages'],
              'queries': data['queries']['total'],
              'queriesByStage': data['queries']['byStage'],
              'activeLoanLookupPerPlayer': data['queries']['activeLoanLookupPerPlayer'],
              'fullEntityPlayerUpdates': data['queries']['fullEntityPlayerUpdates'],
              'teamUpdateStatements': data['queries']['teamUpdateStatements'],
              'heapPeakObservedBytes': data['memory']['heapPeakObservedBytes'],
              'gcCollectionsObserved': data['memory']['gcCollectionsObserved'],
              'walPeakObservedBytes': data['sqlite']['walPeakObservedBytes'],
              'walAfterTruncateCheckpointBytes': data['sqlite']['walAfterTruncateCheckpointBytes'],
              'queryReductionPercent': data['baselineComparison']['queryReductionPercent'],
              'rolloverImprovementPercent': data['baselineComparison']['rolloverImprovementPercent'],
          }, indent=2))
          PY

      - name: Upload Phase 10.8 exact-head performance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-10-8-full-scale-rollover-${{ matrix.profile }}-${{ env.AUDIT_HEAD_SHA }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-10-8-rollover-test-report-${{ matrix.profile }}-${{ env.AUDIT_HEAD_SHA }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
