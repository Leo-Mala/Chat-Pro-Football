name: Apply Career Timing Diagnostic Patch

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/apply-career-diagnostic-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0

      - name: Add on-device career timing diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt')
          text = path.read_text()
          old = (
              '        CareerCreationPerformanceMonitor.record(performanceSnapshot)\n'
              '        Log.i("CareerCreationPerformance", performanceSnapshot.toString())\n'
          )
          new = (
              '        CareerCreationPerformanceMonitor.record(performanceSnapshot)\n'
              '        Log.i("CareerCreationPerformance", performanceSnapshot.toString())\n'
              '        CareerCreationPerformanceMonitor.latest?.let { diagnostic ->\n'
              '            _toastMessage.emit(\n'
              '                "DIAG criação: total=${diagnostic.totalMs}ms | FC26=${diagnostic.factualSeedMaterializationMs}ms | " +\n'
              '                    "banco=${diagnostic.persistenceMs}ms | calendário=${diagnostic.competitionCalendarMs}ms"\n'
              '            )\n'
              '        }\n'
          )
          if old not in text:
              raise SystemExit('Expected career performance tail not found; refusing broad edit.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit focused diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          git diff --cached --check
          git commit -m 'test: expose career creation timing on device'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
