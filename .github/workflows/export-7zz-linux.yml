name: Export 7zz Linux helper

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/export-7zz-linux.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official 7-Zip Linux x64
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz \
            -o 7z2602-linux-x64.tar.xz
          mkdir out
          tar -xJf 7z2602-linux-x64.tar.xz -C out
          test -x out/7zz
          out/7zz | head -5
          sha256sum 7z2602-linux-x64.tar.xz out/7zz | tee SHA256SUMS.txt
      - name: Upload helper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 7zz-linux-x64-26.02
          path: |
            out/7zz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
