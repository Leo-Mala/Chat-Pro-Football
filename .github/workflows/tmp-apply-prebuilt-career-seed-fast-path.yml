name: Temporary Cleanup Career Seed Workflows

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/tmp-apply-prebuilt-career-seed-fast-path.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0

      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/tmp-apply-prebuilt-career-seed-fast-path.yml \
            .github/workflows/tmp-generate-career-seed-template.yml
          git commit -m "chore: remove temporary career seed workflows"
          git push origin HEAD:fix/3.0.1-manual-test-bugs
