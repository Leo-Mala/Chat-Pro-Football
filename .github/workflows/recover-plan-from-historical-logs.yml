name: Recover exact crest plan evidence from historical logs

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/recover-plan-from-historical-logs.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Scan retained workflow logs with contextual recovery
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_FP: d1e1d99114739fe4827a5aa37af2e0f7b71829dd87966ba406ddc622d6050e90
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered/contexts
          python3 - <<'PY'
          import json, os, pathlib, subprocess, zipfile, io, re

          repo = os.environ['REPO']
          target_fp = os.environ['TARGET_FP']
          out = pathlib.Path('recovered')
          ctxdir = out / 'contexts'
          runs = []
          page = 1
          while True:
              raw = subprocess.check_output([
                  'gh','api','--method','GET',f'repos/{repo}/actions/runs',
                  '-f','branch=fix/3.0.1-manual-test-bugs',
                  '-f','per_page=100','-f',f'page={page}',
              ], text=True)
              batch = json.loads(raw).get('workflow_runs', [])
              if not batch:
                  break
              runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          needles = [
              target_fp, 'validated-replacement-plan', 'replacement-plan', 'crest-sha256',
              'sourceCrestSha256', 'sourceCrestPath', 'legacyTeamId', 'sourceRevision',
              'identityEvidence', '.club-realization-input', 'generated-filler-slots',
              'preserved-factual-clubs', 'materialize_validated_patch_plan', 'hardened-plan',
              'DictWriter', 'writerow', 'writerows', 'plan_rows', '1907', 'club-realization',
          ]
          strong = [
              target_fp, 'validated-replacement-plan', 'sourceCrestSha256', 'sourceCrestPath',
              'legacyTeamId', '.club-realization-input', 'DictWriter', 'writerow', 'plan_rows',
          ]
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          summary, extracted_lines, context_index = [], [], []
          log_ok = log_missing = matched_runs = 0

          def merge_ranges(ranges):
              merged = []
              for start, end in sorted(ranges):
                  if not merged or start > merged[-1][1] + 1:
                      merged.append([start, end])
                  else:
                      merged[-1][1] = max(merged[-1][1], end)
              return merged

          for idx, run in enumerate(runs, 1):
              rid = run['id']
              name = run.get('name','')
              path = run.get('path','')
              sha = run.get('head_sha','')
              try:
                  data = subprocess.check_output(
                      ['gh','api','--method','GET',f'repos/{repo}/actions/runs/{rid}/logs'],
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  log_missing += 1
                  continue
              log_ok += 1
              try:
                  zf = zipfile.ZipFile(io.BytesIO(data))
              except zipfile.BadZipFile:
                  continue

              run_hits = []
              run_contexts = 0
              for member in zf.namelist():
                  if member.endswith('/'):
                      continue
                  lines = zf.read(member).decode('utf-8', errors='replace').splitlines()
                  hit_indexes = []
                  for pos, line in enumerate(lines):
                      folded = line.casefold()
                      if any(n.casefold() in folded for n in needles):
                          clean = ansi.sub('', line)
                          run_hits.append((member, pos + 1, clean))
                          hit_indexes.append(pos)
                  if not hit_indexes:
                      continue

                  # Preserve wide context around evidence so transient shell/Python code and
                  # CSV generation statements printed by Actions can be reconstructed exactly.
                  ranges = merge_ranges([(max(0, p - 120), min(len(lines) - 1, p + 120)) for p in hit_indexes])
                  safe_member = re.sub(r'[^A-Za-z0-9_.-]+', '_', member)[:120]
                  for block_no, (start, end) in enumerate(ranges, 1):
                      filename = f'{rid}__{safe_member}__{block_no:02d}__L{start+1}-L{end+1}.txt'
                      target = ctxdir / filename
                      body = [
                          f'run_id={rid}', f'head_sha={sha}', f'workflow={name}', f'path={path}',
                          f'member={member}', f'created_at={run.get("created_at")}',
                          f'context_lines={start+1}-{end+1}', '',
                      ]
                      for n in range(start, end + 1):
                          body.append(f'{n+1:06d}\t{ansi.sub("", lines[n])}')
                      target.write_text('\n'.join(body) + '\n', encoding='utf-8')
                      context_index.append({
                          'run_id': rid, 'head_sha': sha, 'workflow': name, 'workflow_path': path,
                          'member': member, 'start_line': start + 1, 'end_line': end + 1,
                          'file': str(target.relative_to(out)),
                      })
                      run_contexts += 1

              if run_hits:
                  matched_runs += 1
                  strong_hits = sum(
                      1 for _,_,line in run_hits
                      if any(s.casefold() in line.casefold() for s in strong)
                  )
                  score = strong_hits * 20 + len(run_hits)
                  summary.append({
                      'run_id': rid, 'name': name, 'path': path, 'head_sha': sha,
                      'created_at': run.get('created_at'), 'conclusion': run.get('conclusion'),
                      'hits': len(run_hits), 'strong_hits': strong_hits,
                      'context_blocks': run_contexts, 'score': score,
                  })
                  for member, lineno, line in run_hits:
                      extracted_lines.append(f'{rid}\t{sha}\t{name}\t{member}:{lineno}\t{line}')
              if idx % 50 == 0:
                  print(f'scanned={idx}/{len(runs)} logs_ok={log_ok} matched_runs={matched_runs}')

          summary.sort(key=lambda x: (-x['score'], -x['hits'], x['run_id']))
          (out/'run-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          (out/'context-index.json').write_text(json.dumps(context_index, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          (out/'matching-lines.tsv').write_text('\n'.join(extracted_lines)+'\n', encoding='utf-8')
          report = {
              'total_runs': len(runs), 'logs_downloaded': log_ok, 'logs_unavailable': log_missing,
              'matched_runs': matched_runs, 'matching_lines': len(extracted_lines),
              'context_blocks': len(context_index),
              'target_fingerprint_hits': sum(target_fp in line for line in extracted_lines),
              'top_runs': summary[:40],
          }
          (out/'REPORT.json').write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Extract likely plan rows and provenance references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('recovered/matching-lines.tsv').read_text(encoding='utf-8', errors='replace').splitlines()
          candidates, urls, hashes = [], [], []
          for line in src:
              if re.search(r'\bclub_\d+\.(?:png|svg)\b', line, re.I) or any(k in line for k in ('sourceCrestPath','sourceCrestSha256','legacyTeamId','identityEvidence')):
                  candidates.append(line)
              urls += re.findall(r'https?://[^\s\"\']+', line)
              hashes += re.findall(r'\b[0-9a-f]{64}\b', line, re.I)
          Path('recovered/likely-plan-lines.tsv').write_text('\n'.join(candidates)+'\n', encoding='utf-8')
          Path('recovered/urls.txt').write_text('\n'.join(sorted(set(urls)))+'\n', encoding='utf-8')
          Path('recovered/sha256-values.txt').write_text('\n'.join(sorted(set(h.lower() for h in hashes)))+'\n', encoding='utf-8')
          print(f'likely_plan_lines={len(candidates)} unique_urls={len(set(urls))} unique_sha256={len(set(h.lower() for h in hashes))}')
          PY

      - name: Upload contextual recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-crest-plan-context-recovery-${{ github.sha }}
          path: recovered/
          if-no-files-found: error
          retention-days: 3
