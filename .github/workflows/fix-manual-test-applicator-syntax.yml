name: Fix Manual Test Applicator Syntax

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - '.github/workflows/fix-manual-test-applicator-syntax.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-manual-test-applicator-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bugfix branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0

      - name: Repair malformed applicator tail
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/manual_test/apply_runtime_bugfix_round_20260831.py')
          text = path.read_text(encoding='utf-8')
          marker = "# Persist the focused suite in the branch's normal manual-test workflow.\n"
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('applicator tail marker not found')

          tail = '''# Persist the focused suite in the branch's normal manual-test workflow.
          workflow = ".github/workflows/manual-test-bugfix-apk.yml"
          slash = chr(92)
          old_suite = "\\n".join([
              f"            --tests com.example.ui.viewmodel.LiveMatchSkipRegressionTest {slash}",
              f"            --tests com.example.data.PreCareerEditorOverridesTest {slash}",
          ])
          new_suite = "\\n".join([
              f"            --tests com.example.ui.viewmodel.LiveMatchSkipRegressionTest {slash}",
              f"            --tests com.example.ui.viewmodel.LiveMatchPersistenceOrderingRegressionTest {slash}",
              f"            --tests com.example.ui.screens.ClubCrestUiIdentityRegressionTest {slash}",
              f"            --tests com.example.usecase.CompletedFixtureDashboardRegressionTest {slash}",
              f"            --tests com.example.usecase.MonthlyEvolutionWeekFourRegressionTest {slash}",
              f"            --tests com.example.usecase.SeasonSimulationRegressionTest {slash}",
              f"            --tests com.example.data.PreCareerEditorOverridesTest {slash}",
          ])
          replace_exact(workflow, old_suite, new_suite)

          print("Focused runtime bugfix patch applied successfully.")
          '''
          path.write_text(text[:pos] + tail, encoding='utf-8')
          PY
          python3 -m py_compile tools/manual_test/apply_runtime_bugfix_round_20260831.py
          git diff --check

      - name: Commit repaired applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/manual_test/apply_runtime_bugfix_round_20260831.py
          git diff --cached --check
          git commit -m 'fix: repair runtime bugfix applicator syntax'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
