name: Apply manual-test regression patch

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/apply-manual-test-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-manual-test-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact patch bootstrap head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/3.0.1-manual-test-bugs
          test "$(git rev-parse origin/fix/3.0.1-manual-test-bugs)" = "$GITHUB_SHA"

      - name: Apply exact source and regression changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: anchor count {found}, expected {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          match = 'app/src/main/java/com/example/ui/viewmodel/GameViewModelMatch.kt'
          replace(match,
          '''import com.example.usecase.DatabaseIntegrityUseCase\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.delay\nimport kotlinx.coroutines.flow.update\nimport kotlinx.coroutines.launch\n''',
          '''import com.example.usecase.DatabaseIntegrityUseCase\nimport java.util.WeakHashMap\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.delay\nimport kotlinx.coroutines.flow.MutableStateFlow\nimport kotlinx.coroutines.flow.StateFlow\nimport kotlinx.coroutines.flow.asStateFlow\nimport kotlinx.coroutines.flow.update\nimport kotlinx.coroutines.launch\n''')
          replace(match,
          '''private class StaleWeeklyMonthlyEvolutionRollback : RuntimeException()\n''',
          '''private class StaleWeeklyMonthlyEvolutionRollback : RuntimeException()\n\ninternal class LiveMatchFinalizationGate {\n    private val _finalizing = MutableStateFlow(false)\n    val finalizing: StateFlow<Boolean> = _finalizing.asStateFlow()\n\n    @Synchronized\n    fun tryBegin(): Boolean {\n        if (_finalizing.value) return false\n        _finalizing.value = true\n        return true\n    }\n\n    @Synchronized\n    fun complete() {\n        _finalizing.value = false\n    }\n\n    fun isActive(): Boolean = _finalizing.value\n}\n\nprivate val liveMatchFinalizationGates = WeakHashMap<GameViewModel, LiveMatchFinalizationGate>()\nprivate val liveMatchFinalizationGatesGuard = Any()\n\nprivate fun GameViewModel.liveMatchFinalizationGate(): LiveMatchFinalizationGate =\n    synchronized(liveMatchFinalizationGatesGuard) {\n        liveMatchFinalizationGates.getOrPut(this) { LiveMatchFinalizationGate() }\n    }\n\nval GameViewModel.liveMatchFinalizing: StateFlow<Boolean>\n    get() = liveMatchFinalizationGate().finalizing\n\ninternal fun liveMatchUserControlsEnabled(\n    state: GameViewModel.MatchState,\n    finalizing: Boolean\n): Boolean = !finalizing &&\n    (state == GameViewModel.MatchState.PLAYING || state == GameViewModel.MatchState.PAUSED)\n\ninternal fun liveMatchCanBeginFinalization(\n    state: GameViewModel.MatchState,\n    finalizing: Boolean\n): Boolean = state != GameViewModel.MatchState.FINISHED && !finalizing\n''')
          replace(match,
          '''fun GameViewModel.startLiveMatch(fixture: Fixture) {\n    liveMatchJob?.cancel()\n''',
          '''fun GameViewModel.startLiveMatch(fixture: Fixture) {\n    if (liveMatchFinalizationGate().isActive()) return\n    liveMatchJob?.cancel()\n''')
          replace(match,
          '''    if (m >= 90 && _matchState.value == GameViewModel.MatchState.PLAYING) {\n        val fix = liveMatchFixture\n''',
          '''    val finalizationGate = liveMatchFinalizationGate()\n    if (\n        m >= 90 &&\n        _matchState.value == GameViewModel.MatchState.PLAYING &&\n        finalizationGate.tryBegin()\n    ) {\n        val fix = liveMatchFixture\n''')
          replace(match,
          '''        _matchState.value = GameViewModel.MatchState.FINISHED\n    }\n}\n\nfun GameViewModel.substitutePlayer''',
          '''        _matchState.value = GameViewModel.MatchState.FINISHED\n        finalizationGate.complete()\n    }\n}\n\nfun GameViewModel.substitutePlayer''')
          replace(match,
          '''fun GameViewModel.substitutePlayer(playerOut: Player, playerIn: Player) {\n    viewModelScope.launch(Dispatchers.IO) {\n''',
          '''fun GameViewModel.substitutePlayer(playerOut: Player, playerIn: Player) {\n    if (liveMatchFinalizationGate().isActive()) return\n    viewModelScope.launch(Dispatchers.IO) {\n''')
          replace(match,
          '''fun GameViewModel.pauseLiveMatch() {\n    _matchState.value = GameViewModel.MatchState.PAUSED\n    liveMatchJob?.cancel()\n}\n\nfun GameViewModel.resumeLiveMatch() {\n    if (_matchState.value == GameViewModel.MatchState.PAUSED) {\n''',
          '''fun GameViewModel.pauseLiveMatch() {\n    val finalizationGate = liveMatchFinalizationGate()\n    if (!liveMatchUserControlsEnabled(_matchState.value, finalizationGate.isActive())) return\n    if (_matchState.value != GameViewModel.MatchState.PLAYING) return\n    _matchState.value = GameViewModel.MatchState.PAUSED\n    liveMatchJob?.cancel()\n}\n\nfun GameViewModel.resumeLiveMatch() {\n    val finalizationGate = liveMatchFinalizationGate()\n    if (finalizationGate.isActive()) return\n    if (_matchState.value == GameViewModel.MatchState.PAUSED) {\n''')
          replace(match,
          '''fun GameViewModel.skipLiveMatch(fixture: Fixture? = null) {\n    liveMatchJob?.cancel()\n    liveMatchJob = viewModelScope.launch(Dispatchers.IO) {\n        val save = repo.getGameSave() ?: return@launch\n''',
          '''fun GameViewModel.skipLiveMatch(fixture: Fixture? = null) {\n    val finalizationGate = liveMatchFinalizationGate()\n    if (!liveMatchCanBeginFinalization(_matchState.value, finalizationGate.isActive())) return\n    if (!finalizationGate.tryBegin()) return\n    liveMatchJob?.cancel()\n    liveMatchJob = viewModelScope.launch(Dispatchers.IO) {\n        val save = repo.getGameSave()\n        if (save == null) {\n            finalizationGate.complete()\n            return@launch\n        }\n''')
          replace(match,
          '''        _matchState.value = GameViewModel.MatchState.FINISHED\n    }\n}\n\nsuspend fun GameViewModel.processMatchEventsAndStats''',
          '''        _matchState.value = GameViewModel.MatchState.FINISHED\n        finalizationGate.complete()\n    }\n}\n\nsuspend fun GameViewModel.processMatchEventsAndStats''')

          screen = 'app/src/main/java/com/example/ui/screens/MatchSimulationScreen.kt'
          replace(screen,
          '''    val matchState by viewModel.matchState.collectAsStateWithLifecycle()\n    val saveState by viewModel.gameSave.collectAsStateWithLifecycle()\n''',
          '''    val matchState by viewModel.matchState.collectAsStateWithLifecycle()\n    val isFinalizing by viewModel.liveMatchFinalizing.collectAsStateWithLifecycle()\n    val saveState by viewModel.gameSave.collectAsStateWithLifecycle()\n''')
          replace(screen,
          '''    var showTacticalDialog by remember { mutableStateOf(false) }\n\n    val hTeam = viewModel.liveMatchHomeTeam\n''',
          '''    var showTacticalDialog by remember { mutableStateOf(false) }\n    LaunchedEffect(isFinalizing) {\n        if (isFinalizing) showTacticalDialog = false\n    }\n\n    val hTeam = viewModel.liveMatchHomeTeam\n''')
          replace(screen,
          '''                    text = "PARTIDA EM ANDAMENTO",\n''',
          '''                    text = when {\n                        isFinalizing -> "FINALIZANDO PARTIDA..."\n                        matchState == GameViewModel.MatchState.FINISHED -> "PARTIDA ENCERRADA"\n                        else -> "PARTIDA EM ANDAMENTO"\n                    },\n''')
          replace(screen,
          '''                            .clickable {\n                                viewModel.changeLiveMatchSpeed(speedItem)\n                            },\n''',
          '''                            .clickable(\n                                enabled = !isFinalizing && matchState != GameViewModel.MatchState.FINISHED\n                            ) {\n                                viewModel.changeLiveMatchSpeed(speedItem)\n                            },\n''')
          replace(screen,
          '''        androidx.activity.compose.BackHandler {\n            if (matchState == GameViewModel.MatchState.FINISHED) {\n                viewModel.exitLiveMatch()\n            } else {\n                viewModel.pauseLiveMatch()\n            }\n        }\n''',
          '''        androidx.activity.compose.BackHandler {\n            when {\n                matchState == GameViewModel.MatchState.FINISHED -> viewModel.exitLiveMatch()\n                isFinalizing -> Unit\n                else -> viewModel.pauseLiveMatch()\n            }\n        }\n''')
          replace(screen,
          '''            } else {\n                if (matchState == GameViewModel.MatchState.PLAYING) {\n''',
          '''            } else if (isFinalizing) {\n                Button(\n                    onClick = {},\n                    enabled = false,\n                    modifier = Modifier.fillMaxWidth(),\n                    colors = ButtonDefaults.buttonColors(\n                        disabledContainerColor = CardSurfaceDark,\n                        disabledContentColor = AccentGold\n                    )\n                ) {\n                    CircularProgressIndicator(\n                        modifier = Modifier.size(18.dp),\n                        strokeWidth = 2.dp\n                    )\n                    Spacer(modifier = Modifier.width(8.dp))\n                    Text("FINALIZANDO PARTIDA...", fontWeight = FontWeight.Black)\n                }\n            } else {\n                if (matchState == GameViewModel.MatchState.PLAYING) {\n''')
          replace(screen,
          '''        if (showTacticalDialog) {\n''',
          '''        if (showTacticalDialog && !isFinalizing) {\n''')

          editor = 'app/src/main/java/com/example/ui/viewmodel/GameViewModelEditor.kt'
          replace(editor,
          '''import kotlinx.coroutines.flow.Flow\nimport kotlinx.coroutines.flow.flatMapLatest\nimport kotlinx.coroutines.flow.flowOf\n''',
          '''import kotlinx.coroutines.flow.Flow\nimport kotlinx.coroutines.flow.flatMapLatest\nimport kotlinx.coroutines.flow.flowOf\nimport kotlinx.coroutines.flow.map\nimport kotlinx.coroutines.flow.onStart\n''')
          replace(editor,
          '''fun GameViewModel.editorPlayersForTeamFlow(teamId: Long?): Flow<List<Player>> =\n    activeRepositoryFlow.flatMapLatest { repository ->\n        if (repository == null || teamId == null) flowOf(emptyList())\n        else repository.getPlayersForTeamFlow(teamId)\n    }\n\ninternal fun applyEditedTeamStrength''',
          '''fun GameViewModel.editorPlayersForTeamFlow(teamId: Long?): Flow<List<Player>> =\n    activeRepositoryFlow.flatMapLatest { repository ->\n        if (repository == null || teamId == null) flowOf(emptyList())\n        else repository.getPlayersForTeamFlow(teamId)\n    }\n\nsealed interface EditorPlayersLoadState {\n    data object Inactive : EditorPlayersLoadState\n    data class Loading(val teamId: Long?) : EditorPlayersLoadState\n    data class Ready(val teamId: Long?, val players: List<Player>) : EditorPlayersLoadState\n}\n\nprivate fun Flow<List<Player>>.asEditorPlayersLoadState(teamId: Long?): Flow<EditorPlayersLoadState> =\n    map<List<Player>, EditorPlayersLoadState> { players ->\n        EditorPlayersLoadState.Ready(teamId, players)\n    }.onStart { emit(EditorPlayersLoadState.Loading(teamId)) }\n\nfun GameViewModel.editorPlayersForEditorFlow(\n    teamId: Long?,\n    active: Boolean\n): Flow<EditorPlayersLoadState> {\n    if (!active) return flowOf(EditorPlayersLoadState.Inactive)\n    if (teamId == null) return allPlayers.asEditorPlayersLoadState(null)\n    return activeRepositoryFlow.flatMapLatest { repository ->\n        if (repository == null) flowOf(EditorPlayersLoadState.Loading(teamId))\n        else repository.getPlayersForTeamFlow(teamId).asEditorPlayersLoadState(teamId)\n    }\n}\n\ninternal fun editorRosterCountOrNull(\n    state: EditorPlayersLoadState,\n    teamId: Long?\n): Int? = (state as? EditorPlayersLoadState.Ready)\n    ?.takeIf { it.teamId == teamId }\n    ?.players\n    ?.size\n\ninternal fun applyEditedTeamStrength''')
          replace(editor,
          '''fun GameViewModel.ensureRosterForTeam(teamId: Long) {\n''',
          '''internal fun synchronizeExistingRosterForEditedTeam(\n    players: List<Player>,\n    newRating: Int\n): List<Player> = applyEditedTeamStrength(players, newRating)\n\ninternal fun resolveEditedTeamRating(team: Team, roster: List<Player>): Int =\n    if (roster.isNotEmpty() && roster.all { it.force == team.rating }) {\n        team.rating\n    } else {\n        GameEngine.calculateTeamRating(roster)\n    }\n\nfun GameViewModel.ensureRosterForTeam(teamId: Long) {\n''')
          old_save_team = '''fun GameViewModel.saveTeamFromEditor(team: Team) {\n    viewModelScope.launch(Dispatchers.IO) {\n        val editorRepository = preparedEditorRepositoryOrNull()\n            ?: awaitPreparedEditorRepositoryOrNull()\n            ?: return@launch\n        val finalTeamId = if (team.id == 0L) System.currentTimeMillis() else team.id\n        val teamToSave = team.copy(id = finalTeamId)\n        editorRepository.saveTeams(listOf(teamToSave))\n\n        val existingPlayers = editorRepository.getPlayersByTeam(finalTeamId)\n        if (existingPlayers.isEmpty()) {\n            val roster = DefaultData.generateRosterForTeam(finalTeamId, teamToSave.rating, teamToSave.name, teamToSave.country)\n            editorRepository.savePlayers(roster)\n        } else {\n            val currentAvg = existingPlayers.map { it.force }.average().toInt()\n            val delta = teamToSave.rating - currentAvg\n            if (delta != 0) {\n                val updatedPlayers = existingPlayers.map { p ->\n                    val newForce = (p.force + delta).coerceIn(30, 99)\n                    p.copy(\n                        force = newForce,\n                        potential = maxOf(p.potential, newForce + 3).coerceIn(35, 99)\n                    )\n                }\n                editorRepository.savePlayers(updatedPlayers)\n            }\n        }\n    }\n}\n'''
          new_save_team = '''fun GameViewModel.saveTeamFromEditor(team: Team) {\n    viewModelScope.launch(Dispatchers.IO) {\n        val editorRepository = preparedEditorRepositoryOrNull()\n            ?: awaitPreparedEditorRepositoryOrNull()\n            ?: return@launch\n        val finalTeamId = if (team.id == 0L) System.currentTimeMillis() else team.id\n        val teamToSave = team.copy(id = finalTeamId)\n\n        editorRepository.withTransaction {\n            editorRepository.saveTeams(listOf(teamToSave))\n            val existingPlayers = editorRepository.getPlayersByTeam(finalTeamId)\n            if (existingPlayers.isEmpty()) {\n                val generatedRoster = DefaultData.generateRosterForTeam(\n                    finalTeamId,\n                    teamToSave.rating,\n                    teamToSave.name,\n                    teamToSave.country\n                )\n                editorRepository.savePlayers(\n                    synchronizeExistingRosterForEditedTeam(generatedRoster, teamToSave.rating)\n                )\n            } else {\n                editorRepository.updatePlayers(\n                    synchronizeExistingRosterForEditedTeam(existingPlayers, teamToSave.rating)\n                )\n            }\n        }\n    }\n}\n'''
          replace(editor, old_save_team, new_save_team)
          replace(editor,
          '''        val newRating = ((attack + mid + def) / 3).coerceIn(15, 99)\n        val team = editorRepository.getTeam(teamId) ?: return@launch\n        editorRepository.updateTeam(team.copy(rating = newRating))\n\n        val players = editorRepository.getPlayersByTeam(teamId)\n        editorRepository.updatePlayers(applyEditedTeamStrength(players, newRating))\n''',
          '''        val newRating = ((attack + mid + def) / 3).coerceIn(15, 99)\n        editorRepository.withTransaction {\n            val team = editorRepository.getTeam(teamId) ?: return@withTransaction\n            editorRepository.updateTeam(team.copy(rating = newRating))\n            val players = editorRepository.getPlayersByTeam(teamId)\n            editorRepository.updatePlayers(\n                synchronizeExistingRosterForEditedTeam(players, newRating)\n            )\n        }\n''')
          replace(editor,
          '''                    val calculated = GameEngine.calculateTeamRating(roster)\n                    if (team.rating != calculated) {\n                        editorRepository.updateTeam(team.copy(rating = calculated))\n                    }\n''',
          '''                    val calculated = resolveEditedTeamRating(team, roster)\n                    if (team.rating != calculated) {\n                        editorRepository.updateTeam(team.copy(rating = calculated))\n                    }\n''')

          editor_screen = 'app/src/main/java/com/example/ui/screens/EditorScreen.kt'
          replace(editor_screen,
          '''    val allTeams by viewModel.allTeams.collectAsStateWithLifecycle()\n    val allPlayers by viewModel.allPlayers.collectAsStateWithLifecycle()\n''',
          '''    val allTeams by viewModel.allTeams.collectAsStateWithLifecycle()\n''')
          replace(editor_screen,
          '''    var playerSearchQuery by remember { mutableStateOf("") }\n    var selectedPlayerTeamFilter by remember { mutableStateOf<Long?>(null) } // null = Todos\n    val selectedTeamPlayers by remember(selectedPlayerTeamFilter) {\n        viewModel.editorPlayersForTeamFlow(selectedPlayerTeamFilter)\n    }.collectAsStateWithLifecycle(initialValue = emptyList())\n    var selectedPositionFilter by remember { mutableStateOf("Todas") }\n''',
          '''    var playerSearchQuery by remember { mutableStateOf("") }\n    var selectedPlayerTeamFilter by remember { mutableStateOf<Long?>(null) } // null = Todos\n    val editorPlayersState by remember(selectedPlayerTeamFilter, selectedTab) {\n        viewModel.editorPlayersForEditorFlow(\n            teamId = selectedPlayerTeamFilter,\n            active = selectedTab == 1\n        )\n    }.collectAsStateWithLifecycle(initialValue = EditorPlayersLoadState.Inactive)\n    val editorPlayersSnapshot = (editorPlayersState as? EditorPlayersLoadState.Ready)\n        ?.takeIf { it.teamId == selectedPlayerTeamFilter }\n        ?.players\n    val editorPlayers = editorPlayersSnapshot.orEmpty()\n    val editorPlayersLoading = selectedTab == 1 && editorPlayersSnapshot == null\n    var selectedPositionFilter by remember { mutableStateOf("Todas") }\n''')
          old_filtered = '''    val filteredPlayers = remember(allPlayers, selectedTeamPlayers, selectedTab, playerSearchQuery, selectedPlayerTeamFilter, selectedPositionFilter) {\n        if (selectedTab != 1) {\n            emptyList()\n        } else {\n            val playerSource = if (selectedPlayerTeamFilter != null) selectedTeamPlayers else allPlayers\n            var seq = playerSource.asSequence()\n            if (selectedPlayerTeamFilter != null) {\n                seq = seq.filter { it.teamId == selectedPlayerTeamFilter }\n            }\n            if (selectedPositionFilter != "Todas") {\n                seq = seq.filter { it.position.equals(selectedPositionFilter, ignoreCase = true) }\n            }\n            if (playerSearchQuery.isNotBlank()) {\n                val q = playerSearchQuery.trim()\n                seq = seq.filter { it.name.contains(q, ignoreCase = true) }\n            }\n            if (selectedPlayerTeamFilter == null && playerSearchQuery.isBlank()) {\n                seq = seq.take(100)\n            } else {\n                seq = seq.take(300)\n            }\n            seq.toList()\n        }\n    }\n'''
          new_filtered = '''    val filteredPlayers = remember(editorPlayers, selectedTab, playerSearchQuery, selectedPlayerTeamFilter, selectedPositionFilter) {\n        if (selectedTab != 1) {\n            emptyList()\n        } else {\n            var seq = editorPlayers.asSequence()\n            if (selectedPlayerTeamFilter != null) {\n                seq = seq.filter { it.teamId == selectedPlayerTeamFilter }\n            }\n            if (selectedPositionFilter != "Todas") {\n                seq = seq.filter { it.position.equals(selectedPositionFilter, ignoreCase = true) }\n            }\n            if (playerSearchQuery.isNotBlank()) {\n                val q = playerSearchQuery.trim()\n                seq = seq.filter { it.name.contains(q, ignoreCase = true) }\n            }\n            if (selectedPlayerTeamFilter == null && playerSearchQuery.isBlank()) {\n                seq = seq.take(100)\n            } else {\n                seq = seq.take(300)\n            }\n            seq.toList()\n        }\n    }\n'''
          replace(editor_screen, old_filtered, new_filtered)
          replace(editor_screen,
          '''                        text = "⚽ JOGADORES (${if (selectedPlayerTeamFilter != null) filteredPlayers.size else allPlayers.size})",\n''',
          '''                        text = if (selectedTab == 1) {\n                            "⚽ JOGADORES (${editorRosterCountOrNull(editorPlayersState, selectedPlayerTeamFilter)?.toString() ?: "…"})"\n                        } else {\n                            "⚽ JOGADORES"\n                        },\n''')
          replace(editor_screen,
          '''                                            text = "Elenco (${filteredPlayers.size} jogadores) • ${currentSelectedTeam.city}, ${currentSelectedTeam.state}",\n''',
          '''                                            text = if (editorPlayersLoading) {\n                                                "Elenco (carregando...) • ${currentSelectedTeam.city}, ${currentSelectedTeam.state}"\n                                            } else {\n                                                "Elenco (${filteredPlayers.size} jogadores) • ${currentSelectedTeam.city}, ${currentSelectedTeam.state}"\n                                            },\n''')
          replace(editor_screen,
          '''                        items(filteredPlayers, key = { it.id }) { player ->\n                            val playerTeam = teamMap[player.teamId]\n                            PlayerEditorCard(\n                                player = player,\n                                teamName = playerTeam?.name ?: "Sem Time",\n                                onEdit = { editingPlayer = player; isCreatingPlayer = false },\n                                onTransfer = { playerToTransfer = player },\n                                onDelete = { playerToDelete = player }\n                            )\n                        }\n''',
          '''                        if (editorPlayersLoading) {\n                            item {\n                                Box(\n                                    modifier = Modifier\n                                        .fillMaxWidth()\n                                        .padding(vertical = 28.dp),\n                                    contentAlignment = Alignment.Center\n                                ) {\n                                    Row(\n                                        verticalAlignment = Alignment.CenterVertically,\n                                        horizontalArrangement = Arrangement.spacedBy(10.dp)\n                                    ) {\n                                        CircularProgressIndicator(\n                                            modifier = Modifier.size(20.dp),\n                                            strokeWidth = 2.dp\n                                        )\n                                        Text(\n                                            "CARREGANDO ELENCO...",\n                                            color = Color.Gray,\n                                            fontSize = 12.sp,\n                                            fontWeight = FontWeight.Bold\n                                        )\n                                    }\n                                }\n                            }\n                        } else {\n                            items(filteredPlayers, key = { it.id }) { player ->\n                                val playerTeam = teamMap[player.teamId]\n                                PlayerEditorCard(\n                                    player = player,\n                                    teamName = playerTeam?.name ?: "Sem Time",\n                                    onEdit = { editingPlayer = player; isCreatingPlayer = false },\n                                    onTransfer = { playerToTransfer = player },\n                                    onDelete = { playerToDelete = player }\n                                )\n                            }\n                        }\n''')

          transfers = 'app/src/main/java/com/example/usecase/ProcessTransfersUseCase.kt'
          replace(transfers,
          '''    companion object {\n        const val INSTALLMENT_COUNT = 3\n    }\n''',
          '''    companion object {\n        const val INSTALLMENT_COUNT = 3\n        const val MAX_ROSTER_SIZE = 35\n\n        fun canReceiveTransferredPlayer(rosterSize: Int): Boolean =\n            rosterSize < MAX_ROSTER_SIZE\n    }\n''')
          replace(transfers,
          '''    suspend fun sellPlayer(save: GameSave, player: Player, offerPrice: Long): TransferResult {\n        val roster = repository.getPlayersByTeam(save.playerTeamId)\n        return executeSale(save, player, offerPrice, roster)\n    }\n''',
          '''    suspend fun sellPlayer(save: GameSave, player: Player, offerPrice: Long): TransferResult {\n        val roster = repository.getPlayersByTeam(save.playerTeamId)\n        return executeSale(save, player, offerPrice, roster)\n    }\n\n    suspend fun findEligibleBuyerTeam(excludedTeamId: Long): Team? {\n        val candidates = repository.getAllTeams().filter { it.id != excludedTeamId }.shuffled()\n        for (candidate in candidates) {\n            if (canReceiveTransferredPlayer(repository.getPlayerCountByTeam(candidate.id))) {\n                return candidate\n            }\n        }\n        return null\n    }\n''')
          # Centralize all roster-capacity predicates on the single 35-player rule.
          for old, new in [
              ('if (roster.size >= 35 && player.teamId != save.playerTeamId)', 'if (!canReceiveTransferredPlayer(roster.size) && player.teamId != save.playerTeamId)'),
              ('if (freshRoster.size >= 35 && freshPlayer.teamId != currentSave.playerTeamId)', 'if (!canReceiveTransferredPlayer(freshRoster.size) && freshPlayer.teamId != currentSave.playerTeamId)'),
              ('if (repository.getPlayerCountByTeam(buyerTeamId) >= 35)', 'if (!canReceiveTransferredPlayer(repository.getPlayerCountByTeam(buyerTeamId)))'),
              ('if (repository.getPlayersByTeam(save.playerTeamId).size >= 35)', 'if (!canReceiveTransferredPlayer(repository.getPlayersByTeam(save.playerTeamId).size))'),
              ('if (currentRoster.size >= 35 && player.teamId != save.playerTeamId)', 'if (!canReceiveTransferredPlayer(currentRoster.size) && player.teamId != save.playerTeamId)'),
              ('if (repository.getPlayerCountByTeam(borrowerTeam.id) >= 35)', 'if (!canReceiveTransferredPlayer(repository.getPlayerCountByTeam(borrowerTeam.id)))'),
              ('if (repository.getPlayerCountByTeam(buyerTeam.id) >= 35)', 'if (!canReceiveTransferredPlayer(repository.getPlayerCountByTeam(buyerTeam.id)))'),
          ]:
              p = Path(transfers)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new), encoding='utf-8')

          old_buyer = '''        val otherTeams = repository.getAllTeams().filter { it.id != save.playerTeamId }\n        if (otherTeams.isEmpty()) return TransferResult.Error("Não houve clubes interessados no momento. O atleta ${player.name} permanecerá na equipe.")\n\n        var buyer: Team? = null\n        var attempts = 0\n        for (candidate in otherTeams.shuffled()) {\n            if (attempts++ >= 50) break\n            if (repository.getPlayerCountByTeam(candidate.id) < 30) {\n                buyer = candidate\n                break\n            }\n        }\n        buyer ?: return TransferResult.Error("Não houve clubes interessados no momento. O atleta ${player.name} permanecerá na equipe.")\n'''
          new_buyer = '''        val buyer = findEligibleBuyerTeam(save.playerTeamId)\n            ?: return TransferResult.Error("Não houve clubes interessados no momento. O atleta ${player.name} permanecerá na equipe.")\n'''
          replace(transfers, old_buyer, new_buyer)
          replace(transfers,
          '''            val currentSave = repository.getGameSave() ?: save\n            val newBalance = try { Math.addExact(currentSave.bankBalance, safePrice) } catch (_: ArithmeticException) { Long.MAX_VALUE }\n''',
          '''            if (!canReceiveTransferredPlayer(repository.getPlayerCountByTeam(buyer.id))) {\n                return@withTransaction TransferResult.Error("O clube comprador já possui o elenco cheio ($MAX_ROSTER_SIZE jogadores)!")\n            }\n            val currentSave = repository.getGameSave() ?: save\n            val newBalance = try { Math.addExact(currentSave.bankBalance, safePrice) } catch (_: ArithmeticException) { Long.MAX_VALUE }\n''')
          p = Path(transfers)
          text = p.read_text(encoding='utf-8')
          text = text.replace('requireNotNull(buyer).id', 'buyer.id')
          text = text.replace('requireNotNull(buyer).name', 'buyer.name')
          p.write_text(text, encoding='utf-8')
          replace(transfers,
          '''            val currentSave = repository.getGameSave() ?: save\n            val newBalance = try { Math.addExact(currentSave.bankBalance, downPayment) } catch (_: ArithmeticException) { Long.MAX_VALUE }\n''',
