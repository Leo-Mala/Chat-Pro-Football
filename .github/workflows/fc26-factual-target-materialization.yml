name: FC26 Factual Club Target Materialization

on:
  pull_request:
    branches: [ "main", "master" ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/src/main/java/com/example/MainApplication.kt'
      - 'app/src/main/java/com/example/data/EuropeanFactualClubTargetMaterializer2026_27.kt'
      - 'app/src/main/java/com/example/data/GlobalFootballSystem.kt'
      - 'app/src/main/java/com/example/data/EuropeanDomesticBaseline2026_27.kt'
      - 'app/src/main/java/com/example/data/StableTeamIdentityRegistry.kt'
      - 'app/src/test/java/com/example/data/EuropeanFactualClubTargetMaterializerTest.kt'
      - 'app/src/test/java/com/example/data/Fc26LegacyTeamIdPreservationTest.kt'
      - 'app/src/test/java/com/example/data/Fc26FactualTargetMaterializationReportTest.kt'
      - 'app/src/test/java/com/example/data/Fc26ClubCandidateReportTest.kt'
      - 'app/src/test/java/com/example/data/Fc26FullSeedIntegrationTest.kt'
      - '.github/workflows/fc26-factual-target-materialization.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fc26-factual-target-materialization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          else
            cat << 'GOOGLE_EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.brasfutretro.djuxzt"
                  }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyDummyKeyForBuildOnly123456" } ],
                "services": { "appinvite_service": { "status": 1 } }
              }
            ],
            "configuration_version": "1"
          }
          GOOGLE_EOF
          fi

      - name: Run factual target materialization tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest \
            --tests com.example.data.EuropeanFactualClubTargetMaterializerTest \
            --tests com.example.data.EuropeanStableTeamIdentityTest \
            --tests com.example.data.Fc26ClubMatcherTest \
            --tests com.example.data.Fc26LegacyTeamIdPreservationTest \
            --tests com.example.data.Fc26FactualTargetMaterializationReportTest \
            --tests com.example.data.Fc26ClubCandidateReportTest \
            --tests com.example.data.Fc26FullSeedIntegrationTest \
            --stacktrace

      - name: Validate factual target acceptance policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('reports/fc26_factual_target_materialization_report.json').read_text())
          after = report['after']
          safety = report['safety']
          materialization = report['materialization']

          assert report['source']['datasetPlayers'] == 18405
          assert materialization['verifiedCountries'] == 20
          assert materialization['factualTopFlightClubs'] == 320
          assert after['stableTargetsMissing'] == 0
          assert after['stableTargetsPresentButUnresolved'] == 0
          assert after['importedPlayers'] >= 4583
          assert safety['fuzzyAutoMatchingIntroduced'] is False
          assert safety['fc26RatingsMutated'] is False
          assert safety['fc26PotentialMutated'] is False
          assert safety['fc26AttributesMutated'] is False
          assert safety['roomMigrationRequired'] is False
          assert safety['roomVersion'] == 21
          print('FC26 factual target materialization policy validated')
          print(json.dumps({
              'targetTeams': after['targetTeams'],
              'matchedClubs': after['matchedClubs'],
              'unmatchedClubs': after['unmatchedClubs'],
              'ambiguousClubs': after['ambiguousClubs'],
              'importedPlayers': after['importedPlayers'],
              'skippedPlayers': after['skippedPlayers'],
              'fallbackRostersRequired': after['fallbackRostersRequired'],
              'stableTargetsPresentButUnresolved': after['stableTargetsPresentButUnresolved']
          }, indent=2))
          PY

      - name: Upload factual target diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fc26-factual-target-materialization
          path: |
            reports/fc26_factual_target_materialization_report.json
            reports/fc26_club_mapping_report.json
            reports/fc26_unmatched_candidates.json
            reports/fc26_missing_target_clubs.json
          if-no-files-found: error
