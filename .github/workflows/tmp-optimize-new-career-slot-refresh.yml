name: Temporary New Career Slot Refresh Optimization

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/3.0.1-manual-test-bugs
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Replace full slot reconciliation with authoritative local upsert
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt')
          text = path.read_text()
          old = '''        saveSlots.value = preferencesRepo.loadSaveSlots()\n\n        val totalMs = (System.nanoTime() - totalStartedAtNs) / 1_000_000L\n'''
          new = '''        // updateSlotMetadata acabou de persistir a projeção autoritativa deste slot.\n        // Não reconcilie os cinco bancos aqui: loadSaveSlots() inspeciona cada slot múltiplas\n        // vezes e transformava uma simples publicação de UI em I/O pesado no caminho crítico.\n        // A reconciliação completa continua sendo feita nas entradas normais da tela de saves.\n        val createdSlotMetadata = SaveSlotMetadata(\n            id = saveId,\n            exists = true,\n            coachName = save.coachName,\n            teamName = playerSelectedTeam?.name ?: "Sem Clube",\n            season = save.currentSeason,\n            week = save.currentWeek,\n            balance = save.bankBalance\n        )\n        saveSlots.value = saveSlots.value\n            .filterNot { it.id == saveId }\n            .plus(createdSlotMetadata)\n            .sortedBy { it.id.toIntOrNull() ?: Int.MAX_VALUE }\n\n        val totalMs = (System.nanoTime() - totalStartedAtNs) / 1_000_000L\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one critical-path refresh, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt').read_text()
          assert 'val createdSlotMetadata = SaveSlotMetadata(' in text
          assert '.filterNot { it.id == saveId }' in text
          marker = 'preferencesRepo.updateSlotMetadata(\n            saveId = saveId,'
          start = text.index(marker)
          end = text.index('val totalMs =', start)
          critical = text[start:end]
          assert 'preferencesRepo.loadSaveSlots()' not in critical
          print('critical-path slot publication contract: PASS')
          PY

      - name: Run focused regression tests
        run: >-
          ./gradlew testDebugUnitTest
          --tests com.example.usecase.CareerCreationPerformanceTest
          --tests com.example.ui.viewmodel.Phase106SaveSlotsPublicationGateTest
          --tests com.example.GamePreferencesRestoreSafetyTest
          --tests com.example.data.CareerSeedTemplateRuntimeTest
          --tests com.example.usecase.DatabaseIntegrityFastPathTest
          --stacktrace

      - name: Remove temporary workflow and commit functional change
        shell: bash
        run: |
          git rm .github/workflows/tmp-optimize-new-career-slot-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          git diff --cached --check
          git commit -m 'perf: avoid full slot reconciliation after career creation'
          git push origin HEAD:fix/3.0.1-manual-test-bugs
