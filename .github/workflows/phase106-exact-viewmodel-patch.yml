name: Phase 10.6 Exact ViewModel Patch

on:
  push:
    branches:
      - agent/phase-10-6-save-durability-recovery
    paths:
      - .github/workflows/phase106-exact-viewmodel-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-10-6-save-durability-recovery
          fetch-depth: 0

      - name: Apply exact save-safety guards
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt")
          text = path.read_text()

          old_country = '''    fun selectCountry(country: String) {
              val session = _activeSaveSession.value ?: return
              val targetRepo = session.repository
              val generation = session.generation
              _selectedCountry.value = country

              viewModelScope.launch(Dispatchers.IO) {
                  if (generation != sessionGeneration.get()) return@launch

                  targetRepo.deleteSave()
                  targetRepo.deleteFixtures()
                  targetRepo.deleteOffers()
                  _selectedTeamId.value = null

                  seedAllDefaultTeams(targetRepo, country)
              }
          }
          '''
          new_country = '''    fun selectCountry(country: String) {
              val session = _activeSaveSession.value ?: return
              val targetRepo = session.repository
              val generation = session.generation
              _selectedCountry.value = country

              viewModelScope.launch(Dispatchers.IO) {
                  if (generation != sessionGeneration.get()) return@launch

                  val inspection = saveRepository.inspectSlot(session.slotId)
                  if (!inspection.newGameAllowed) {
                      saveSlots.value = preferencesRepo.loadSaveSlots()
                      _toastMessage.emit(
                          if (inspection.save != null) {
                              "Este slot contém uma carreira existente. Nenhum dado foi alterado."
                          } else {
                              "Este slot precisa de recuperação. Nenhum dado foi alterado."
                          }
                      )
                      Log.w(
                          "GameViewModel",
                          "Troca de país bloqueada no slot ${session.slotId}: ${inspection.state}"
                      )
                      return@launch
                  }

                  targetRepo.deleteSave()
                  targetRepo.deleteFixtures()
                  targetRepo.deleteOffers()
                  _selectedTeamId.value = null

                  seedAllDefaultTeams(targetRepo, country)
              }
          }
          '''

          old_start = '''    private suspend fun performStartNewGameInternal(coachName: String, teamId: Long) {
              val saveId = _activeSaveSession.value?.slotId ?: return
              val activeCountry = _selectedCountry.value ?: "BRASIL"
              val season = 2026
          '''
          new_start = '''    private suspend fun performStartNewGameInternal(coachName: String, teamId: Long) {
              val saveId = _activeSaveSession.value?.slotId ?: return
              val inspection = saveRepository.inspectSlot(saveId)
              if (!inspection.newGameAllowed) {
                  saveSlots.value = preferencesRepo.loadSaveSlots()
                  _toastMessage.emit(
                      if (inspection.save != null) {
                          "Este slot contém uma carreira existente. Exclua-a explicitamente antes de criar um novo jogo."
                      } else {
                          "Este slot precisa de recuperação. Novo jogo bloqueado para preservar os dados."
                      }
                  )
                  Log.w(
                      "GameViewModel",
                      "Novo jogo bloqueado no slot $saveId: ${inspection.state}"
                  )
                  return
              }
              val activeCountry = _selectedCountry.value ?: "BRASIL"
              val season = 2026
          '''

          assert text.count(old_country) == 1, "selectCountry baseline snippet not unique"
          assert text.count(old_start) == 1, "performStartNewGameInternal baseline snippet not unique"
          text = text.replace(old_country, new_country, 1).replace(old_start, new_start, 1)
          path.write_text(text)

      - name: Verify minimal diff
        run: |
          git diff --check
          git diff --stat
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt"

      - name: Commit exact guard patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt
          git commit -m "fix(save): add fail-closed new-game preflight"
          git push origin HEAD:agent/phase-10-6-save-durability-recovery
