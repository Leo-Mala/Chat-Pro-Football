name: Diagnostic apply persistent season error

on:
  push:
    branches:
      - diagnostics/persistent-season-error-7188b09d

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply persistent simulation error patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vm_path = Path('app/src/main/java/com/example/ui/viewmodel/GameViewModel.kt')
          vm = vm_path.read_text()

          state_anchor = '    val simulationLogs: StateFlow<List<String>> = _simulationLogs.asStateFlow()\n'
          if state_anchor not in vm:
              raise SystemExit('GameViewModel simulation state anchor not found')
          vm = vm.replace(
              state_anchor,
              state_anchor + '''\n    internal val _lastSimulationError = MutableStateFlow<String?>(null)\n    val lastSimulationError: StateFlow<String?> = _lastSimulationError.asStateFlow()\n\n    fun dismissLastSimulationError() {\n        _lastSimulationError.value = null\n    }\n''',
              1,
          )

          start_anchor = '        _simulationLogs.value = emptyList()\n        _simulationCompetitionName.value = "Iniciando simulação..."\n'
          if start_anchor not in vm:
              raise SystemExit('GameViewModel simulation start anchor not found')
          vm = vm.replace(
              start_anchor,
              '        _simulationLogs.value = emptyList()\n        _lastSimulationError.value = null\n        _simulationCompetitionName.value = "Iniciando simulação..."\n',
              1,
          )

          catch_anchor = '''                        android.util.Log.e("GameViewModel", "Erro durante a simulação de temporada", e)\n                        _simulationLogs.value = listOf("Erro na simulação: ${e.localizedMessage ?: "Erro desconhecido"}") + _simulationLogs.value\n                        _toastMessage.emit("Simulação interrompida: ${e.localizedMessage ?: "Erro desconhecido"}")\n'''
          if catch_anchor not in vm:
              raise SystemExit('GameViewModel catch anchor not found')
          catch_replacement = '''                        android.util.Log.e("GameViewModel", "Erro durante a simulação de temporada", e)\n                        val errorSave = runCatching { repo.getGameSave() }.getOrNull()\n                        val errorSeason = errorSave?.currentSeason ?: gameSave.value?.currentSeason\n                        val errorWeek = errorSave?.currentWeek ?: _simulationCurrentWeek.value\n                        val errorType = e.javaClass.simpleName.ifBlank { e.javaClass.name }\n                        val errorMessage = e.localizedMessage ?: "Erro desconhecido"\n                        val errorDetail = "Temp. ${errorSeason ?: "?"} | Sem. $errorWeek | $errorType: $errorMessage"\n                        _lastSimulationError.value = errorDetail\n                        _simulationLogs.value = listOf("Erro na simulação: $errorDetail") + _simulationLogs.value\n                        _toastMessage.emit("Simulação interrompida: $errorMessage")\n'''
          vm = vm.replace(catch_anchor, catch_replacement, 1)
          vm_path.write_text(vm)

          dashboard_path = Path('app/src/main/java/com/example/ui/components/dashboard/DashboardTabContent.kt')
          dashboard = dashboard_path.read_text()

          collect_anchor = '    val simLogs by viewModel.simulationLogs.collectAsStateWithLifecycle()\n'
          if collect_anchor not in dashboard:
              raise SystemExit('Dashboard simulation state anchor not found')
          dashboard = dashboard.replace(
              collect_anchor,
              collect_anchor + '    val lastSimulationError by viewModel.lastSimulationError.collectAsStateWithLifecycle()\n',
              1,
          )

          top_anchor = '''    ) {\n        if (isSimulatingSeason) {\n'''
          if top_anchor not in dashboard:
              raise SystemExit('Dashboard top-level simulation anchor not found')
          persistent_card = '''    ) {\n        lastSimulationError?.let { error ->\n            Card(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .testTag("season_simulation_error_card"),\n                colors = CardDefaults.cardColors(\n                    containerColor = MaterialTheme.colorScheme.errorContainer\n                ),\n                shape = RoundedCornerShape(20.dp),\n                border = BorderStroke(\n                    1.dp,\n                    MaterialTheme.colorScheme.error.copy(alpha = 0.65f)\n                )\n            ) {\n                Column(modifier = Modifier.padding(16.dp)) {\n                    Row(\n                        modifier = Modifier.fillMaxWidth(),\n                        horizontalArrangement = Arrangement.SpaceBetween,\n                        verticalAlignment = Alignment.CenterVertically\n                    ) {\n                        Row(\n                            verticalAlignment = Alignment.CenterVertically,\n                            horizontalArrangement = Arrangement.spacedBy(8.dp)\n                        ) {\n                            Icon(\n                                imageVector = Icons.Default.Warning,\n                                contentDescription = null,\n                                tint = MaterialTheme.colorScheme.error\n                            )\n                            Text(\n                                text = "SIMULAÇÃO INTERROMPIDA",\n                                color = MaterialTheme.colorScheme.onErrorContainer,\n                                fontSize = 12.sp,\n                                fontWeight = FontWeight.Black,\n                                letterSpacing = 0.8.sp\n                            )\n                        }\n                        TextButton(\n                            onClick = { viewModel.dismissLastSimulationError() },\n                            modifier = Modifier.testTag("dismiss_season_simulation_error_button")\n                        ) {\n                            Text(\n                                text = "DISPENSAR",\n                                color = MaterialTheme.colorScheme.error,\n                                fontWeight = FontWeight.Bold\n                            )\n                        }\n                    }\n                    Spacer(modifier = Modifier.height(8.dp))\n                    Text(\n                        text = error,\n                        color = MaterialTheme.colorScheme.onErrorContainer,\n                        fontSize = 12.sp,\n                        fontWeight = FontWeight.Medium\n                    )\n                }\n            }\n        }\n\n        if (isSimulatingSeason) {\n'''
          dashboard = dashboard.replace(top_anchor, persistent_card, 1)
          dashboard_path.write_text(dashboard)

          test_path = Path('app/src/test/java/com/example/ui/viewmodel/SeasonSimulationContinuousRegressionTest.kt')
          test_path.write_text('''package com.example.ui.viewmodel\n\nimport java.io.File\nimport org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\nimport org.junit.Test\n\nclass SeasonSimulationContinuousRegressionTest {\n    @Test\n    fun seasonSimulationDoesNotStopForExpiringControlledContracts() {\n        val source = File("src/main/java/com/example/ui/viewmodel/GameViewModel.kt").readText()\n        assertFalse(source.contains("shouldPauseSeasonSimulationForExpiringContracts"))\n        assertFalse(source.contains("getControlledRosterExpiringContractCount"))\n        assertFalse(source.contains("Stop before playing/closing the week"))\n    }\n\n    @Test\n    fun simulationFailureRemainsDiagnosableAfterReturningToIdle() {\n        val source = File("src/main/java/com/example/ui/viewmodel/GameViewModel.kt").readText()\n        assertTrue(source.contains("android.util.Log.e(\\\"GameViewModel\\\", \\\"Erro durante a simulação de temporada\\\", e)"))\n        assertTrue(source.contains("_toastMessage.emit(\\\"Simulação interrompida:"))\n        assertFalse(source.contains("if (com.example.BuildConfig.DEBUG)"))\n        assertTrue(source.contains("internal val _lastSimulationError = MutableStateFlow<String?>(null)"))\n        assertTrue(source.contains("val lastSimulationError: StateFlow<String?> = _lastSimulationError.asStateFlow()"))\n        assertTrue(source.contains("fun dismissLastSimulationError()"))\n        assertTrue(source.contains("_lastSimulationError.value = null"))\n        assertTrue(source.contains("val errorSave = runCatching { repo.getGameSave() }.getOrNull()"))\n        assertTrue(source.contains("val errorType = e.javaClass.simpleName.ifBlank { e.javaClass.name }"))\n        assertTrue(source.contains("val errorDetail ="))\n        assertTrue(source.contains("Temp. "))\n        assertTrue(source.contains(" | Sem. "))\n        assertTrue(source.contains("_lastSimulationError.value = errorDetail"))\n\n        val dashboard = File("src/main/java/com/example/ui/components/dashboard/DashboardTabContent.kt").readText()\n        assertTrue(dashboard.contains("val lastSimulationError by viewModel.lastSimulationError.collectAsStateWithLifecycle()"))\n        assertTrue(dashboard.contains("lastSimulationError?.let { error ->"))\n        assertTrue(dashboard.contains("SIMULAÇÃO INTERROMPIDA"))\n        assertTrue(dashboard.contains("viewModel.dismissLastSimulationError()"))\n        assertTrue(dashboard.contains("season_simulation_error_card"))\n    }\n}\n''')
          PY

      - name: Run focused regression
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest --tests com.example.ui.viewmodel.SeasonSimulationContinuousRegressionTest

      - name: Remove temporary workflow and commit patch
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/diagnostic-apply-persistent-season-error.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: persist season simulation failures"
          git push origin HEAD:diagnostics/persistent-season-error-7188b09d
