name: Validate Career Test Stabilization

on:
  push:
    branches: [ "agent/v3-global-standings-qualification" ]
    paths:
      - '.github/workflows/career-test-validated-patch.yml'

permissions:
  contents: write

jobs:
  validate-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/v3-global-standings-qualification
          fetch-depth: 0

      - name: Patch flaky timing and reopen identity assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/java/com/example/CareerFunctionalFlowTest.kt')
          text = path.read_text()
          old_timeout = '        awaitDeferred(saveCompleted, timeoutMs = 15_000L)'
          new_timeout = '        awaitDeferred(saveCompleted, timeoutMs = 60_000L)'
          old_reopen = (
              '        val reopenedAcademyPlayer = reopenedRepository.getPlayersByTeam(selectedTeam.id)\n'
              '            .first { it.name == promotedProspect.name }'
          )
          new_reopen = (
              '        val reopenedAcademyPlayer = requireNotNull(reopenedRepository.getPlayer(promotedPlayer.id))'
          )
          if text.count(old_timeout) != 1:
              raise SystemExit('Expected one save callback timeout')
          if text.count(old_reopen) != 1:
              raise SystemExit('Expected one reopened academy lookup by name')
          path.write_text(text.replace(old_timeout, new_timeout, 1).replace(old_reopen, new_reopen, 1))
          PY
          git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            if echo "$GOOGLE_SERVICES_SECRET" | grep -q '^{'; then
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            fi
          else
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                "android_client_info": {"package_name": "com.aistudio.brasfutretro.djuxzt"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyDummyKeyForBuildOnly123456"}],
              "services": {"appinvite_service": {"status": 1}}
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Run career functional flow only
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests com.example.CareerFunctionalFlowTest --stacktrace

      - name: Commit patch only after test passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/java/com/example/CareerFunctionalFlowTest.kt
          git diff --cached --check
          git commit -m "test: stabilize career save callback and reopen identity"
          git push origin HEAD:agent/v3-global-standings-qualification
