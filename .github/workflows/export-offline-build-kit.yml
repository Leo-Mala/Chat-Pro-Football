name: Export offline build kit

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/export-offline-build-kit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact current head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"
          cp debug.keystore "$HOME/.android/debug.keystore"
      - name: Prime focused Gradle and Android dependencies
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon help
          ./gradlew --no-daemon testDebugUnitTest \
            -PexcludeStressTests=true \
            --tests com.example.data.BrasfootRealClubIdentityTest \
            --tests com.example.data.ProceduralRosterOnlyTest \
            --tests com.example.migrations.MigrationSafetyTest \
            --tests com.example.migrations.MigrationCompatibilityTest \
            --tests com.example.migrations.Migration20To21RelationalIntegrityTest
          ./gradlew --no-daemon assembleDebug -PexcludeStressTests=true
      - name: Build minimal offline kit
        shell: bash
        run: |
          set -euo pipefail
          KIT="$RUNNER_TEMP/offline-kit"
          ARCHIVE="$RUNNER_TEMP/offline-build-kit.tar.zst"
          mkdir -p "$KIT/gradle" "$KIT/android-sdk"
          test -d "$HOME/.gradle/wrapper"
          test -d "$HOME/.gradle/caches"
          cp -a "$HOME/.gradle/wrapper" "$KIT/gradle/"
          cp -a "$HOME/.gradle/caches" "$KIT/gradle/"
          rm -rf "$KIT/gradle/caches"/*/fileHashes "$KIT/gradle/caches"/*/fileContent 2>/dev/null || true
          for d in licenses platforms/android-35 platform-tools; do
            test -e "$ANDROID_HOME/$d"
            mkdir -p "$KIT/android-sdk/$(dirname "$d")"
            cp -a "$ANDROID_HOME/$d" "$KIT/android-sdk/$d"
          done
          mkdir -p "$KIT/android-sdk/build-tools"
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          test -n "$BT"
          cp -a "$ANDROID_HOME/build-tools/$BT" "$KIT/android-sdk/build-tools/$BT"
          printf '%s\n' "$BT" > "$KIT/BUILD_TOOLS_VERSION.txt"
          printf '%s\n' "${{ github.sha }}" > "$KIT/SOURCE_HEAD.txt"
          tar -C "$RUNNER_TEMP" -I 'zstd -T0 -6' -cf "$ARCHIVE" offline-kit
          test -s "$ARCHIVE"
          ls -lh "$ARCHIVE"
      - name: Upload offline kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-build-kit-${{ github.sha }}
          path: ${{ runner.temp }}/offline-build-kit.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
