name: Export Android Build Tools 34

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/export-offline-build-kit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-build-tools-34:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Android Build Tools 34.0.0
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/build-tools"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
      - name: Package exact Build Tools 34.0.0
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/android-build-tools-34.0.0.tar.zst"
          tar -C "$ANDROID_HOME/build-tools" -I 'zstd -T0 -6' -cf "$OUT" 34.0.0
          sha256sum "$OUT" > "$RUNNER_TEMP/android-build-tools-34.0.0.sha256"
          ls -lh "$OUT" "$RUNNER_TEMP/android-build-tools-34.0.0.sha256"
      - name: Upload Build Tools 34.0.0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-build-tools-34.0.0-${{ github.sha }}
          path: |
            ${{ runner.temp }}/android-build-tools-34.0.0.tar.zst
            ${{ runner.temp }}/android-build-tools-34.0.0.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
