name: Export Temurin JDK 17

on:
  push:
    branches:
      - fix/3.0.1-manual-test-bugs
    paths:
      - .github/workflows/export-offline-build-kit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-jdk17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Package exact JDK 17
        shell: bash
        run: |
          set -euo pipefail
          java -version
          test -x "$JAVA_HOME/bin/java"
          OUT="$RUNNER_TEMP/temurin-jdk17.tar.zst"
          tar -C "$(dirname "$JAVA_HOME")" -I 'zstd -T0 -6' -cf "$OUT" "$(basename "$JAVA_HOME")"
          sha256sum "$OUT" > "$RUNNER_TEMP/temurin-jdk17.sha256"
          printf '%s\n' "$JAVA_HOME" > "$RUNNER_TEMP/JAVA_HOME.txt"
          ls -lh "$OUT" "$RUNNER_TEMP/temurin-jdk17.sha256" "$RUNNER_TEMP/JAVA_HOME.txt"
      - name: Upload JDK 17
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temurin-jdk17-${{ github.sha }}
          path: |
            ${{ runner.temp }}/temurin-jdk17.tar.zst
            ${{ runner.temp }}/temurin-jdk17.sha256
            ${{ runner.temp }}/JAVA_HOME.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
