name: Fix Career Functional Test

on:
  push:
    branches: [ "agent/v3-global-standings-qualification" ]
    paths:
      - '.github/workflows/fix-career-test.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/v3-global-standings-qualification
          fetch-depth: 0

      - name: Stabilize academy promotion assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/test/java/com/example/CareerFunctionalFlowTest.kt')
          text = path.read_text()

          old_before = (
              "        val promotedProspect = initialProspects.first()\n"
              "        val rosterCountBeforePromotion = repository.getPlayerCountByTeam(selectedTeam.id)\n"
              "\n"
              "        val promotionJob = viewModel.promoteAcademyProspect(promotedProspect)"
          )
          new_before = (
              "        val promotedProspect = initialProspects.first()\n"
              "        val rosterBeforePromotion = repository.getPlayersByTeam(selectedTeam.id)\n"
              "        val rosterCountBeforePromotion = rosterBeforePromotion.size\n"
              "        val rosterIdsBeforePromotion = rosterBeforePromotion.map { it.id }.toSet()\n"
              "\n"
              "        val promotionJob = viewModel.promoteAcademyProspect(promotedProspect)"
          )

          old_after = (
              "        val promotedPlayer = repository.getPlayersByTeam(selectedTeam.id)\n"
              "            .first { it.name == promotedProspect.name }\n"
              "        assertTrue(promotedPlayer.isFromAcademy)\n"
              "        assertEquals(selectedTeam.country, promotedPlayer.nationality)"
          )
          new_after = (
              "        val promotedPlayer = repository.getPlayersByTeam(selectedTeam.id)\n"
              "            .single { it.id !in rosterIdsBeforePromotion }\n"
              "        assertEquals(promotedProspect.name, promotedPlayer.name)\n"
              "        assertTrue(promotedPlayer.isFromAcademy)\n"
              "        assertEquals(selectedTeam.country, promotedPlayer.nationality)"
          )

          if text.count(old_before) != 1:
              raise SystemExit('Expected one pre-promotion block')
          if text.count(old_after) != 1:
              raise SystemExit('Expected one promoted-player assertion block')

          path.write_text(text.replace(old_before, new_before, 1).replace(old_after, new_after, 1))
          PY

      - name: Commit stabilized test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/java/com/example/CareerFunctionalFlowTest.kt
          git diff --cached --check
          git commit -m "test: identify promoted academy player by new id"
          git push origin HEAD:agent/v3-global-standings-qualification
