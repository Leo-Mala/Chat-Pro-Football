name: Final external catalog crest audit

on:
  push:
    branches:
      - tmp/external-crest-audit
    paths:
      - .github/workflows/final-external-batch-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download and validate selected crest batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-external-batch/assets
          python3 - <<'PY'
          from __future__ import annotations
          import base64, csv, gzip, hashlib, io, re, struct, time, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          ENCODED = ""
          rows = list(csv.DictReader(io.StringIO(gzip.decompress(base64.b64decode(ENCODED)).decode('utf-8'))))
          if len(rows) != 81:
              raise SystemExit(f'expected 81 selected candidates, got {len(rows)}')

          UA = {'User-Agent': 'Mozilla/5.0 final-club-crest-audit/2.0'}
          def download(row):
              url = row['sourceCrestPath']
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers=UA)
                      with urllib.request.urlopen(req, timeout=45) as resp:
                          return row, resp.read(), resp.headers.get('Content-Type',''), resp.geturl(), ''
                  except Exception as exc:
                      last = exc
                      time.sleep(0.75 * (attempt + 1))
              return row, b'', '', url, repr(last)

          def png_meta(data):
              if len(data) < 33 or not data.startswith(b'\x89PNG\r\n\x1a\n') or data[12:16] != b'IHDR':
                  return None
              width, height, _bd, color_type = struct.unpack('>IIBB', data[16:26])
              has_alpha = color_type in (4,6) or (color_type == 3 and b'tRNS' in data)
              return width, height, color_type, has_alpha

          accepted=[]; rejected=[]; seen=set(); out=Path('final-external-batch/assets')
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures=[pool.submit(download,row) for row in rows]
              for fut in as_completed(futures):
                  row,data,ctype,final_url,error=fut.result()
                  if error:
                      rejected.append([row['country'],row['realClubName'],row['sourceCrestPath'],error]); continue
                  meta=png_meta(data)
                  if meta is None:
                      rejected.append([row['country'],row['realClubName'],final_url,'NOT_PNG']); continue
                  width,height,color_type,has_alpha=meta
                  if not has_alpha:
                      rejected.append([row['country'],row['realClubName'],final_url,f'PNG_NO_ALPHA_COLOR_TYPE_{color_type}']); continue
                  digest=hashlib.sha256(data).hexdigest()
                  if digest in seen:
                      rejected.append([row['country'],row['realClubName'],final_url,f'DUPLICATE_SHA256_{digest}']); continue
                  seen.add(digest); name=digest+'.png'; (out/name).write_bytes(data)
                  accepted.append({**row,'finalUrl':final_url,'contentType':ctype,'bytes':len(data),'width':width,'height':height,'colorType':color_type,'sourceCrestSha256':digest,'artifactFile':'assets/'+name})
          accepted.sort(key=lambda r:(r['country'],r['realClubName'].casefold()))
          with open('final-external-batch/accepted.csv','w',encoding='utf-8',newline='') as f:
              fields=list(accepted[0]) if accepted else list(rows[0])+['finalUrl','contentType','bytes','width','height','colorType','sourceCrestSha256','artifactFile']
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(accepted)
          with open('final-external-batch/rejected.csv','w',encoding='utf-8',newline='') as f:
              w=csv.writer(f);w.writerow(['country','realClubName','source','reason']);w.writerows(sorted(rejected))
          from collections import Counter
          counts=Counter(r['country'] for r in accepted); rejects=Counter(r[0] for r in rejected)
          summary='selected=81\naccepted=%d\nrejected=%d\nunique_hashes=%d\n' % (len(accepted),len(rejected),len(seen))
          for c in sorted(set(counts)|set(rejects)): summary += f'{c}: accepted={counts[c]} rejected={rejects[c]}\n'
          Path('final-external-batch/summary.txt').write_text(summary,encoding='utf-8')
          print(summary)
          PY

      - name: Upload audited selected crest batch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-external-batch-${{ github.sha }}
          path: final-external-batch/
          if-no-files-found: error
          retention-days: 2
