name: Repair Gradle Wrapper

on:
  push:
    branches:
      - agent/v3-project-integrity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-wrapper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/v3-project-integrity

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install trusted Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          validate-wrappers: false

      - name: Regenerate wrapper from trusted Gradle
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper \
            --gradle-version 8.10.2 \
            --distribution-type bin \
            --gradle-distribution-sha256-sum 31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26
          chmod +x gradlew
          echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict

      - name: Commit repaired wrapper files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat
          if git diff --cached --quiet; then
            echo 'Wrapper already matches trusted Gradle 8.10.2 output.'
            exit 0
          fi
          git commit -m 'build: regenerate trusted Gradle 8.10.2 wrapper'
          git push origin HEAD:agent/v3-project-integrity
